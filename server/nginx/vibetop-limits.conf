# Rate/connection zones for the ONE public, unauthenticated path: /s/<token>.
#
# SEPARATE FILE ON PURPOSE. These used to live in vibetop-upgrade.conf, which the
# installer skips entirely whenever a $connection_upgrade map is already defined
# anywhere under /etc/nginx — true on every host that has ever been installed. The
# zones then never landed while the /s/ location still referenced them, and nginx
# refused the config with "zero size shared memory zone". A conditional fragment
# cannot carry an unconditional dependency.
#
# Defence in depth behind the manager's own per-token archive semaphore, which is
# the real gate: it is IP-independent, and over the Cloudflare tunnel every
# request arrives from 127.0.0.1 so $binary_remote_addr lumps all tunnel users
# together. Deliberately generous — a human clicking a share link a dozen times
# must never see a 429, while a flood still meets a ceiling. Raise them, don't
# remove them, if a legitimate client trips.
limit_req_zone  $binary_remote_addr zone=vt_share_req:1m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=vt_share_conn:1m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate/connection zones for the ONE public, unauthenticated path: /s/<token>.
# Defence in depth behind the manager's own per-token archive semaphore — the
# semaphore is the real gate (it is IP-independent, which matters because over
# the Cloudflare tunnel every request arrives from 127.0.0.1 and $binary_remote_addr
# lumps all tunnel users together). These are deliberately generous: a human
# clicking a share link a dozen times must never see a 429, while a flood still
# meets a ceiling. Raise them, don't remove them, if a legitimate client trips.
limit_req_zone  $binary_remote_addr zone=vt_share_req:1m rate=60r/m;
limit_conn_zone $binary_remote_addr zone=vt_share_conn:1m;

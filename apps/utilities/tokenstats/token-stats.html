<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Token Stats</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0e1117; color: #e6edf3; font-family: system-ui, sans-serif;
    font-size: 14px; overflow-y: auto; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 18px; margin: 0; font-weight: 650; display: flex; align-items: center; gap: 10px; }
  #pageTitle { flex: 0 0 160px; white-space: nowrap; }
  h1 .tag { font-size: 11px; font-weight: 600; color: #d2902a; border: 1px solid #4a3a1a;
            background: #241d10; padding: 1px 7px; border-radius: 999px; white-space: nowrap; flex: 0 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .sub { color: #7a8a9a; font-size: 12px; margin: 2px 0 16px; }
  .sub a, .refresh { color: #58a6ff; cursor: pointer; }
  .refresh { font-size: 12px; user-select: none; }
  .refresh:hover { text-decoration: underline; }
  .tabs { display: inline-flex; gap: 3px; padding: 3px; margin: 12px 0 16px;
          border: 1px solid #2a3040; border-radius: 10px; background: #10151c; }
  .tabs button { border: 0; border-radius: 7px; padding: 7px 16px; background: transparent;
                 color: #8b9bad; font: 600 12px system-ui; cursor: pointer; }
  .tabs button.on { color: #fff; background: #283444; box-shadow: 0 1px 4px #0005; }

  /* Summary cards */
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .card { background: #161b22; border: 1px solid #2a3040; border-radius: 10px; padding: 12px 14px; }
  .card .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #7a8a9a; }
  .card .cost { font-size: 24px; font-weight: 700; margin: 4px 0 2px; color: #e6edf3; font-variant-numeric: tabular-nums; }
  .card .tok { font-size: 12px; color: #9fb0c0; font-variant-numeric: tabular-nums; }
  .card .req { font-size: 11px; color: #6a7a8a; margin-top: 3px; }

  .panel { background: #161b22; border: 1px solid #2a3040; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .panel h2 { font-size: 13px; margin: 0 0 12px; font-weight: 600; color: #c8d4e0;
              display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .seg { display: inline-flex; border: 1px solid #2a3040; border-radius: 7px; overflow: hidden; }
  .seg button { background: transparent; color: #9fb0c0; border: 0; padding: 3px 10px; font-size: 11px; cursor: pointer; font-family: inherit; }
  .seg button.on { background: #2a3444; color: #fff; }

  /* Averages */
  .avgs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .avg { background: #10151c; border: 1px solid #232b36; border-radius: 8px; padding: 10px 12px; }
  .avg .k { font-size: 11px; color: #7a8a9a; }
  .avg .v { font-size: 18px; font-weight: 700; margin: 3px 0 1px; font-variant-numeric: tabular-nums; }
  .avg .t { font-size: 11px; color: #8a9aaa; font-variant-numeric: tabular-nums; }

  /* Bar charts (y-axis column + gridlined plot area) */
  .chart-box { display: flex; gap: 8px; }
  .chart-y { width: 48px; height: 150px; display: flex; flex-direction: column;
             justify-content: space-between; text-align: right; color: #6a7a8a;
             font-size: 10px; font-variant-numeric: tabular-nums; }
  .chart-main { flex: 1 1 0; min-width: 0; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 150px;
          background:
            linear-gradient(#232b36, #232b36) left 0    / 100% 1px no-repeat,
            linear-gradient(#232b36, #232b36) left 50%  / 100% 1px no-repeat; }
  .bars.hourly { gap: 2px; }
  .bar { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; position: relative; }
  .bar > i { display: block; width: 100%; background: #3a7adb; border-radius: 2px 2px 0 0; min-height: 1px; transition: height .3s; }
  .bar > i + i { border-radius: 0; }
  .legend { display: inline-flex; gap: 10px; color: #8a9aaa; font-size: 10px; font-weight: 400; }
  .legend[hidden] { display: none; }
  .legend b { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  .bar.dim > i { background: #24303f; }
  .bar:hover > i { filter: brightness(1.25); }
  .bar .tip { display: none; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
              background: #0b0e14; border: 1px solid #2a3040; border-radius: 6px; padding: 4px 8px;
              font-size: 11px; white-space: nowrap; z-index: 5; pointer-events: none; margin-bottom: 4px; }
  .bar:hover .tip { display: block; }
  /* One cell per bar (matching .bars gap) so tick labels align under bars. */
  .axis { display: flex; gap: 3px; color: #6a7a8a; font-size: 10px; margin-top: 6px; }
  .axis.hourly { gap: 2px; }
  /* One slot per bar, so a label sits under the bar it names. The label itself
     is positioned, NOT text-aligned: a slot is ~6px wide on a phone and a date
     is ~26px, and in LTR an overflowing line always starts at the content-box
     left edge and spills RIGHT — `text-align: right` only moves lines that FIT.
     So the last label began at the right edge of the axis and ran out past the
     panel border, dragging a horizontal scrollbar onto the whole page. Anchored
     ends can't leave the axis. */
  .axis span { flex: 1 1 0; min-width: 0; position: relative; height: 12px; }
  .axis i { position: absolute; top: 0; white-space: nowrap; font-style: normal; }
  .axis i.l { left: 0; }
  .axis i.c { left: 50%; transform: translateX(-50%); }
  .axis i.r { right: 0; }

  /* Model table */
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; table-layout: fixed; }
  th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid #20262f; white-space: nowrap; }
  th { color: #7a8a9a; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  td:first-child, th:first-child { text-align: left; }
  th:first-child { width: 38%; }
  .model-cell { min-width: 0; overflow: hidden; }
  .model-name { display: inline-block; max-width: calc(100% - 20px); overflow: hidden;
                vertical-align: middle; white-space: nowrap; }
  .mdot { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 8px; vertical-align: middle; }
  .costbar { height: 5px; border-radius: 3px; margin-top: 4px; background: #3a7adb; }
  .muted { color: #7a8a9a; }

  @media (max-width: 720px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .bars { height: 120px; }
    table { font-size: 12px; }
    th, td { padding: 6px 5px; }
    .hide-sm { display: none; }
    th:first-child { width: 52%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1><span id="pageTitle">Combined usage</span> <span class="tag">API-equivalent estimate</span></h1>
    <span class="refresh" id="refresh">↻ refresh</span>
  </div>
  <div class="sub" id="sub">Loading…</div>
  <div class="tabs" id="providerTabs" role="tablist">
    <button class="on" data-provider="combined">Combined</button>
    <button data-provider="claude">Claude</button>
    <button data-provider="codex">Codex</button>
  </div>

  <div class="cards" id="cards"></div>

  <div class="panel">
    <h2>Averages</h2>
    <div class="avgs" id="avgs"></div>
  </div>

  <div class="panel">
    <h2>Per day (last 30 days)
      <span class="legend" id="dayLegend" hidden><span><b style="background:#d2902a"></b>Claude</span><span><b style="background:#34a8a0"></b>Codex</span></span>
      <span class="seg" id="daymode"><button data-m="cost" class="on">Cost</button><button data-m="tokens">Tokens</button></span>
    </h2>
    <div class="chart-box">
      <div class="chart-y" id="dayY"></div>
      <div class="chart-main">
        <div class="bars" id="dayBars"></div>
        <div class="axis" id="dayAxis"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>Per hour (last 48 h) <span class="legend" id="hourLegend" hidden><span><b style="background:#d2902a"></b>Claude</span><span><b style="background:#34a8a0"></b>Codex</span></span></h2>
    <div class="chart-box">
      <div class="chart-y" id="hourY"></div>
      <div class="chart-main">
        <div class="bars hourly" id="hourBars"></div>
        <div class="axis" id="hourAxis"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>By model <span class="muted" id="cacheStat"></span></h2>
    <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th>Model</th><th>Requests</th><th class="hide-sm">Input</th><th class="hide-sm">Output</th>
        <th class="hide-sm">Cache read</th><th>Est. cost</th>
      </tr></thead>
      <tbody id="modelRows"></tbody>
    </table>
    </div>
  </div>
</div>

<script>
"use strict";
var MODEL_COLOR = { opus: '#d2902a', fable: '#a479e2', haiku: '#34a853', sonnet: '#3a7adb' };
function tier(m){ m=(m||'').toLowerCase();
  if (m.indexOf('haiku')>=0) return 'haiku';
  if (m.indexOf('sonnet')>=0) return 'sonnet';
  if (m.indexOf('fable')>=0||m.indexOf('mythos')>=0) return 'fable';
  return 'opus'; }
function color(m){ m=m||''; return (m.indexOf('Codex ·')===0 || m.toLowerCase().indexOf('gpt-')===0) ? '#34a8a0' : MODEL_COLOR[tier(m)] || '#3a7adb'; }
function fmtTok(n){
  if (n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'M';
  if (n >= 1e3) return (n/1e3).toFixed(1)+'K';
  return String(n||0);
}
function fmtCostFull(c){ return '$'+(c||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
}); }
function middleEllipsis(s, max){
  s=String(s||'');
  if(s.length<=max) return s;
  var left=Math.ceil((max-1)/2), right=Math.floor((max-1)/2);
  return s.slice(0,left)+'…'+s.slice(s.length-right);
}
// Short axis-tick label for cost — natural round values ($0, $100, $1.5k).
function axisCost(v){
  if (v >= 1000) return '$' + +(v/1000).toFixed(1) + 'k';
  return '$' + +v.toFixed(v < 10 ? 1 : 0);
}

var dayMode = 'cost';
var lastData = null;
var providerData = null;
var currentProvider = 'combined';

function addRows(a,b){
  var out={}; ['in','out','cw','cr','tokens','cost','req'].forEach(function(k){ out[k]=(a[k]||0)+(b[k]||0); });
  out.cost=Math.round(out.cost*10000)/10000; return out;
}
function combine(claude,codex){
  var keys=['today','yesterday','d7','d30','all'], windows={};
  keys.forEach(function(k){ windows[k]=addRows(claude.windows[k]||{},codex.windows[k]||{}); });
  var days=claude.byDay.map(function(x,i){ var y=codex.byDay[i]||{};
    return Object.assign(addRows(x,y),{date:x.date,claudeCost:x.cost||0,codexCost:y.cost||0,
      claudeTokens:x.tokens||0,codexTokens:y.tokens||0}); });
  var hours=claude.byHour.map(function(x,i){ var y=codex.byHour[i]||{}; return {h:x.h,tokens:(x.tokens||0)+(y.tokens||0),cost:(x.cost||0)+(y.cost||0),
    claudeCost:x.cost||0,codexCost:y.cost||0,claudeTokens:x.tokens||0,codexTokens:y.tokens||0}; });
  var models=claude.byModel.map(function(x){ return Object.assign({},x,{model:'Claude · '+x.model}); })
    .concat(codex.byModel.map(function(x){ return Object.assign({},x,{model:'Codex · '+x.model}); }))
    .sort(function(a,b){ return b.cost-a.cost; });
  var weight=(claude.windows.all.tokens||0)+(codex.windows.all.tokens||0);
  var hit=weight ? ((claude.cacheHitRate||0)*(claude.windows.all.tokens||0)+(codex.cacheHitRate||0)*(codex.windows.all.tokens||0))/weight : 0;
  return {updated:Math.min(claude.updated,codex.updated),provider:'combined',windows:windows,byDay:days,byHour:hours,
    byModel:models,sessions:claude.sessions+codex.sessions,activeDays:Math.max(claude.activeDays,codex.activeDays),
    firstDay:[claude.firstDay,codex.firstDay].filter(Boolean).sort()[0]||null,
    spanDays:Math.max(claude.spanDays,codex.spanDays),cacheHitRate:hit};
}

// Round a raw data max up to a "nice" axis with natural tick steps
// (1/2/2.5/5 ×10ⁿ), aiming for ~4 intervals. Returns {max, ticks:[0..max]}.
function niceScale(rawMax){
  var max = rawMax > 0 ? rawMax : 1;
  var rough = max / 4;
  var mag = Math.pow(10, Math.floor(Math.log10(rough)));
  var norm = rough / mag;
  var step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  var niceMax = Math.ceil(max / step) * step;
  var ticks = [];
  for (var v = 0; v <= niceMax + step / 2; v += step) ticks.push(v);
  return { max: niceMax, ticks: ticks };
}

// X-axis: one cell per bar (aligns with .bars), labelled at `tickCount` evenly
// spaced positions incl. both ends. `labelFor(i)` returns the tick's text.
// `minPx` is how much room one label needs. The tick count has to come from the
// MEASURED axis, not a constant: seven hour labels ("Sat 11 AM" … "10 AM (now)")
// need ~500px and a phone gives the axis ~270, so they printed straight through
// each other. Fewer ticks on a narrow screen, up to `tickCount` on a wide one.
function buildXAxis(axisId, n, tickCount, labelFor, hourly, minPx){
  var el = document.getElementById(axisId);
  el.className = 'axis' + (hourly ? ' hourly' : '');
  if (n <= 0){ el.innerHTML = ''; return; }
  var mark = {};
  var fits = Math.floor((el.clientWidth || 300) / (minPx || 48));
  var t = Math.max(2, Math.min(tickCount, n, fits));
  for (var k = 0; k < t; k++) mark[Math.round(k * (n - 1) / (t - 1))] = true;
  var cells = [];
  for (var i = 0; i < n; i++){
    if (mark[i]){
      var al = i === 0 ? 'l' : (i === n - 1 ? 'r' : 'c');
      cells.push('<span><i class="' + al + '">' + labelFor(i) + '</i></span>');
    } else {
      cells.push('<span></span>');
    }
  }
  el.innerHTML = cells.join('');
}

// Draw the y-axis labels + a gridline per tick, and return the nice max the
// bars should scale to. `barsId`'s background is rebuilt as one 1px line per tick.
function setY(yId, barsId, rawMax, fmt){
  var sc = niceScale(rawMax);
  document.getElementById(yId).innerHTML =
    sc.ticks.slice().reverse().map(function(v){ return '<span>' + fmt(v) + '</span>'; }).join('');
  var n = sc.ticks.length - 1;
  var lines = [];
  for (var i = 0; i <= n; i++){
    var p = (i / n * 100).toFixed(3);
    lines.push('linear-gradient(#232b36,#232b36) left ' + p + '% / 100% 1px no-repeat');
  }
  document.getElementById(barsId).style.background = lines.join(',');
  return sc.max;
}

function renderAverages(d){
  var w = d.windows;
  // Fixed windows only — no "all time" (Claude Code prunes transcripts older
  // than cleanupPeriodDays, so a cumulative total swings unpredictably).
  var r30 = Math.max(1, w.d30.req || 0);
  var r7  = Math.max(1, w.d7.req || 0);
  var tiles = [
    ['Per day · 7-day avg',      w.d7.cost/7,     w.d7.tokens/7],
    ['Per day · 30-day avg',     w.d30.cost/30,   w.d30.tokens/30],
    ['Per request · 7 days',     w.d7.cost/r7,    w.d7.tokens/r7],
    ['Per request · 30 days',    w.d30.cost/r30,  w.d30.tokens/r30]
  ];
  document.getElementById('avgs').innerHTML = tiles.map(function(t){
    return '<div class="avg"><div class="k">'+t[0]+'</div>'
      + '<div class="v">'+fmtCostFull(t[1])+'</div>'
      + '<div class="t">'+fmtTok(Math.round(t[2]))+' tokens</div></div>';
  }).join('');
}

function renderCards(w){
  var defs = [['Today','today'],['Yesterday','yesterday'],['7 days','d7'],['30 days','d30']];
  document.getElementById('cards').innerHTML = defs.map(function(d){
    var e = w[d[1]] || {};
    return '<div class="card"><div class="k">'+d[0]+'</div>'
      + '<div class="cost">'+fmtCostFull(e.cost)+'</div>'
      + '<div class="tok">'+fmtTok(e.tokens)+' tokens</div>'
      + '<div class="req">'+(e.req||0).toLocaleString()+' requests</div></div>';
  }).join('');
}

function renderDayBars(days){
  var raw = 0;
  days.forEach(function(d){ var v = dayMode==='cost'? d.cost : d.tokens; if (v>raw) raw=v; });
  var max = setY('dayY', 'dayBars', raw, dayMode==='cost'? axisCost : fmtTok);
  document.getElementById('dayBars').innerHTML = days.map(function(d){
    var v = dayMode==='cost'? d.cost : d.tokens;
    var h = Math.max(1, Math.round(v/max*100));
    var lbl = dayMode==='cost'? fmtCostFull(d.cost) : fmtTok(d.tokens)+' tok';
    var dim = v>0? '' : ' dim';
    var stack = currentProvider === 'combined';
    var a = stack ? (dayMode==='cost' ? d.claudeCost : d.claudeTokens) : v;
    var b = stack ? (dayMode==='cost' ? d.codexCost : d.codexTokens) : 0;
    var ah = stack ? Math.max(a ? .5 : 0, a/max*100) : h;
    var bh = stack ? Math.max(b ? .5 : 0, b/max*100) : 0;
    var tip = stack ? d.date+'<br>Claude '+(dayMode==='cost'?fmtCostFull(a):fmtTok(a)+' tok')+' · Codex '+(dayMode==='cost'?fmtCostFull(b):fmtTok(b)+' tok') : lbl;
    var singleColor = currentProvider === 'codex' ? '#34a8a0' : '#d2902a';
    return '<div class="bar'+dim+'"><span class="tip">'+tip+'</span>'
         + '<i style="height:'+ah+'%;background:'+(stack?'#d2902a':singleColor)+'"></i>'
         + (stack ? '<i style="height:'+bh+'%;background:#34a8a0"></i>' : '') + '</div>';
  }).join('');
  buildXAxis('dayAxis', days.length, 7, function(i){ return days[i].date.slice(5); }, false, 52);
}

function renderHourBars(hours){
  var raw = 0;
  hours.forEach(function(h){ if (h.tokens>raw) raw=h.tokens; });
  var max = setY('hourY', 'hourBars', raw, fmtTok);
  document.getElementById('hourBars').innerHTML = hours.map(function(h){
    var height = Math.max(1, Math.round(h.tokens/max*100));
    var d = new Date(h.h*3600*1000);
    var label = d.toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric'});
    var dim = h.tokens>0? '' : ' dim';
    var stack = currentProvider === 'combined';
    var ah = stack ? Math.max(h.claudeTokens ? .5 : 0, h.claudeTokens/max*100) : height;
    var bh = stack ? Math.max(h.codexTokens ? .5 : 0, h.codexTokens/max*100) : 0;
    var tip = stack ? label+'<br>Claude '+fmtTok(h.claudeTokens)+' tok · Codex '+fmtTok(h.codexTokens)+' tok' : label+'<br>'+fmtTok(h.tokens)+' tok · '+fmtCostFull(h.cost);
    var singleColor = currentProvider === 'codex' ? '#34a8a0' : '#d2902a';
    return '<div class="bar'+dim+'"><span class="tip">'+tip+'</span>'
         + '<i style="height:'+ah+'%;background:'+(stack?'#d2902a':singleColor)+'"></i>'
         + (stack ? '<i style="height:'+bh+'%;background:#34a8a0"></i>' : '') + '</div>';
  }).join('');
  var last = hours.length - 1;
  buildXAxis('hourAxis', hours.length, 7, function(i){
    var d = new Date(hours[i].h*3600*1000);
    if (i === last) return d.toLocaleString(undefined,{hour:'numeric'}) + ' (now)';
    if (i === 0)    return d.toLocaleString(undefined,{weekday:'short',hour:'numeric'});
    return d.toLocaleString(undefined,{hour:'numeric'});
  }, true, 78);
}

function renderModels(models){
  var maxCost = 1;
  models.forEach(function(m){ if (m.cost>maxCost) maxCost=m.cost; });
  document.getElementById('modelRows').innerHTML = models.map(function(m){
    var c = color(m.model);
    var full = String(m.model || 'Unknown model');
    var shown = middleEllipsis(full, window.innerWidth <= 720 ? 28 : 48);
    return '<tr>'
      + '<td class="model-cell"><span class="mdot" style="background:'+c+'"></span>'
      + '<span class="model-name" title="'+esc(full)+'">'+esc(shown)+'</span></td>'
      + '<td>'+(m.req||0).toLocaleString()+'</td>'
      + '<td class="hide-sm">'+fmtTok(m.in)+'</td>'
      + '<td class="hide-sm">'+fmtTok(m.out)+'</td>'
      + '<td class="hide-sm">'+fmtTok(m.cr)+'</td>'
      + '<td><b>'+fmtCostFull(m.cost)+'</b>'
      + '<div class="costbar" style="width:'+Math.max(3,Math.round(m.cost/maxCost*100))+'%;background:'+c+'"></div></td>'
      + '</tr>';
  }).join('') || '<tr><td colspan="6" class="muted">No usage recorded yet.</td></tr>';
}

function render(d){
  lastData = d;
  renderCards(d.windows);
  renderAverages(d);
  renderDayBars(d.byDay);
  renderHourBars(d.byHour);
  renderModels(d.byModel);
  document.getElementById('dayLegend').hidden = currentProvider !== 'combined';
  document.getElementById('hourLegend').hidden = currentProvider !== 'combined';
  document.getElementById('cacheStat').textContent =
    '· cache hit ' + Math.round((d.cacheHitRate||0)*100) + '% · ' + d.sessions + ' sessions';
  var ago = Math.max(0, Math.round((Date.now()/1000) - d.updated));
  document.getElementById('pageTitle').textContent = currentProvider === 'combined' ? 'Combined usage' :
    (currentProvider === 'claude' ? 'Claude usage' : 'Codex usage');
  document.getElementById('sub').innerHTML =
    'Local transcripts · costs are <b>API-equivalent estimates</b>, not subscription charges · updated '
    + (ago<60? ago+'s' : Math.round(ago/60)+'m') + ' ago.';
}

// The tick count is measured, so a rotation or a resized window has to re-measure.
var reT = null;
window.addEventListener('resize', function(){
  clearTimeout(reT);
  reT = setTimeout(function(){ if (lastData) render(lastData); }, 150);
});

function load(){
  document.getElementById('refresh').textContent = '↻ …';
  Promise.all([fetch('/api/claude/stats', {cache:'no-store'}),fetch('/api/codex/stats', {cache:'no-store'})])
    .then(function(rs){ return Promise.all(rs.map(function(r){ if(!r.ok) throw Error(r.status); return r.json(); })); })
    .then(function(ds){ providerData={claude:ds[0],codex:ds[1]}; providerData.combined=combine(ds[0],ds[1]); render(providerData[currentProvider]); })
    .catch(function(){ document.getElementById('sub').textContent = 'Failed to load stats.'; })
    .then(function(){ document.getElementById('refresh').textContent = '↻ refresh'; });
}

document.getElementById('daymode').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  dayMode = b.dataset.m;
  [].forEach.call(this.querySelectorAll('button'), function(x){ x.classList.toggle('on', x===b); });
  if (lastData) renderDayBars(lastData.byDay);
});
document.getElementById('refresh').addEventListener('click', load);
document.getElementById('providerTabs').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b)return; currentProvider=b.dataset.provider;
  [].forEach.call(this.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b);});
  if(providerData) render(providerData[currentProvider]);
});
document.addEventListener('visibilitychange', function(){ if (!document.hidden) load(); });

load();
setInterval(load, 45000);
</script>
</body>
</html>

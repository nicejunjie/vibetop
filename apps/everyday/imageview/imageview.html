<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Images — Vibetop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column; background: #0e1117; color: #d4d8de;
    font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent;
  }
  .bar {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    min-height: 40px; padding: 4px 10px;
    background: #161b22; border-bottom: 1px solid #2a3040;
    user-select: none; -webkit-user-select: none; z-index: 3;
  }
  .name {
    flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cnt { flex-shrink: 0; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #6b7488; }
  .bar button {
    flex-shrink: 0; background: #1f2733; color: #d4d8de; border: 1px solid #2a3040;
    border-radius: 6px; padding: 5px 10px; font: 12px system-ui, sans-serif;
    cursor: pointer; min-height: 30px;
  }
  .bar button:hover { background: #253044; }
  .bar button:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }
  /* The Close every viewer shares — the video player's: bold, red-tinted,
     generous padding, at the right end of the bar. A small grey ✕ at the
     corner was hard to hit (user, 2026-09-11). */
  .xclose { font-weight: 700 !important; color: #ffb3b3 !important; background: #341c20 !important;
            border: 1px solid #7a3c44 !important; border-radius: 8px !important; padding: 8px 16px !important;
            min-height: 36px !important; font-size: 13px !important; line-height: 1; white-space: nowrap; }
  .xclose:hover { background: #c0392b !important; border-color: #c0392b !important; color: #fff !important; }
  @media (max-width: 600px) { .xclose { padding: 9px 14px !important; min-height: 40px !important; } }
  .stage { position: relative; flex: 1; min-height: 0; overflow: hidden; touch-action: none; }
  .stage img {
    position: absolute; left: 50%; top: 50%;
    max-width: 100%; max-height: 100%;
    transform: translate(-50%, -50%);
    user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
  }
  .stage img.zoomed { max-width: none; max-height: none; cursor: grab; }
  .stage img.dragging { cursor: grabbing; transition: none !important; }
  /* edge nav — visible affordance on hover-capable devices, tap zones on touch */
  .nav {
    position: absolute; top: 0; bottom: 0; width: 72px; border: 0;
    background: transparent; color: transparent; font-size: 34px; cursor: pointer;
    display: flex; align-items: center; z-index: 2;
  }
  .nav.prev { left: 0; justify-content: flex-start; padding-left: 10px; }
  .nav.next { right: 0; justify-content: flex-end; padding-right: 10px; }
  @media (hover: hover) {
    .nav:hover { color: #d4d8de; background: linear-gradient(to right, rgba(14,17,23,.55), transparent); }
    .nav.next:hover { background: linear-gradient(to left, rgba(14,17,23,.55), transparent); }
  }
  .nav[disabled] { display: none; }
  .msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #6b7488; font-size: 13px; padding: 20px; text-align: center;
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="name" id="name"></span>
    <span class="cnt" id="cnt"></span>
    <button id="dl" title="Download">⭳ Download</button>
    <button id="close" class="xclose" title="Close (Esc)">✕ Close</button>
  </div>
  <div class="stage" id="stage">
    <button class="nav prev" id="prev" aria-label="Previous image">‹</button>
    <button class="nav next" id="next" aria-label="Next image">›</button>
  </div>
<!-- Two-finger pinch maths, shared with Files' Quick Look: shared/pinch.js. -->
<script src="/pinch.js"></script>
<script>
(function() {
  // Native image viewer — replaced FileBrowser's previewer (its patched mobile
  // toolbar rendered as an unthemed white block; see the design-decisions
  // entry). Opened by the desktop on Files' `image-view` postMessage with
  // ?path=<home-less rel path, e.g. home/you/Uploads/x.png>. Fully native:
  // bytes and folder listing both come from the manager/file-agent
  // (docs/files-native.md).
  var IMAGE_RE = /\.(png|jpe?g|gif|webp|bmp|svg|avif|ico)$/i;
  var path = new URLSearchParams(location.search).get('path') || '';
  var stage = document.getElementById('stage');
  var nameEl = document.getElementById('name'), cntEl = document.getElementById('cnt');
  var prevBtn = document.getElementById('prev'), nextBtn = document.getElementById('next');
  var list = null, idx = -1;   // sibling images in the folder (names, sorted)
  var img = null;

  // Fully native: bytes from /api/file/image, the prev/next folder listing
  // from /api/fs/list (the per-user file agent) — zero third-party API
  // involvement (v1.19.93; the FB resources call + its JWT dance are gone).
  function rawUrl(p) { return '/api/file/image?path=' + encodeURIComponent(p); }
  function dirOf(p) { var i = p.lastIndexOf('/'); return i > 0 ? p.slice(0, i) : ''; }
  function baseOf(p) { return p.split('/').pop(); }

  function showMsg(t) {
    var m = document.createElement('div'); m.className = 'msg'; m.textContent = t;
    stage.appendChild(m);
  }

  // ---- zoom & pan: wheel / double-click / double-tap toggle; drag to pan ----
  var zoom = 1, panX = 0, panY = 0;
  function applyZoom() {
    if (!img) return;
    if (zoom === 1) {
      img.classList.remove('zoomed');
      img.style.transform = 'translate(-50%, -50%)';
      panX = panY = 0;
    } else {
      img.classList.add('zoomed');
      img.style.transform = 'translate(calc(-50% + ' + panX + 'px), calc(-50% + ' + panY + 'px)) scale(' + zoom + ')';
    }
  }
  function setZoom(z) { zoom = Math.max(1, Math.min(6, z)); applyZoom(); }
  // Zoom to `z` keeping the image point under (cx, cy) where it is, so the
  // wheel zooms into what the cursor is on rather than the picture's centre.
  function zoomAt(z, cx, cy) {
    z = Math.max(1, Math.min(6, z));
    var r = stage.getBoundingClientRect(), ox = cx - (r.left + r.width / 2), oy = cy - (r.top + r.height / 2);
    var ux = (ox - panX) / zoom, uy = (oy - panY) / zoom;
    zoom = z; panX = ox - z * ux; panY = oy - z * uy;
    applyZoom();
  }
  stage.addEventListener('wheel', function(e) {
    e.preventDefault();
    zoomAt(zoom * (e.deltaY < 0 ? 1.2 : 1 / 1.2), e.clientX, e.clientY);
  }, { passive: false });

  var lastTapT = 0, lastTapX = 0, lastTapY = 0;
  var drag = null;
  // Two fingers pinch. There is no wheel on a phone, and the double-tap toggle
  // only ever gives 1x or 2.5x — pinching is how anyone actually reads a photo.
  // Pointers are tracked BY ID because `drag` is a single object: a second
  // finger used to overwrite the first, so two were never visible at once.
  var pts = Object.create(null), pinch = null;
  function ptIds() { return Object.keys(pts); }
  function centreRel(cx, cy) {
    var r = stage.getBoundingClientRect();
    return { x: cx - (r.left + r.width / 2), y: cy - (r.top + r.height / 2) };
  }
  function pinchStart() {
    var ids = ptIds(); if (ids.length < 2) { pinch = null; return; }
    var a = pts[ids[0]], b = pts[ids[1]];
    var ca = centreRel(a.x, a.y), cb = centreRel(b.x, b.y);
    var m = VibePinch.pinchMetrics(ca.x, ca.y, cb.x, cb.y);
    pinch = { dist: m.dist, cx: m.cx, cy: m.cy, z: zoom, px: panX, py: panY, ids: [ids[0], ids[1]] };
    // A pinch is not a drag and not a swipe: cancel both, or lifting the
    // fingers would also step to the next picture.
    drag = null; lastTapT = 0;
    if (img) img.classList.remove('dragging');
  }
  stage.addEventListener('pointerdown', function(e) {
    if (e.target.closest('.nav')) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (ptIds().length >= 2) { pinchStart(); e.preventDefault(); return; }
    var now = e.timeStamp;
    if (now - lastTapT < 350 && Math.abs(e.clientX - lastTapX) < 24 && Math.abs(e.clientY - lastTapY) < 24) {
      setZoom(zoom === 1 ? 2.5 : 1);           // double-tap / double-click toggles
      lastTapT = 0;
      return;
    }
    lastTapT = now; lastTapX = e.clientX; lastTapY = e.clientY;
    drag = { x: e.clientX, y: e.clientY, px: panX, py: panY, moved: false };
    if (img) img.classList.add('dragging');
  });
  window.addEventListener('pointermove', function(e) {
    if (pts[e.pointerId]) { pts[e.pointerId].x = e.clientX; pts[e.pointerId].y = e.clientY; }
    if (pinch) {
      var pa = pts[pinch.ids[0]], pb = pts[pinch.ids[1]];
      if (!pa || !pb) return;
      var ca = centreRel(pa.x, pa.y), cb = centreRel(pb.x, pb.y);
      var st = VibePinch.pinchStep(pinch, VibePinch.pinchMetrics(ca.x, ca.y, cb.x, cb.y), 1, 6);
      zoom = st.z; panX = st.px; panY = st.py;
      applyZoom();
      e.preventDefault();
      return;
    }
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 8) drag.moved = true;
    if (zoom > 1) { panX = drag.px + dx; panY = drag.py + dy; applyZoom(); }
  });
  // A cancelled touch, or a finger that lifts outside this frame, used to leave
  // `drag` set: the image then kept panning under a pointer that was not down,
  // and could still fire a prev/next step. Same shape as the stuck d-pad key.
  function abortPan() {
    if (!drag) return;
    drag = null;
    if (img) img.classList.remove('dragging');
  }
  window.addEventListener('pointercancel', function(e) { forgetPt(e); abortPan(); });
  window.addEventListener('blur', function() { pts = Object.create(null); pinch = null; abortPan(); });
  // Lifting one of two fingers ends the pinch; the finger still down becomes a
  // plain pan rather than a stray swipe to the next picture.
  function forgetPt(e) {
    delete pts[e.pointerId];
    if (!pinch || pinch.ids.indexOf(String(e.pointerId)) === -1) return false;
    pinch = null;
    var ids = ptIds();
    if (ids.length === 1 && zoom > 1) {
      var p = pts[ids[0]];
      drag = { x: p.x, y: p.y, px: panX, py: panY, moved: true };
    }
    return true;
  }
  window.addEventListener('pointerup', function(e) {
    if (forgetPt(e)) return;                  // was a pinch: not a tap, not a swipe
    delete pts[e.pointerId];
    if (!drag) return;
    var d = drag; drag = null;
    if (img) img.classList.remove('dragging');
    // unzoomed horizontal swipe = prev/next (touch)
    if (zoom === 1 && d.moved) {
      var dx = e.clientX - d.x, dy = e.clientY - d.y;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
    }
  });

  // ---- navigation ----
  function render() {
    stage.querySelectorAll('img, .msg').forEach(function(n) { n.remove(); });
    zoom = 1; panX = panY = 0;
    nameEl.textContent = baseOf(path);
    document.title = baseOf(path) + ' — Vibetop';
    img = document.createElement('img');
    img.alt = baseOf(path);
    img.src = rawUrl(path);
    img.onerror = function() { img.remove(); img = null; showMsg('Could not load ' + baseOf(path)); };
    stage.appendChild(img);
    if (list) {
      cntEl.textContent = (idx + 1) + ' / ' + list.length;
      prevBtn.disabled = idx <= 0;
      nextBtn.disabled = idx >= list.length - 1;
      // preload neighbors so stepping feels instant
      [idx - 1, idx + 1].forEach(function(i) {
        if (i >= 0 && i < list.length) { var pre = new Image(); pre.src = rawUrl(dirOf(path) + '/' + list[i]); }
      });
    }
  }
  function step(d) {
    if (!list) return;
    var i = idx + d;
    if (i < 0 || i >= list.length) return;
    idx = i;
    path = dirOf(path) + '/' + list[idx];
    render();
  }
  prevBtn.addEventListener('click', function() { step(-1); });
  nextBtn.addEventListener('click', function() { step(1); });

  // Claim the keyboard for this frame when it is clicked. Safari on macOS moves
  // focus on a click only to form controls and links, so clicking the media left
  // the keys in the parent frame and Esc / the arrows did nothing until a second
  // click. Only when the keys are not already ours, so nothing is stolen from an
  // input. See docs/design-decisions.md (the Files two-click saga).
  document.addEventListener('pointerdown', function (ev) {
    var t = ev.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' ||
              t.tagName === 'BUTTON' || t.tagName === 'A' || t.isContentEditable)) return;
    // Not gated on document.hasFocus() — Safari reports it true for a child
    // frame whenever the window is focused, so it bailed on every click.
    var ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
    try { window.focus(); } catch (e) {}
    try { document.body.tabIndex = -1; document.body.focus({ preventScroll: true }); } catch (e) {}
  }, true);

  window.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'Escape') closeSelf();
  });

  function closeSelf() {
    try { window.parent.postMessage({ type: 'close-app', app: 'imageview' }, '*'); } catch (e) {}
  }
  document.getElementById('close').addEventListener('click', closeSelf);

  // iOS-standalone-safe download. In an installed PWA, an <a download> (or a
  // bare attachment navigation) replaces the WHOLE app view with iOS's white
  // "Open in Preview" sheet (reported with a screenshot). The iOS-correct path
  // is the SYSTEM SHARE SHEET with a real File (save to Files/Photos, AirDrop)
  // — in-app, no navigation. Anchor download stays for every normal browser;
  // window.open (Safari handles it) is the last-resort fallback. Share must
  // run inside the click's transient activation, so the fetch races it — a
  // too-slow fetch falls back rather than throwing at the user.
  var IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
               (/Mac/.test(navigator.userAgent) && 'ontouchend' in document);
  function nativeDownload(url, name) {
    if (!(IS_IOS && navigator.share && navigator.canShare)) {
      var a = document.createElement('a');
      a.href = url;
      if (name) a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    fetch(url).then(function(r) {
      if (!r.ok) throw 0;
      return r.blob();
    }).then(function(b) {
      var f = new File([b], name || 'download', { type: b.type || 'application/octet-stream' });
      if (!navigator.canShare({ files: [f] })) throw 0;
      return navigator.share({ files: [f] });
    }).catch(function(e) {
      if (e && e.name === 'AbortError') return;   // user closed the sheet
      try { window.open(url); } catch (_) {}
    });
  }
  document.getElementById('dl').addEventListener('click', function() {
    nativeDownload(rawUrl(path) + '&dl=1', baseOf(path));
  });

  if (!path) { showMsg('No image selected. Open one from Files.'); return; }
  render();
  // Folder siblings for prev/next: the native file agent's listing.
  fetch('/api/fs/list?path=' + encodeURIComponent('/' + dirOf(path)))
    .then(function(r) { return r.ok ? r.json() : null; })
    .then(function(j) {
      if (!j || !j.ok || !Array.isArray(j.entries)) return;
      list = j.entries.filter(function(it) { return !it.isDir && IMAGE_RE.test(it.name); })
                      .map(function(it) { return it.name; })
                      .sort(function(a, b) { return a.localeCompare(b, undefined, { numeric: true }); });
      idx = list.indexOf(baseOf(path));
      if (idx === -1) { list = null; return; }
      render();
    }).catch(function() {});
})();
</script>
</body>
</html>

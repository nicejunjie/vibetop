<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Browser Lite</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0e1117;color:#e0e6ef}body{display:flex;flex-direction:column}button,input{font:inherit}button{min-width:44px;min-height:44px;border:1px solid #354052;border-radius:8px;background:#1a2432;color:inherit;cursor:pointer}button:hover{background:#27374c}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible{outline:2px solid #76b5ff;outline-offset:2px}.toolbar{display:flex;gap:6px;padding:8px;border-bottom:1px solid #2d3848}.toolbar input{min-width:0;flex:1;min-height:44px;padding:8px 10px;border:1px solid #354052;border-radius:8px;background:#101824;color:#edf2fa}.options{display:flex;gap:12px;align-items:center;padding:0 8px 8px;min-height:44px;font-size:13px}.options label{display:flex;align-items:center;gap:6px;min-height:44px;cursor:pointer}.options input{width:18px;height:18px}.options button{font-size:13px;padding:0 10px}.badge{color:#a5c4e8;font-size:12px}.status{padding:6px 12px;min-height:30px;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#9caec5;border-top:1px solid #2d3848}.status.error{color:#ffc2b5}.stage{flex:1;min-height:0;position:relative;background:white}iframe{border:0;width:100%;height:100%;background:white}.cover{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#0e1117;color:#aebdd2}.cover[hidden]{display:none}.cover h1{font-size:24px;color:#eef5ff}.cover p{line-height:1.6;max-width:420px}.cover button{margin:4px;padding:0 16px}.cover .muted{font-size:12px;color:#7e91a9}dialog{border:1px solid #41526b;border-radius:12px;padding:20px;background:#172130;color:#e0e6ef;width:min(440px,calc(100% - 24px))}dialog::backdrop{background:#0009}dialog h2{font-size:18px;margin:0 0 12px}dialog button{padding:0 14px;margin:8px 4px 0 0}dialog p{overflow-wrap:anywhere}dialog input{width:100%;padding:10px;background:#0e1117;color:inherit;border:1px solid #41526b}.sessions .entry{padding:8px 0;border-bottom:1px solid #354052}.sessions small{display:block;color:#a2b1c6;overflow-wrap:anywhere}@media(max-width:600px){.toolbar{gap:4px;padding:6px}.toolbar button{width:44px}.options{gap:8px;flex-wrap:wrap;padding-bottom:4px}.badge{display:none}.options button{flex:1}.status{font-size:11px}.go{display:none}}
</style></head><body>
<form class="toolbar" id="navigate"><button type="button" id="back" aria-label="Back" title="Back">←</button><button type="button" id="forward" aria-label="Forward" title="Forward">→</button><button type="button" id="reload" aria-label="Reload remote page" title="Reload page">↻</button><input id="address" aria-label="Address or search" placeholder="Address or search" autocomplete="off" autocapitalize="none" spellcheck="false"><button class="go" type="submit">Go</button></form>
<div class="options"><label><input type="checkbox" id="images">Show images</label><button id="fallback">Open in Browser</button><button id="sessions">Sessions</button><span class="badge">Experimental</span></div>
<div class="stage"><iframe id="page" title="Remote webpage" sandbox="allow-scripts" src="/browser-lite-frame.html"></iframe><div class="cover" id="cover"><div><h1>Browser Lite</h1><p>Browse on the server, read and scroll on your device. Enter an address or search above.</p><p class="muted">Server pages stay open after logout. Close them in Sessions or use Reset. Videos and complex pages work best in Browser.</p><button id="reconnect" hidden>Reconnect</button><button id="takeover" hidden>Take over</button><button id="newpage" hidden>New page</button></div></div></div>
<div class="status" id="status"><span id="message">Connecting…</span><span id="traffic">0 KB received</span></div>
<dialog id="dialog"><h2 id="dialogtitle">Page message</h2><p id="dialogmessage"></p><input id="dialogvalue" hidden><button id="dialogok">OK</button><button id="dialogcancel">Cancel</button></dialog>
<dialog id="pages" class="sessions"><h2>Server pages</h2><div id="pagelist"></div><p><button id="pagesclose">Done</button><button id="addpage">New page</button></p></dialog>
<script src="/browser-lite.js?v=4fec2ca7a5a9"></script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="origin"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Browser Lite</title><link rel="stylesheet" href="/wrapper.css"></head>
<body>
<div class="tab-strip"><div id="tabs" role="tablist" aria-label="Browser tabs"></div><button id="new-tab" aria-label="New tab" title="New tab">+</button></div>
<form id="navigate" class="toolbar"><button type="button" id="back" aria-label="Back" title="Back">←</button><button type="button" id="forward" aria-label="Forward" title="Forward">→</button><button type="button" id="reload" aria-label="Reload" title="Reload">↻</button><input id="address" aria-label="Address or search" placeholder="Search or enter an address" enterkeyhint="go" autocomplete="off" autocapitalize="none" spellcheck="false"><button type="submit" aria-label="Go">↵</button></form>
<div id="progress" aria-hidden="true"></div><div id="notice" hidden><span id="status" role="status" aria-live="polite"></span><button id="retry" hidden>Retry</button><button id="dismiss" aria-label="Dismiss">×</button></div>
<div id="handoff" role="note" hidden><span id="handoff-text"></span><button id="open-browser">Open in Browser</button><button id="continue-here" hidden>I've signed in</button></div>
<main id="stage"><section id="welcome"><h1>Browser Lite</h1><p>Search or enter a website above.</p><div class="shortcuts" id="shortcuts"></div><form id="add-shortcut" class="add-shortcut" hidden><input id="shortcut-name" aria-label="Shortcut name" placeholder="Name (optional)" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="60"><input id="shortcut-url" aria-label="Shortcut address" placeholder="example.com" enterkeyhint="done" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="2048"><button type="submit">Add</button><button type="button" id="add-cancel" aria-label="Cancel">×</button></form></section></main>
<script src="/controller.js"></script><script src="/ui-session.js"></script><script src="/wrapper.js"></script>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="origin"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Browser Lite</title><link rel="stylesheet" href="/wrapper.css"></head>
<body>
<div class="tab-strip"><div id="tabs" role="tablist" aria-label="Browser tabs"></div><button id="new-tab" aria-label="New tab" title="New tab">+</button></div>
<form id="navigate" class="toolbar"><button type="button" id="back" aria-label="Back" title="Back">←</button><button type="button" id="forward" aria-label="Forward" title="Forward">→</button><button type="button" id="reload" aria-label="Reload" title="Reload">↻</button><input id="address" aria-label="Address or search" placeholder="Search or enter an address" autocomplete="off" autocapitalize="none" spellcheck="false"><button type="submit" aria-label="Go">↵</button></form>
<div id="handoff" role="note" hidden><span>Google doesn't allow signing in through Browser Lite. Use the full Browser for your Google account.</span><button id="open-browser">Open in Browser</button></div>
<main id="stage"><section id="welcome"><h1>Browser Lite</h1><p>Search or enter a website above.</p><div class="shortcuts"><button data-url="https://www.google.com/">Google</button><button data-url="https://www.wikipedia.org/">Wikipedia</button><button data-url="https://github.com/">GitHub</button><button data-url="https://x.com/">X</button><button data-url="https://chatgpt.com/">ChatGPT</button><button data-url="https://claude.ai/">Claude</button></div></section></main>
<footer><span id="status" role="status" aria-live="polite">Ready</span><button id="retry" hidden>Retry</button></footer>
<script src="/controller.js"></script><script src="/ui-session.js"></script><script src="/wrapper.js"></script>
</body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Files — Vibetop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; background: #0e1117; font-family: system-ui, sans-serif; color: #d4d8de; }
  /* Tab bar — one tab per open folder. position:relative + z-index keeps it
     clickable above the iframes (a positioned element otherwise paints over a
     static bar and eats clicks — same fix as the terminal tabs). */
  .tabbar {
    display: flex; align-items: stretch; flex-shrink: 0; min-height: 40px;
    background: #161b22; border-bottom: 1px solid #2a3040;
    position: relative; z-index: 2; overflow-x: auto;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tabs { display: flex; align-items: stretch; }
  .tab {
    display: flex; align-items: center; gap: 8px; padding: 0 9px 0 13px;
    border-right: 1px solid #222a38; cursor: pointer; max-width: 200px;
    color: #aab4c5; font-size: 13px; white-space: nowrap; user-select: none;
    border-bottom: 2px solid transparent;
  }
  .tab:hover { background: #1b2330; color: #e6edf3; }
  .tab.active { background: #1f2937; color: #fff; border-bottom-color: #8a4adb; }
  .tab .ic { font-size: 13px; flex-shrink: 0; opacity: .8; }
  .tab .lbl { overflow: hidden; text-overflow: ellipsis; }
  .tab .x {
    flex: 0 0 auto; width: 18px; height: 18px; line-height: 16px; text-align: center;
    border-radius: 4px; color: #6b7488; font-size: 14px;
  }
  .tab .x:hover { background: #3a2024; color: #f1b3b3; }
  .add {
    flex: 0 0 auto; width: 40px; background: transparent; border: 0;
    border-right: 1px solid #222a38; color: #8a6fc0; font-size: 22px;
    cursor: pointer; line-height: 1;
  }
  .add:hover { background: #221a30; color: #b79be8; }
  .frames { position: relative; flex: 1; min-height: 0; }
  .frames iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; }
  .frames iframe.active { display: block; }
  /* In-app viewer overlay — images/videos/office docs open INSIDE Files (user
     request: no popping a separate app). Covers the whole Files area incl. the
     tab bar; image/video pages bring their own chrome, office gets a slim
     header here (the preview iframe is a bare PDF rendition). */
  .viewer { position: absolute; inset: 0; z-index: 10; display: none; flex-direction: column; background: #0e1117; }
  .viewer.on { display: flex; }
  .viewer .vhead {
    display: none; align-items: center; gap: 10px; flex-shrink: 0;
    min-height: 40px; padding: 4px 10px;
    background: #161b22; border-bottom: 1px solid #2a3040;
    user-select: none; -webkit-user-select: none;
  }
  .viewer.office .vhead { display: flex; }
  .viewer .vname { flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .viewer .vhead button {
    flex-shrink: 0; background: #1f2733; color: #d4d8de; border: 1px solid #2a3040;
    border-radius: 6px; padding: 5px 10px; font: 12px system-ui, sans-serif;
    cursor: pointer; min-height: 30px;
  }
  .viewer .vhead button:hover { background: #253044; }
  /* The Close every viewer shares — the video player's: bold, red-tinted,
     generous padding, at the right end of the bar. A small grey ✕ at the
     corner was hard to hit (user, 2026-09-11). */
  .xclose { font-weight: 700 !important; color: #ffb3b3 !important; background: #341c20 !important;
            border: 1px solid #7a3c44 !important; border-radius: 8px !important; padding: 8px 16px !important;
            min-height: 36px !important; font-size: 13px !important; line-height: 1; white-space: nowrap; }
  .xclose:hover { background: #c0392b !important; border-color: #c0392b !important; color: #fff !important; }
  @media (max-width: 600px) { .xclose { padding: 9px 14px !important; min-height: 40px !important; } }
  .viewer iframe { flex: 1; min-height: 0; width: 100%; border: 0; background: #0e1117; }
</style>
</head>
<body>
  <div class="tabbar" id="tabbar">
    <div class="tabs" id="tabs"></div>
    <button class="add" id="add" title="New folder tab">+</button>
  </div>
  <div class="frames" id="frames"></div>
  <div class="viewer" id="viewer">
    <div class="vhead">
      <span class="vname" id="v-name"></span>
      <button id="v-dl" title="Download the original file">⭳ Download</button>
      <button id="v-close" class="xclose" title="Close (Esc)">✕ Close</button>
    </div>
    <iframe id="v-frame" title="Viewer" allow="fullscreen"></iframe>
  </div>
<script>
(function() {
  // Default folder = the user's home. The app browses from "/", so "/" stays
  // reachable by navigating up or typing it in the path bar — but the app OPENS
  // at home, not the filesystem root. The home path is stamped at deploy in the
  // single-user build (@APP_HOME@ -> /home/you); in the MULTI-USER build it's
  // stamped empty (the logged-in user is unknown at deploy) and resolved at
  // runtime from /api/me (see resolveHome below), so each user opens at THEIR ~.
  // Tab paths are ABSOLUTE filesystem paths ('/home/you/Documents').
  var HOME_PATH = '@APP_HOME@';                 // '' in multi-user until resolved
  var HOME = HOME_PATH || '/';
  // Resolve the real home once (multi-user) before the initial tab load, so the
  // first tab opens at ~ rather than the filesystem root.
  function resolveHome(done) {
    if (HOME_PATH) { done(); return; }          // single-user: known at deploy
    fetch('/api/me').then(function(r) { return r.json(); }).then(function(d) {
      if (d && d.home) { HOME_PATH = d.home; HOME = d.home; }
    }).catch(function() {}).then(done);
  }
  var tabsEl = document.getElementById('tabs');
  var framesEl = document.getElementById('frames');
  var addBtn = document.getElementById('add');
  var tabs = [];          // {id, frame, path}
  var active = null;
  var seq = 0;
  var lastMouseAt = -1e9;
  // The tab set is shared across devices (server-side via /api/files/tabs):
  // loaded when the app opens, saved on change. _loaded gates saving until the
  // initial load is in; _lastSaved dedupes so we only POST real changes.
  var _loaded = false;
  var _lastSaved = null;
  var _suppress = false;       // true while reconciling to the server (don't echo back)
  var _pushStreak = 0;         // consecutive ticks that pushed instead of reading
  var _rev = null;             // revision of the stored tab set we are editing

  // The native listing (filesx.html#/abs/path) is the ONLY engine — FileBrowser
  // and the Native/Classic toggle were retired (docs/files-native.md, phase 4b).
  // A device that had chosen the classic engine has nothing to opt out of any
  // more: the old localStorage flag ('vibetop:filesx') is never read.
  // The hash is encoded PER SEGMENT, exactly as filesx.html's enc()/dec() do —
  // a folder named "a#b" or "100%" must survive the round trip.
  function encPath(p) { return p.split('/').map(encodeURIComponent).join('/'); }
  function decPath(s) {
    return s.split('/').map(function(x) { try { return decodeURIComponent(x); } catch (e) { return x; } }).join('/');
  }
  function tabUrl(path) { return '/filesx.html#' + encPath(path || '/'); }

  // Current folder of a tab's iframe, read same-origin from its hash.
  // null means "cannot read it right now", and the caller falls back to the
  // tab's last known path. An EMPTY hash is exactly that case — the frame is
  // between documents — and it must not be reported as "/": that one `|| '/'`
  // was the whole "Files keeps jumping back to /" bug. It poisoned t.path to
  // root, and because the next read returned the real folder again, stateStr()
  // oscillated every tick; tick() treats "local changed" as a reason to PUSH
  // and skip the read, so the device pushed every 2s and never once read the
  // server, dragging every other device of the same user back to / for ever.
  // A tab genuinely at root has hash "#/", which still reads as "/".
  function curPath(t) {
    try {
      var loc = t.frame.contentWindow.location;
      if (loc.pathname === '/filesx.html' && loc.hash && loc.hash.length > 1) {
        return decPath(loc.hash.slice(1));
      }
    } catch (e) {}
    return null;
  }
  // Normalize a folder path (drop the trailing slash) so two devices produce
  // identical strings regardless of how each got there — otherwise a slash
  // mismatch would ping-pong reconciles between them. It does NOT strip '?' or
  // '#' any more: these are real filesystem paths now, and a folder named "a#b"
  // was truncated by the URL-shaped version of this function.
  function norm(p) { return (p || '').replace(/\/+$/, '') || '/'; }
  function labelFor(path) {
    var rest = norm(path);
    if (rest === '/') return 'Home';          // filesystem root "/"
    // The user's home folder is labelled "Home", not its basename.
    if (HOME_PATH && rest === norm(HOME_PATH)) return 'Home';
    return rest.split('/').pop() || 'Home';
  }

  function stateStr() {
    return JSON.stringify({
      paths: tabs.map(function(t) { return norm(curPath(t) || t.path); }),
      active: Math.max(0, tabs.indexOf(active))
    });
  }
  // Push the local tab set to the server now (deduped; suppressed while we're
  // reconciling TO the server so we don't echo a change back).
  function persist() {
    if (_suppress || !_loaded || _rev === null) return;
    var s = stateStr();
    if (s === _lastSaved) return;
    _lastSaved = s;
    var body = JSON.parse(s);
    body.rev = _rev;                       // compare-and-swap: the rev we edited
    fetch('/api/files/tabs', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    }).then(function(r) {
      return r.json().then(function(d) { return { status: r.status, d: d }; });
    }).then(function(res) {
      if (res.status === 409 && res.d && Array.isArray(res.d.paths)) {
        // Someone else moved the state on. Adopt theirs rather than retrying
        // ours — this is the brake that stops two devices fighting.
        _rev = res.d.rev;
        reconcile(res.d);
      } else if (res.d && typeof res.d.rev === 'number') {
        _rev = res.d.rev;
      }
    }).catch(function() {});
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    tabs.forEach(function(t) {
      var path = curPath(t) || t.path; t.path = path;
      var el = document.createElement('div');
      el.className = 'tab' + (t === active ? ' active' : '');
      el.dataset.id = t.id;
      var ic = document.createElement('span'); ic.className = 'ic'; ic.textContent = '📁';
      var lbl = document.createElement('span'); lbl.className = 'lbl';
      lbl.textContent = labelFor(path); el.title = labelFor(path);
      var x = document.createElement('span'); x.className = 'x'; x.textContent = '×'; x.title = 'Close tab';
      el.appendChild(ic); el.appendChild(lbl); el.appendChild(x);
      tabsEl.appendChild(el);
    });
  }

  function makeTab(path) {
    var f = document.createElement('iframe');
    f.name = 'fstab';                          // one named frame per folder tab
    f.setAttribute('allow', 'clipboard-read; clipboard-write');
    f.src = tabUrl(path || HOME);
    framesEl.appendChild(f);
    return { id: ++seq, frame: f, path: path || HOME };
  }

  // Wake repaint nudge: after a long background/sleep, WebKit (iOS PWA) can bring
  // the nested listing iframe back with a stale/blank compositing layer — the
  // window shows the dark page background ("black") until a tap forces a repaint.
  // On visibility-restore (and after a detected sleep gap — monitor-off/system
  // sleep often ends with NO visibility event, but our interval stalls through
  // it), toggle a transform on the active frame to force a recomposite.
  function wakeNudge() {
    var t = active;
    if (!t || !t.frame) return;
    var f = t.frame;
    f.style.transform = 'translateZ(0)';
    requestAnimationFrame(function() { f.style.transform = ''; });
  }
  document.addEventListener('visibilitychange', function() { if (!document.hidden) wakeNudge(); });
  var _wakeTick = Date.now();
  setInterval(function() {
    var now = Date.now();
    if (now - _wakeTick > 30000 && !document.hidden) wakeNudge();   // timers stalled → we just woke
    _wakeTick = now;
  }, 5000);

  // Hand the keyboard down to the tab you are actually looking at. The desktop
  // focuses THIS wrapper's iframe, which lands on our own <body> — one frame
  // short of the listing — so after switching to Files the selection was still
  // highlighted but Space/arrows/Delete/F2 were all dead until a click inside
  // the tab moved focus down. That stolen click is what made previewing an
  // image need TWO clicks (one to wake the keyboard, one to pick the file).
  // Deferred: the shell's own iframe focus() runs on a 0ms timer *after* it
  // posts vibetop:active, so focusing synchronously here would be undone a tick
  // later.
  function focusActive() {
    var t = active;
    if (!t || !t.frame) return;
    setTimeout(function() {
      if (active !== t) return;
      if (viewerEl && viewerEl.classList.contains('on')) return;   // the overlay owns the keys
      // Is the tab REALLY focused? Ask the tab's own document, never our
      // activeElement: after a click inside the listing the iframe stays our
      // activeElement even once the desktop's focus() has pulled the browser's
      // real focus back up to THIS document — activeElement says "which of my
      // children would get the keys", hasFocus() says "do the keys come here at
      // all". Trusting activeElement left floating-window mode still needing two
      // clicks, with Space landing in the wrapper. Only a genuinely focused tab
      // is left alone (re-focusing would blur a rename box mid-edit, and the
      // ~2s tab sync calls show() on its own).
      var d = null;
      try { d = t.frame.contentDocument; } catch (e) {}
      if (d && d.hasFocus()) return;
      try { t.frame.focus(); } catch (e) {}
    }, 0);
  }

  function show(t) {
    if (!t) return;
    tabs.forEach(function(o) { o.frame.classList.toggle('active', o === t); });
    active = t;
    renderTabs();
    persist();
    focusActive();
  }

  function createTab(path, activate) {
    var t = makeTab(path);
    tabs.push(t);
    renderTabs();
    if (activate) show(t); else persist();
    return t;
  }

  function closeTab(t) {
    var i = tabs.indexOf(t);
    if (i === -1) return;
    tabs.splice(i, 1);
    if (t.frame.parentNode) t.frame.parentNode.removeChild(t.frame);
    if (!tabs.length) { createTab(HOME, true); return; }   // never zero tabs
    if (active === t) show(tabs[Math.max(0, i - 1)]);
    else { renderTabs(); persist(); }
  }

  // Send an EXISTING tab to another folder without replacing its document: the
  // listing navigates on hashchange, so the iframe, and with it the keyboard
  // focus, the selection and the scroll position, all survive. Falls back to a
  // real load only when the frame cannot be steered (not same-origin yet).
  function navigateTab(t, path) {
    t.path = path;
    try {
      var w = t.frame.contentWindow;
      if (w && w.location.pathname === '/filesx.html') { w.location.hash = encPath(path); return; }
    } catch (e) {}
    t.frame.src = tabUrl(path);
  }

  // Reconcile local tabs to the server's shared set (another device changed it).
  // Reuse iframes whose folder already matches so only genuinely new/changed tabs
  // reload; then mirror order + active. Suppressed so it doesn't echo back.
  //
  // A tab whose FOLDER changed is steered, not rebuilt. Rebuilding threw away
  // the loaded listing — and its focus, selection and scroll — every time the
  // shared set moved, which is what a user on one device feels when another
  // device (or a test run) changes a tab: "it works for a minute, then I have
  // to click twice again", once a minute, for as long as the other end keeps
  // moving. A new iframe is now created only for a tab that genuinely has no
  // local counterpart to reuse.
  function reconcile(server) {
    var pool = {};
    tabs.forEach(function(t) { var p = norm(curPath(t) || t.path); (pool[p] = pool[p] || []).push(t); });
    var paths = server.paths || [];
    // Pass 1: claim the tabs already sitting at the right folder — untouched.
    var claimed = {};
    var slot = paths.map(function(p) {
      var arr = pool[norm(p)];
      var t = arr && arr.length ? arr.shift() : null;
      if (t) claimed[t.id] = true;
      return t;
    });
    // Whatever is left over is a tab whose folder moved: steer it rather than
    // build a replacement, in the order the server lists them.
    var spare = tabs.filter(function(t) { return !claimed[t.id]; });
    var next = paths.map(function(p, i) {
      if (slot[i]) return slot[i];
      var t = spare.shift();
      if (t) { navigateTab(t, p); return t; }
      return makeTab(p);
    });
    if (!next.length) next.push(makeTab(HOME));
    var keep = {}; next.forEach(function(t) { keep[t.id] = true; });
    tabs.forEach(function(t) { if (!keep[t.id] && t.frame.parentNode) t.frame.parentNode.removeChild(t.frame); });
    tabs = next;
    var ai = Math.min(Math.max(0, server.active | 0), tabs.length - 1);
    _suppress = true;
    show(tabs[ai]);
    _suppress = false;
    _lastSaved = stateStr();
  }

  function tabFromEvent(e) {
    var el = e.target.closest('.tab');
    if (!el) return null;
    return tabs.filter(function(t) { return String(t.id) === el.dataset.id; })[0] || null;
  }

  // Switch on pointerdown for mouse (a focused iframe eats the first click moving
  // focus to the parent — same two-click trap as the terminal tabs); close (×)
  // and touch stay on click.
  tabsEl.addEventListener('pointerdown', function(e) {
    if (e.pointerType !== 'mouse' || e.button) return;
    if (e.target.closest('.x')) return;
    var t = tabFromEvent(e);
    if (t && t !== active) { show(t); lastMouseAt = e.timeStamp; }
  });
  tabsEl.addEventListener('click', function(e) {
    var t = tabFromEvent(e);
    if (!t) return;
    if (e.target.closest('.x')) { closeTab(t); return; }
    if (e.timeStamp - lastMouseAt < 700) return;   // mouse already handled it
    show(t);
  });
  addBtn.addEventListener('click', function() { createTab(HOME, true); });

  // Deep-link from the desktop (Upload app's "Open in Files"): open a tab at a
  // path relative to ~. The desktop posts a few times to beat the first-load
  // race, so dedupe repeats of the same path within a short window.
  function openAt(rel) {
    rel = (rel || '').replace(/^\/+/, '');      // plain (unencoded) relative path
    var base = norm(HOME);                      // no trailing slash to double up
    createTab(rel ? (base === '/' ? '/' + rel : base + '/' + rel) : HOME, true);
  }
  // ---- In-app viewer: images / videos / office docs open INSIDE Files ------
  // The listing (filesx.html) posts the view types to THIS window (its parent);
  // the viewer pages close by posting close-app to their parent (us). Nothing
  // pops a separate desktop app any more.
  var viewerEl = document.getElementById('viewer');
  var vFrame = document.getElementById('v-frame');
  var vName = document.getElementById('v-name');
  var vOfficePath = null;
  function openViewer(url, officePath, name) {
    vOfficePath = officePath || null;
    viewerEl.classList.toggle('office', !!officePath);
    if (officePath) { vName.textContent = name; vName.title = officePath; }
    vFrame.src = url;
    viewerEl.classList.add('on');
  }
  function closeViewer() {
    if (!viewerEl.classList.contains('on')) return;
    viewerEl.classList.remove('on');
    vFrame.src = 'about:blank';
    vOfficePath = null;
  }
  document.getElementById('v-close').addEventListener('click', closeViewer);
  // iOS-standalone-safe download for the office header (an <a download> would
  // replace the whole PWA view with the attachment sheet — same fix as filesx).
  var IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
               (/Mac/.test(navigator.userAgent) && 'ontouchend' in document);
  document.getElementById('v-dl').addEventListener('click', function() {
    if (!vOfficePath) return;
    var url = '/api/office/download?path=' + encodeURIComponent(vOfficePath);
    var name = vOfficePath.split('/').pop();
    if (IS_IOS && navigator.share && navigator.canShare) {
      fetch(url).then(function(r) { if (!r.ok) throw 0; return r.blob(); }).then(function(b) {
        var f = new File([b], name, { type: b.type || 'application/octet-stream' });
        if (!navigator.canShare({ files: [f] })) throw 0;
        return navigator.share({ files: [f] });
      }).catch(function(err) {
        if (err && err.name === 'AbortError') return;
        try { window.open(url); } catch (e) {}
      });
      return;
    }
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
  });

  // Claim the keyboard for this frame when it is clicked. Safari on macOS moves
  // focus on a click only to form controls and links, so clicking the media left
  // the keys in the parent frame and Esc / the arrows did nothing until a second
  // click. Only when the keys are not already ours, so nothing is stolen from an
  // input. See docs/design-decisions.md (the Files two-click saga).
  document.addEventListener('pointerdown', function (ev) {
    var t = ev.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' ||
              t.tagName === 'BUTTON' || t.tagName === 'A' || t.isContentEditable)) return;
    // Not gated on document.hasFocus() — Safari reports it true for a child
    // frame whenever the window is focused, so it bailed on every click.
    var ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;
    try { window.focus(); } catch (e) {}
    try { document.body.tabIndex = -1; document.body.focus({ preventScroll: true }); } catch (e) {}
  }, true);

  document.addEventListener('keydown', function(e) {
    // Esc closes the office view (the PDF plugin swallows keys inside the
    // iframe; image/video pages handle their own Esc and post close-app).
    if (e.key === 'Escape' && viewerEl.classList.contains('on')) closeViewer();
  });
  window.addEventListener('message', function(e) {
    if (e.origin !== location.origin || !e.data) return;
    var d = e.data;
    if (d.type === 'image-view' && d.path) openViewer('/imageview.html?path=' + encodeURIComponent(d.path));
    else if (d.type === 'video-view' && d.path) openViewer('/video.html?path=' + encodeURIComponent(d.path));
    else if (d.type === 'office-view' && d.path) {
      openViewer('/api/office/preview?path=' + encodeURIComponent(d.path) + '#toolbar=0',
                 d.path, d.path.split('/').pop());
    }
    else if (d.type === 'close-app') closeViewer();
  });

  // The desktop tells THIS frame which app is up (vibetop:active); the engine
  // tabs inside need it too — the native listing auto-refreshes only while it
  // is the app on screen, and catches up the moment it comes back.
  window.addEventListener('message', function(e) {
    if (e.origin !== location.origin || !e.data || e.data.type !== 'vibetop:active') return;
    document.querySelectorAll('iframe').forEach(function(f) {
      if (f !== vFrame && f.contentWindow) { try { f.contentWindow.postMessage(e.data, location.origin); } catch (err) {} }
    });
    if (e.data.active === 'files') focusActive();   // we are the app on screen: give the listing the keyboard
  });

  var _lastOpen = { path: null, t: 0 };
  window.addEventListener('message', function(e) {
    if (e.origin !== location.origin) return;
    if (!e.data || e.data.type !== 'files-open-tab') return;
    var rel = e.data.path || '';
    var now = Date.now();
    if (rel === _lastOpen.path && now - _lastOpen.t < 2500) return;   // dedupe retries
    _lastOpen = { path: rel, t: now };
    openAt(rel);
  });

  // Live sync (~2s): push our changes (incl. in-tab navigation, detected via the
  // live folder paths), else pull the other device's changes and reconcile. Local
  // changes win their round so we never get reverted mid-action.
  function tick() {
    renderTabs();                     // refresh labels from live folder paths
    if (!_loaded) return;
    var local = stateStr();
    // Push our change and skip the read this round — but never for ever. A
    // client whose local state will not settle used to push on every single
    // tick and never read, which is how one device held the whole account
    // hostage; after 5 pushes in a row we read regardless, so a disagreement
    // always converges instead of ping-ponging.
    if (local !== _lastSaved && _pushStreak < 5) { _pushStreak++; persist(); return; }
    _pushStreak = 0;
    fetch('/api/files/tabs?v=2').then(function(r) { return r.json(); }).then(function(s) {
      if (!s || !Array.isArray(s.paths)) return;
      if (typeof s.rev === 'number') _rev = s.rev;
      var serverStr = JSON.stringify({ paths: s.paths.map(norm), active: (typeof s.active === 'number' ? s.active : 0) });
      if (serverStr !== stateStr()) reconcile(s);       // another device changed it
    }).catch(function() {});
  }
  setInterval(tick, 2000);

  // Initial load of the shared tab set, then live sync takes over. Gated on
  // resolveHome so HOME points at the logged-in user's real home before the
  // fallback "open a Home tab" path can fire.
  resolveHome(function() {
    fetch('/api/files/tabs?v=2').then(function(r) { return r.json(); }).then(function(s) {
      if (s && typeof s.rev === 'number') _rev = s.rev;
      if (s && Array.isArray(s.paths) && s.paths.length) {
        s.paths.forEach(function(p) { createTab(p, false); });
        show(tabs[Math.min(Math.max(0, s.active | 0), tabs.length - 1)]);
      } else {
        createTab(HOME, true);
      }
    }).catch(function() {
      if (!tabs.length) createTab(HOME, true);
    }).then(function() {
      _lastSaved = stateStr();   // don't immediately re-POST the just-loaded state
      _loaded = true;
    });
  });
})();
</script>
</body>
</html>

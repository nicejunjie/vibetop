# Raw-file serving for the Files app's "Open in Browser" verb.
#
# There is no /files/ location any more: the Files app is vibetop's own
# (filesx.html, served as a static page from the web root, talking to the
# manager's /api/fs/* and the per-user file agent). FileBrowser — which used to
# own /files/ through a per-user upstream and a sub_filter patch layer — was
# retired; see docs/files-native.md and docs/design-decisions.md.
#
# Aliases / and serves raw bytes as the nginx worker user, so it MUST be gated —
# otherwise an unauthenticated LAN client could read any file the worker can
# (arbitrary file read). Multi-user: this is still a shared/APP_USER-scoped serve
# (the embedded Browser is APP_USER's), so authcheck requires a valid session AND
# the operator (admin). The dotfile 403 (regex, takes precedence) stays as
# defense-in-depth.
location ~ "^/fileview/(.*/)?\." { return 403; }

location /fileview/ {
    # authcheck requires a valid session AND restricts /fileview/ to the operator
    # (it 403s a non-admin, 401s the unauthenticated) — so the raw alias can't leak
    # APP_USER's tree to another user or an anonymous client.
    auth_request /internal/authcheck;
    error_page 401 = @login;
    alias /;
    autoindex off;
    add_header Cache-Control 'no-cache' always;
}

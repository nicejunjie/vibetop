    var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), mn = Math.floor((s % 3600) / 60);
    return 'Expires in ' + (d ? d + 'd ' + h + 'h' : (h ? h + 'h ' + mn + 'm' : mn + 'm'));
  }
  var TTL_OPTS = [['0.0416667', '1 hour'], ['1', '1 day'], ['7', '7 days'], ['30', '30 days']];

  function shareStart() {
    if (selCount !== 1) return;
    var name = selNames()[0];
    var abs = joinPath(path, name);
    var rel = (HOME && abs.indexOf(HOME + '/') === 0) ? abs.slice(HOME.length + 1) : abs;
    var m = rawCard('Public link');
    var busy = el('p', null, 'Creating link…');
    m.card.appendChild(busy);
    shareApi('/api/share', { path: rel, ttl: 7 }).then(function(d) {
      busy.remove();
      if (!d || !d.url) { renderShareRefusal(m, (d && d.error) || 'Could not create the link.'); return; }
      renderShareLink(m, d, rel);
    }).catch(function() {
      busy.remove();
      renderShareRefusal(m, 'Could not create the link — network error.');
    });
  }
  function renderShareRefusal(m, msg) {
    m.card.appendChild(el('p', null, msg));
    var btns = el('div', 'mbtns');
    var ok = el('button', 'mok', 'Close');
    ok.addEventListener('click', m.close);
    btns.appendChild(ok);
    m.card.appendChild(btns);
    ok.focus();
  }
  function renderShareLink(m, d, rel) {
    var token = d.token;
    m.card.appendChild(el('p', null,
      'Anyone with this link can ' +
      (d.kind === 'dir' ? 'download “' + d.name + '” as a zip.' : 'view or download “' + d.name + '”.') +
      ' No login needed — treat it like a password.'));
    var urlRow = el('div', 'shr-row');
    var input = el('input', 'shr-url');
    input.readOnly = true; input.value = d.url;
    input.addEventListener('focus', function() { input.select(); });
    var copy = el('button', 'shr-sm', 'Copy');
    copy.addEventListener('click', function() { copyText(input.value, copy); });
    urlRow.appendChild(input); urlRow.appendChild(copy);
    m.card.appendChild(urlRow);
    var expRow = el('div', 'shr-row');
    var expLbl = el('span', 'shr-exp', expiryText(d.expires));
    var sel = el('select', 'shr-sel');
    sel.setAttribute('aria-label', 'Link lifetime');
    TTL_OPTS.forEach(function(o) {
      var op = el('option', null, o[1]);
      op.value = o[0];
      if (o[0] === '7') op.selected = true;
      sel.appendChild(op);
    });
    sel.addEventListener('change', function() {
      // Re-mint with the new lifetime (the old link is revoked).
      shareApi('/api/share/revoke', { token: token }).catch(function() {});
      shareApi('/api/share', { path: rel, ttl: parseFloat(sel.value) }).then(function(r) {
        if (r && r.url) { token = r.token; input.value = r.url; expLbl.textContent = expiryText(r.expires); }
        else expLbl.textContent = (r && r.error) || 'Could not update the link.';
      }).catch(function() {});
    });
    expRow.appendChild(expLbl); expRow.appendChild(sel);
    m.card.appendChild(expRow);
    var btns = el('div', 'mbtns');
    var manage = el('button', 'mcancel', 'Manage links');
    manage.addEventListener('click', function() { m.close(); manageShares(); });
    var revoke = el('button', 'mok danger', 'Revoke');
    revoke.addEventListener('click', function() {
      shareApi('/api/share/revoke', { token: token }).catch(function() {});
      toast('Link revoked');
      m.close();
    });
    var done = el('button', 'mok', 'Done');
    done.addEventListener('click', m.close);
    btns.appendChild(manage); btns.appendChild(revoke); btns.appendChild(done);
    m.card.appendChild(btns);
    input.focus();
  }
  function manageShares() {
    var m = rawCard('Shared links');
    var list = el('div', 'shr-list');
    list.appendChild(el('div', 'empty', 'Loading…'));
    m.card.appendChild(list);
    var btns = el('div', 'mbtns');
    var close = el('button', 'mok', 'Close');
    close.addEventListener('click', m.close);
    btns.appendChild(close);
    m.card.appendChild(btns);
    shareApi('/api/share/list').then(function(d) {
      list.innerHTML = '';
      var shares = (d && d.shares) || [];
      if (!shares.length) { list.appendChild(el('div', 'empty', 'No active links.')); return; }
      shares.forEach(function(s) {
        var row = el('div', 'shr-item');
        var nm = el('span', 'nm2');
        nm.appendChild(document.createTextNode(s.name));
        if (s.kind === 'dir') nm.appendChild(el('span', 'shr-tag', 'folder'));
        nm.appendChild(el('span', 'dim', expiryText(s.expires) + ' · ' + s.hits + ' hit' + (s.hits === 1 ? '' : 's')));
        nm.title = s.rel || s.name;
        var cp = el('button', 'shr-sm', 'Copy');
        cp.addEventListener('click', function() { copyText(s.url, cp); });
        var rv = el('button', 'shr-sm danger', 'Revoke');
        rv.addEventListener('click', function() {
          shareApi('/api/share/revoke', { token: s.token }).then(function() {
            row.remove();
            if (!list.querySelector('.shr-item')) list.appendChild(el('div', 'empty', 'No active links.'));
          }).catch(function() {});
        });
        row.appendChild(nm); row.appendChild(cp); row.appendChild(rv);
        list.appendChild(row);
      });
    }).catch(function() {
      list.innerHTML = '';
      list.appendChild(el('div', 'empty', 'Couldn’t load the link list.'));
    });
  }
  document.getElementById('a-share').addEventListener('click', shareStart);

  // ---- editor overlay ----
  var edEl = document.getElementById('ed');
  var edTa = document.getElementById('ed-ta');
  var edNameEl = document.getElementById('ed-name');
  var edTitleEl = document.getElementById('ed-title');
  var edSizeEl = document.getElementById('ed-size');
  var edPosEl = document.getElementById('ed-pos');
  var edSaveBtn = document.getElementById('ed-save');
  var edPath = null, edMtime = null, edSavedText = '', edSaving = false, edReturnFocus = null;

  function edOpen() { return edEl.classList.contains('open'); }
  function edDirty() { return edOpen() && edTa.value !== edSavedText; }
  function edSyncState() {
    var dirty = edTa.value !== edSavedText;
    edEl.classList.toggle('dirty', dirty);
    edSaveBtn.disabled = !dirty || edSaving;
    edSizeEl.textContent = fmtSize(new Blob([edTa.value]).size);
  }
  function edUpdatePos() {
    var s = edTa.selectionStart || 0;
    var before = edTa.value.slice(0, s);
    edPosEl.textContent = 'Ln ' + before.split('\n').length + ', Col ' + (s - before.lastIndexOf('\n'));
  }
  function openEditor(absPath, name, text, mtime, gotoLine) {
    edReturnFocus = document.activeElement;
    edPath = absPath; edMtime = mtime;
    edNameEl.textContent = name;
    edTitleEl.title = absPath;
    edSavedText = text;
    edTa.value = text;
    edEl.classList.add('open');
    edSyncState();
    edTa.focus();
    if (gotoLine && gotoLine > 1) {
      var idx = 0, l = 1;
      while (l < gotoLine) { var j = text.indexOf('\n', idx); if (j === -1) break; idx = j + 1; l++; }
      try { edTa.setSelectionRange(idx, idx); } catch (e) {}
      var lh = parseFloat(getComputedStyle(edTa).lineHeight) || 19;
      edTa.scrollTop = Math.max(0, (gotoLine - 1) * lh - edTa.clientHeight / 3);
    } else {
      try { edTa.setSelectionRange(0, 0); } catch (e) {}
      edTa.scrollTop = 0;
    }
    edUpdatePos();
  }
  function closeEditorNow() {
    edEl.classList.remove('open');
    // Blur NOW: the hidden textarea otherwise keeps focus until the next render
    // flush, and a fast next keypress (double-Esc) would be swallowed by the
    // global handler's input guard instead of e.g. closing the search.
    try { edTa.blur(); } catch (e) {}
    edTa.value = ''; edSavedText = ''; edPath = null;
    if (edReturnFocus && edReturnFocus.focus) { try { edReturnFocus.focus(); } catch (e) {} }
  }
  function requestCloseEditor() {
    if (!edDirty()) { closeEditorNow(); return; }
    cardChoice({
      title: 'Discard unsaved changes?',
      msg: 'Your edits to ' + (edNameEl.textContent || 'this file') + ' aren’t saved.',
      buttons: [
        { label: 'Keep editing', value: false, cancel: true },
        { label: 'Discard', value: true, danger: true }
      ],
      defaultValue: true, escValue: false, focusValue: false
    }).then(function(discard) { if (discard) closeEditorNow(); });
  }
  function edSave(overwrite) {
    if (!edPath || edSaving) return;
    if (!overwrite && edTa.value === edSavedText) return;    // nothing to save
    var val = edTa.value, p = edPath;
    edSaving = true; edSyncState();
    var url = '/api/fs/upload?path=' + encodeURIComponent(p) +
              (!overwrite && edMtime != null ? '&ifMtime=' + edMtime : '');
    fetch(url, { method: 'POST', body: val })
      .then(function(r) { return r.json(); })
      .then(function(d) {
        edSaving = false;
        if (edPath !== p) return;                            // closed meanwhile
        if (d && d.ok) {
          edSavedText = val;
          edSyncState();
          api('/api/fs/stat?path=' + encodeURIComponent(p)).then(function(sd) {
            if (edPath === p && sd && sd.ok && sd.stat) edMtime = sd.stat.mtime;
          }).catch(function() {});
          toast('Saved');
          if (!searchActive) refresh();                      // update the row's size/mtime
          return;
        }
        edSyncState();
        if (d && d.code === 'econflict') {
          cardChoice({
            title: 'File changed on disk',
            msg: 'Another device or program modified this file after you opened it.',
            buttons: [
              { label: 'Keep editing', value: null, cancel: true },
              { label: 'Reload', value: 'reload' },
              { label: 'Overwrite', value: 'overwrite', danger: true }
            ],
            escValue: null, focusValue: null
          }).then(function(v) {
            if (v === 'overwrite') edSave(true);             // discard THEIR version
            else if (v === 'reload') edReload();             // discard MY edits
          });
          return;
        }
        toast((d && d.error) || 'Save failed', true);
      })
      .catch(function() {
        edSaving = false; edSyncState();
        toast('Save failed — network error', true);
      });
  }
  function edReload() {
    var p = edPath;
    Promise.all([
      api('/api/fs/stat?path=' + encodeURIComponent(p)).catch(function() { return null; }),
      api('/api/fs/read?path=' + encodeURIComponent(p) + '&max=' + READ_MAX).catch(function() { return null; })
    ]).then(function(rs) {
      if (edPath !== p) return;
      var sd = rs[0], d = rs[1];
      if (!d || !d.ok) { toast('Couldn’t reload the file', true); return; }
      edMtime = (sd && sd.ok && sd.stat) ? sd.stat.mtime : null;
      edSavedText = d.text || '';
      edTa.value = edSavedText;
      edSyncState(); edUpdatePos();
      toast('Reloaded');
    });
  }
  edTa.addEventListener('input', function() { edSyncState(); edUpdatePos(); });
  edTa.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {                                    // insert two spaces
      e.preventDefault();
      var s = edTa.selectionStart, en = edTa.selectionEnd;
      edTa.value = edTa.value.slice(0, s) + '  ' + edTa.value.slice(en);
      edTa.selectionStart = edTa.selectionEnd = s + 2;
      edSyncState(); edUpdatePos();
    }
  });
  document.addEventListener('selectionchange', function() {
    if (edOpen() && document.activeElement === edTa) edUpdatePos();
  });
  edSaveBtn.addEventListener('click', function() { edSave(false); });
  document.getElementById('ed-close').addEventListener('click', requestCloseEditor);

  // ---- search (🔍 / Ctrl+F): current folder, recursive, runs on Enter ----
  var sbarEl = document.getElementById('sbar');
  var sqEl = document.getElementById('sq');
  var scopeEl = document.getElementById('scope');
  var searchBtn = document.getElementById('searchbtn');
  var searchOpen = false, searchActive = false, searchMode = 'names', searchSeq = 0;

  function updateScope() {
    var label = path ? ((HOME && path === HOME) ? 'Home' : baseOf(path)) : '';
    scopeEl.textContent = 'in ' + label;
    scopeEl.title = path || '';
  }
  function openSearch() {
    searchOpen = true;
    sbarEl.classList.add('on');
    searchBtn.setAttribute('aria-pressed', 'true');
    updateScope();
    sqEl.focus(); sqEl.select();
  }
  function closeSearch() {
    var wasActive = searchActive;
    searchOpen = false; searchActive = false;
    searchSeq++;                                             // drop in-flight results
    sbarEl.classList.remove('on');
    searchBtn.setAttribute('aria-pressed', 'false');
    setNotice('');
    if (wasActive) refresh();                                // restore the folder listing
  }
  function setSearchMode(m) {
    searchMode = m;
    document.getElementById('sm-names').classList.toggle('on', m === 'names');
    document.getElementById('sm-content').classList.toggle('on', m === 'content');
    if (searchActive) runSearch();                           // re-run an active search
  }
  function relParent(abs) {
    var dir = abs.slice(0, abs.lastIndexOf('/')) || '/';
    if (dir === path) return '';
    var root = path === '/' ? '/' : path + '/';
    return dir.indexOf(root) === 0 ? dir.slice(root.length) : dir;
  }
  // Highlight q inside text with <mark> — DOM-built, never innerHTML.
  function markify(parent, text, q) {
    var lower = text.toLowerCase(), lq = (q || '').toLowerCase(), i = 0;
    if (!lq) { parent.appendChild(document.createTextNode(text)); return; }
    for (;;) {
      var j = lower.indexOf(lq, i);
      if (j === -1) { parent.appendChild(document.createTextNode(text.slice(i))); return; }
      if (j > i) parent.appendChild(document.createTextNode(text.slice(i, j)));
      parent.appendChild(el('mark', null, text.slice(j, j + q.length)));
      i = j + q.length;
    }
  }
  function runSearch() {
    var q = sqEl.value.trim();
    if (!q || !path) return;
    var my = ++searchSeq;
    searchActive = true;
    if (selectMode) exitSelectMode(); else clearSel(true);
    rows = [];                                               // list keyboard/selection off
    mainEl.innerHTML = '';
    mainEl.appendChild(stateEl([el('div', null, 'Searching…')]));
    setNotice('');
    api('/api/fs/search?path=' + encodeURIComponent(path) + '&q=' + encodeURIComponent(q) + '&mode=' + searchMode)
      .then(function(d) {
        if (my !== searchSeq || !searchActive) return;
        if (!d || !d.ok) {
          mainEl.innerHTML = '';
          mainEl.appendChild(stateEl([el('div', 'big', 'Search failed'), el('div', 'pth', (d && d.error) || 'error')]));
          return;
        }
        renderResults(d, q);
      })
      .catch(function() {
        if (my !== searchSeq || !searchActive) return;
        mainEl.innerHTML = '';
        mainEl.appendChild(stateEl([el('div', 'big', 'Search failed'), el('div', 'pth', 'network error')]));
      });
  }
  function renderResults(d, q) {
    rows = [];
    mainEl.innerHTML = '';
    var res = d.results || [];
    if (!res.length) {
      mainEl.appendChild(stateEl([el('div', 'big', 'No matches')]));
      return;
    }
    var frag = document.createDocumentFragment();
    res.forEach(function(it) {
      var name = baseOf(it.path);
      var r = el('div', 'row' + (it.isDir ? ' dir' : '') + (d.mode === 'content' ? ' sres' : ''));
      r.appendChild(el('span', 'ic', iconFor(name, !!it.isDir)));
      var nm = el('span', 'nm');
      markify(nm, name, d.mode === 'names' ? q : '');
      nm.title = it.path;
      r.appendChild(nm);
      var pp = relParent(it.path);
      if (pp) { var ppe = el('span', 'pp', pp); ppe.title = it.path; r.appendChild(ppe); }
      if (d.mode === 'content') {
        r.appendChild(el('span', 'ln', ':' + it.line));
        var sn = el('div', 'snip');
        markify(sn, it.text || '', q);
        sn.title = it.text || '';
        r.appendChild(sn);
        r.addEventListener('click', function() { openFile(it.path, name, it.line); });
      } else {
        r.addEventListener('click', function() { openNameResult(it); });
      }
      frag.appendChild(r);
    });
    mainEl.appendChild(frag);
    mainEl.scrollTop = 0;
    if (d.truncated) setNotice('Showing the first ' + res.length + ' matches.');
  }
  // Names result: jump to its folder with the item selected; files also open.
  function openNameResult(it) {
    var dir = it.path.slice(0, it.path.lastIndexOf('/')) || '/';
    var name = baseOf(it.path);
    searchActive = false; searchSeq++;
    searchOpen = false;
    sbarEl.classList.remove('on');
    searchBtn.setAttribute('aria-pressed', 'false');
    pendingFocusName = name;
    if (dir === path) load(path, true); else go(dir);
    if (!it.isDir) setTimeout(function() { openFile(it.path, name); }, 200);
  }
  searchBtn.addEventListener('click', function() { if (searchOpen) closeSearch(); else openSearch(); });
  document.getElementById('s-close').addEventListener('click', closeSearch);
  document.getElementById('sm-names').addEventListener('click', function() { setSearchMode('names'); });
  document.getElementById('sm-content').addEventListener('click', function() { setSearchMode('content'); });
  sqEl.addEventListener('keydown', function(ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); runSearch(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); closeSearch(); }
  });

  // ---- toolbar wiring ----
  addrEl.addEventListener('keydown', function(ev) {
    if (ev.key === 'Escape') { addrEl.value = path || ''; addrEl.blur(); return; }
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    var p = normPath(addrEl.value);
    if (!p) return;
    addrEl.blur();
    // Typing a FILE path is a natural ask — stat first and open it in place
    // (folder unchanged) instead of showing "Not a folder".
    api('/api/fs/stat?path=' + encodeURIComponent(p)).then(function(d) {
      if (d && d.ok && d.stat && !d.stat.isDir) {
        addrEl.value = path || '';
        openEntry({ name: baseOf(p), isDir: false }, p);
      } else {
        go(p);
      }
    }).catch(function() { go(p); });
  });
  addrEl.addEventListener('blur', function() {
    // Abandoned edits revert quietly so the bar always shows the real location.
    if (addrEl.value !== path) addrEl.value = path || '';
  });

  sortKeyEl.addEventListener('change', function() {
    sortKey = sortKeyEl.value; savePrefs(); syncControls(); renderList();
  });
  sortDirEl.addEventListener('click', function() {
    sortAsc = !sortAsc; savePrefs(); syncControls(); renderList();
  });
  hiddenEl.addEventListener('click', function() {
    showHidden = !showHidden; savePrefs(); syncControls(); renderList();
  });
  document.getElementById('refresh').addEventListener('click', refresh);
  document.getElementById('manage').addEventListener('click', function() {
    // Escape hatch to FileBrowser for what's not native yet (editor, search) —
    // swap THIS iframe to it at the current folder.
    if (!path) return;
    location.href = '/files/files' + (path === '/' ? '' : enc(path)) + '/';
  });
  document.getElementById('newbtn').addEventListener('click', newFolder);
  document.getElementById('upbtn').addEventListener('click', function() { fileInput.click(); });
  pasteBtn.addEventListener('click', doPaste);
  document.getElementById('a-rename').addEventListener('click', startRename);
  document.getElementById('a-download').addEventListener('click', doDownload);
  document.getElementById('a-copy').addEventListener('click', function() { doCopyCut('copy'); });
  document.getElementById('a-cut').addEventListener('click', function() { doCopyCut('cut'); });
  document.getElementById('a-delete').addEventListener('click', doDelete);
  document.getElementById('a-clear').addEventListener('click', function() {
    if (selectMode) exitSelectMode(); else clearSel();
  });
  // Another tab changed the shared clipboard → update the Paste button + cut dims.
  window.addEventListener('storage', function(ev) {
    if (ev.key === 'fsx.clip') syncSelDom();
  });

  // ---- init: resolve home, then honor #/abs/path (the wrapper's deep link) ----
  syncControls();
  renderActions();
  api('/api/fs/home').then(function(d) {
    HOME = (d && d.ok && d.home) || '';
  }).catch(function() {}).then(function() {
    var p = dec(location.hash.slice(1));
    if (!p || p.charAt(0) !== '/') {
      p = HOME || '/';
      try { history.replaceState(null, '', '#' + enc(p)); } catch (e) {}
    }
    load(p);
  });
})();
</script>
</body>
</html>

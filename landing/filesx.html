<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Files — Vibetop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column; background: #0e1117; color: #d4d8de;
    font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent;
  }

  /* ---- toolbar: one row on desktop (wraps gracefully when narrow); ≤736px it
     stacks into the documented mobile layout (controls grid → clickable
     breadcrumb line → single-row address bar) ---- */
  .toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-shrink: 0;
    padding: 7px 10px; background: #161b22; border-bottom: 1px solid #2a3040;
    user-select: none; -webkit-user-select: none; z-index: 3;
  }
  .crumbs {
    display: flex; align-items: center; flex: 0 1 auto; min-width: 90px;
    overflow-x: auto; white-space: nowrap; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .crumbs::-webkit-scrollbar { display: none; }
  .crumb {
    flex: 0 0 auto; border: 0; background: transparent; color: #aab4c5;
    font: 13px system-ui, sans-serif; padding: 5px 6px; border-radius: 5px;
    cursor: pointer; white-space: nowrap;
  }
  .crumb:hover { background: #1f2733; color: #e6edf3; }
  .crumb:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }
  .crumb.cur { color: #e6edf3; font-weight: 600; }
  .crumb-sep { flex: 0 0 auto; color: #4a5265; font-size: 11px; padding: 0 1px; }
  .addr { display: flex; flex: 1 1 160px; min-width: 120px; }
  .addr input {
    flex: 1; min-width: 0; background: #0e1117; color: #d4d8de;
    border: 1px solid #2a3040; border-radius: 6px; padding: 6px 9px;
    font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .addr input:focus { outline: none; border-color: #8a4adb; }
  .tools { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .tools button, .tools select, .actbar button {
    background: #1f2733; color: #d4d8de; border: 1px solid #2a3040;
    border-radius: 6px; padding: 5px 9px; font: 12px system-ui, sans-serif;
    cursor: pointer; min-height: 30px; white-space: nowrap;
  }
  /* iOS/WebKit paints a native LIGHT select on a dark toolbar (reported: the
     sort box was a white slab among dark buttons) — force our own chrome and
     draw the caret ourselves. */
  .tools select {
    appearance: none; -webkit-appearance: none;
    padding-right: 24px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6' fill='none' stroke='%23aab4c5' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'><path d='M1 1.2 5 4.8 9 1.2'/></svg>");
    background-repeat: no-repeat; background-position: right 8px center; background-size: 9px 6px;
  }
  .tools select option { background: #1f2733; color: #d4d8de; }
  .tools button:hover, .actbar button:hover { background: #253044; }
  .tools select:hover { background-color: #253044; }   /* keep the caret image */
  .tools button:focus-visible, .tools select:focus-visible, .actbar button:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }
  .tools button[aria-pressed="true"] { background: #241a38; border-color: #8a4adb; color: #fff; }
  .tools button:disabled { opacity: .45; cursor: default; }
  #manage { color: #b79be8; }
  #pastebtn { display: none; color: #b79be8; }
  #pastebtn.on { display: inline-block; }
  .m-only { display: none; }        /* mobile-only controls (compact sort, ⋯) */
  /* inline SVG icons (not emoji — 👁/🔍/⬆ rendered as mismatched color glyphs
     on iOS, reported as toy-like): monochrome, inherit the button color */
  .tools .bi { display: inline-flex; align-items: center; vertical-align: -3px; }
  .tools svg { width: 15px; height: 15px; flex: 0 0 auto; }
  #hidden .bi { display: none; }    /* desktop keeps the text label */

  /* ⋯ overflow popover (mobile) */
  .morepop {
    position: fixed; z-index: 6; background: #161b22; border: 1px solid #2a3040;
    border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.5); padding: 4px;
    min-width: 150px;
  }
  .morepop button {
    display: block; width: 100%; text-align: left; background: transparent;
    border: 0; color: #d4d8de; font: 13px system-ui, sans-serif;
    padding: 10px 12px; border-radius: 6px; cursor: pointer; min-height: 40px;
  }
  .morepop button:active { background: #253044; }
  /* right-click context menu (desktop) — the same verbs the touch pill carries */
  .morepop.ctx { min-width: 186px; }
  .morepop.ctx .sep { height: 1px; margin: 4px 6px; background: #2a3040; }
  .morepop.ctx button.danger { color: #f1b3b3; }
  .morepop.ctx button.danger:hover { background: #3a2024; }

  /* one-line notice under the toolbar (truncated listings, quiet errors) */
  .notice {
    display: none; flex-shrink: 0; padding: 5px 14px; font-size: 12px;
    color: #aab4c5; background: #12161d; border-bottom: 1px solid #20262f;
  }
  .notice.on { display: block; }

  /* slim upload progress (per-file bar + overall n/N) */
  .uprog { display: none; flex-shrink: 0; padding: 5px 14px 7px; background: #12161d; border-bottom: 1px solid #20262f; }
  .uprog.on { display: block; }
  .uprog-txt { font-size: 12px; color: #aab4c5; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .uprog-bar { height: 3px; background: #1f2733; border-radius: 2px; overflow: hidden; }
  .uprog-fill { height: 100%; width: 0; background: #8a4adb; transition: width .15s linear; }

  /* selection action bar — appears with a selection (desktop) / select mode
     (touch). A FLOATING bottom pill, not in-flow: appearing must never shift
     the listing (an in-flow bar broke double-click — the first click's bar
     pushed the rows down under the cursor) and bottom = thumb-reachable. */
  .actbar {
    display: none; position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 14px; z-index: 5; align-items: center; gap: 6px;
    padding: 6px 8px; background: #161b22; border: 1px solid #2a3040;
    border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.5);
    max-width: min(96vw, 900px);   /* the full 10-verb office set fits unscrolled on desktop */
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    user-select: none; -webkit-user-select: none;
  }
  .actbar::-webkit-scrollbar { display: none; }
  .actbar.on { display: flex; }
  .actbar.on ~ .main { padding-bottom: 62px; }   /* last rows stay reachable under the pill */
  .actbar .cnt { flex: 0 0 auto; font-size: 12px; color: #aab4c5; padding: 0 4px 0 6px; white-space: nowrap; }
  .actbar .sp { flex: 0 0 2px; }
  .actbar button:disabled { opacity: .4; cursor: default; }
  .actbar [hidden] { display: none !important; }   /* inapplicable verbs hide, never grey */
  .actbar .danger { color: #f1b3b3; }
  .actbar .danger:hover { background: #3a2024; border-color: #5a2c33; }
  .actbar .dv { flex: 0 0 1px; align-self: stretch; margin: 3px 3px; background: #2a3040; }
  .actbar .abi { display: none; }                  /* icons appear on mobile only */
  /* With a real mouse the bottom pill is the WRONG surface: a left click is a
     selection, and the actions belong in the right-click menu where every
     desktop file manager puts them. Touch keeps the pill (no right-click, and
     the thumb-reachable bottom bar is the only always-visible way to act). */
  @media (hover: hover) and (pointer: fine) {
    .actbar.on { display: none; }
    .actbar.on ~ .main { padding-bottom: 0; }
  }

  /* OS drag-and-drop upload: full-listing drop highlight */
  .dropz {
    display: none; position: fixed; inset: 0; z-index: 40; pointer-events: none;
    align-items: center; justify-content: center; background: rgba(14,17,23,.82);
    padding: 26px;
  }
  .dropz.on { display: flex; }
  .dropz-in {
    border: 2px dashed #8a4adb; border-radius: 14px; padding: 30px 44px;
    text-align: center; background: rgba(36,26,56,.5); max-width: 90%;
  }
  .dropz-in .big2 { font-size: 15px; font-weight: 650; color: #e6edf3; margin-bottom: 6px; }
  .dropz-in .sub2 { font-size: 12.5px; color: #aab4c5; }

  /* info dialog rows (inside .mcard) */
  .inf { margin: 0 0 14px; }
  .inf-row { display: flex; gap: 10px; padding: 3px 0; font-size: 13px; line-height: 1.45; }
  .inf-k { flex: 0 0 88px; color: #6b7488; }
  .inf-v { flex: 1; min-width: 0; color: #d4d8de; word-break: break-word; }
  .inf-v.mono { font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .inf-v.mono.hash { cursor: pointer; }
  .inf-v.mono.hash:hover { color: #fff; }
  button.inf-show {
    background: transparent; border: 0; padding: 0; color: #b79be8;
    font: 12.5px system-ui, sans-serif; cursor: pointer; text-decoration: underline;
  }
  button.inf-show:hover { color: #d4c1f5; }
  button.inf-show:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }

  /* search bar (🔍 / Ctrl+F) — slim row under the toolbar */
  .sbar {
    display: none; align-items: center; gap: 8px; flex-shrink: 0;
    padding: 6px 10px; background: #12161d; border-bottom: 1px solid #20262f;
    user-select: none; -webkit-user-select: none;
  }
  .sbar.on { display: flex; }
  .sbar input {
    flex: 1 1 160px; min-width: 100px; background: #0e1117; color: #d4d8de;
    border: 1px solid #2a3040; border-radius: 6px; padding: 6px 9px;
    font: 13px system-ui, sans-serif;
  }
  .sbar input:focus { outline: none; border-color: #8a4adb; }
  .seg { display: flex; flex: 0 0 auto; border: 1px solid #2a3040; border-radius: 6px; overflow: hidden; }
  .seg button {
    border: 0; background: transparent; color: #aab4c5; padding: 5px 10px;
    font: 12px system-ui, sans-serif; cursor: pointer; min-height: 28px;
  }
  .seg button:hover { background: #1f2733; }
  .seg button.on { background: #241a38; color: #fff; }
  .seg button:focus-visible { outline: 2px solid #8a4adb; outline-offset: -2px; }
  .scope { flex: 0 1 auto; min-width: 0; font-size: 12px; color: #6b7488; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sbar .sx {
    flex: 0 0 auto; background: #1f2733; color: #d4d8de; border: 1px solid #2a3040;
    border-radius: 6px; padding: 5px 10px; font: 12px system-ui, sans-serif;
    cursor: pointer; min-height: 30px;
  }
  .sbar .sx:hover { background: #253044; }
  .sbar .sx:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }

  /* ---- listing ---- */
  .main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 5px 14px;
    min-height: 36px; cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .row:hover { background: #161b22; }
  .row.sel { background: #1f2937; box-shadow: inset 2px 0 0 #8a4adb; }
  .row.cut { opacity: .45; }
  .row.droptgt { background: #241a38; box-shadow: inset 0 0 0 1px #8a4adb; }
  .row .ck {
    display: none; flex: 0 0 18px; height: 18px; border: 1.5px solid #4a5265;
    border-radius: 50%; align-items: center; justify-content: center;
    font-size: 11px; color: transparent;
  }
  .main.selmode .row .ck { display: inline-flex; }
  .row.sel .ck { background: #8a4adb; border-color: #8a4adb; color: #fff; }
  .row.sel .ck::after { content: "✓"; }
  .row .ic { flex: 0 0 22px; text-align: center; font-size: 15px; }
  .row .ic img.th {
    width: 22px; height: 22px; object-fit: cover; border-radius: 4px;
    display: block; margin: 0 auto; background: #10141b;
  }
  /* .mid wraps name (+ mobile meta subtitle); a plain flex row on desktop */
  .row .mid { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }
  .row .meta { display: none; }
  .row .nm { flex: 1 1 auto; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.dir .nm { color: #e6edf3; }
  .row input.edit {
    flex: 1 1 auto; min-width: 0; background: #0e1117; color: #e6edf3;
    border: 1px solid #8a4adb; border-radius: 5px; padding: 4px 7px;
    font: 13px system-ui, sans-serif;
  }
  .row input.edit:focus { outline: none; }
  .row .sz {
    /* system font + tabular digits: aligned numbers WITHOUT the wide monospace
       gap between number and unit ("79  KB" report) */
    flex: 0 0 76px; text-align: right; font: 12px system-ui, sans-serif;
    font-variant-numeric: tabular-nums; color: #8a93a6; white-space: nowrap;
  }
  .row .mt { flex: 0 0 96px; text-align: right; font-size: 12px; color: #6b7488; white-space: nowrap; }

  /* ---- Layout: grid / gallery views (the classic app's Layout switcher).
     Same .row elements — so selection, drag, double-click and the context
     menu all keep working — re-flowed as tiles. ---- */
  .main.gv { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; padding: 10px; }
  .main.gv .row {
    position: relative; flex: 0 0 auto; width: 108px; min-height: 0;
    flex-direction: column; align-items: stretch; gap: 4px;
    padding: 8px 6px; border-radius: 8px; text-align: center;
  }
  .main.gv.gallery .row { width: 168px; }
  .main.gv .row.sel { box-shadow: inset 0 0 0 2px #8a4adb; }
  .main.gv .row .ic {
    flex: 0 0 auto; height: 70px; font-size: 34px;
    display: flex; align-items: center; justify-content: center;
  }
  .main.gv.gallery .row .ic { height: 120px; font-size: 46px; }
  .main.gv .row .ic img.th { width: 100%; height: 100%; border-radius: 6px; }
  .main.gv .row .mid { flex: 0 0 auto; flex-direction: column; align-items: stretch; gap: 1px; }
  .main.gv .row .nm {
    font-size: 12.5px; white-space: normal; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .main.gv .row .meta { display: block; font-size: 11px; }
  .main.gv .row .sz, .main.gv .row .mt { display: none; }
  .main.gv .row .ck { position: absolute; top: 6px; left: 6px; background: #0e1117cc; }
  .main.gv .row input.edit { text-align: center; }

  /* search result rows: dimmed parent path; content mode adds :line + snippet */
  .row .pp { flex: 0 1 auto; min-width: 0; font-size: 12px; color: #6b7488; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .ln { flex: 0 0 auto; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: #6b7488; }
  .row.sres { flex-wrap: wrap; row-gap: 1px; padding-top: 6px; padding-bottom: 6px; }
  .row.sres .snip {
    flex: 1 0 100%; min-width: 0; margin-left: 32px;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #8a93a6;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row mark { background: rgba(138, 74, 219, .4); color: #fff; border-radius: 2px; padding: 0 1px; }

  /* drag ghost (pointer-based drag-to-folder, desktop) */
  .dghost {
    position: fixed; z-index: 50; pointer-events: none; background: #241a38;
    border: 1px solid #8a4adb; color: #e6edf3; font-size: 12px;
    padding: 4px 10px; border-radius: 6px; opacity: .95; white-space: nowrap;
  }

  /* quiet centered states: loading / empty / error */
  .state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 48px 20px; text-align: center; color: #6b7488; font-size: 13px;
  }
  .state .big { font-size: 15px; color: #aab4c5; }
  .state .pth { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #4a5265; word-break: break-all; }
  .state button {
    background: #1f2733; color: #d4d8de; border: 1px solid #2a3040; border-radius: 6px;
    padding: 7px 14px; font: 13px system-ui, sans-serif; cursor: pointer; min-height: 34px;
  }
  .state button:hover { background: #253044; }
  .state button:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }

  /* ---- confirm card (delete) — vibe-modal conventions, self-contained ---- */
  .mov {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center;
    justify-content: center; background: rgba(6,9,14,.55); padding: 20px;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .mcard {
    background: #161b22; border: 1px solid #2a3040; border-radius: 12px;
    box-shadow: 0 12px 44px rgba(0,0,0,.55); max-width: 400px; width: 100%;
    padding: 18px 18px 14px; color: #e6edf3;
  }
  .mcard h3 { margin: 0 0 8px; font-size: 15px; font-weight: 650; color: #f0f4f8; }
  .mcard p { margin: 0 0 14px; font-size: 13px; line-height: 1.5; color: #b9c6d4; }
  .mcard ul { margin: 0 0 14px; padding: 0; list-style: none; max-height: 180px; overflow-y: auto; }
  .mcard li { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: #b9c6d4; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mcard li.more { color: #6b7488; font-family: system-ui, sans-serif; }
  .mbtns { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .mbtns button { font: 600 13px system-ui, sans-serif; padding: 8px 15px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; min-height: 36px; }
  .mbtns .mcancel { background: transparent; color: #9fb0c0; border-color: #2a3040; }
  .mbtns .mcancel:hover { background: rgba(255,255,255,.06); color: #c8d4e0; }
  .mbtns .mok { background: #2f6fd6; color: #fff; }
  .mbtns .mok.danger { background: #c0392b; }
  .mbtns .mok:hover { filter: brightness(1.12); }
  .mbtns button:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }

  /* share card internals (link row / expiry row / manage list) */
  .shr-row { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
  .shr-url {
    flex: 1; min-width: 0; background: #0e1117; color: #d4d8de;
    border: 1px solid #2a3040; border-radius: 6px; padding: 7px 9px;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .shr-url:focus { outline: none; border-color: #8a4adb; }
  .shr-sm {
    flex: 0 0 auto; background: #1f2733; color: #d4d8de; border: 1px solid #2a3040;
    border-radius: 6px; padding: 6px 11px; font: 12px system-ui, sans-serif;
    cursor: pointer; min-height: 32px; white-space: nowrap;
  }
  .shr-sm:hover { background: #253044; }
  .shr-sm.danger { color: #f1b3b3; }
  .shr-sm.danger:hover { background: #3a2024; border-color: #5a2c33; }
  .shr-sm:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }
  .shr-exp { flex: 1; min-width: 0; font-size: 12px; color: #aab4c5; }
  select.shr-sel {
    background: #1f2733; color: #d4d8de; border: 1px solid #2a3040;
    border-radius: 6px; padding: 5px 8px; font: 12px system-ui, sans-serif; cursor: pointer;
  }
  .shr-list { max-height: 240px; overflow-y: auto; margin: 0 0 12px; }
  .shr-list .empty { font-size: 13px; color: #6b7488; padding: 6px 0; }
  .shr-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #20262f; }
  .shr-item:last-child { border-bottom: 0; }
  .shr-item .nm2 { flex: 1; min-width: 0; font-size: 13px; color: #d4d8de; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shr-item .dim { display: block; font-size: 11px; color: #6b7488; margin-top: 1px; }
  .shr-tag { font-size: 10px; color: #8a93a6; border: 1px solid #2a3040; padding: 1px 5px; border-radius: 4px; margin-left: 5px; vertical-align: 1px; }

  /* toast (bottom-center, like the Files paste toast) */
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 30;
    max-width: min(92vw, 480px); padding: 10px 16px; border-radius: 11px;
    background: #12161d; color: #e6edf3; border: 1px solid #2a3444;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); font: 500 13px system-ui, sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.err { border-color: #5a2c33; color: #f1b3b3; white-space: normal; }

  /* ---- text preview overlay ---- */
  .pv { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: #0e1117; }
  .pv.open { display: flex; }
  .pv-head {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0; min-height: 40px;
    padding: 4px 10px; background: #161b22; border-bottom: 1px solid #2a3040;
  }
  .pv-name { flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv-info { flex-shrink: 0; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #6b7488; }
  .pv-head button {
    flex-shrink: 0; background: #1f2733; color: #d4d8de; border: 1px solid #2a3040;
    border-radius: 6px; padding: 5px 10px; font: 12px system-ui, sans-serif;
    cursor: pointer; min-height: 30px;
  }
  .pv-head button:hover { background: #253044; }
  .pv-head button:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }
  .pv-note { display: none; flex-shrink: 0; padding: 5px 14px; font-size: 12px; color: #aab4c5; background: #12161d; border-bottom: 1px solid #20262f; }
  .pv-note.on { display: block; }
  .pv-body {
    flex: 1; min-height: 0; overflow: auto; padding: 14px 18px;
    font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;

  }
  .pv-body.msg { display: flex; align-items: center; justify-content: center; color: #6b7488; font-family: system-ui, sans-serif; font-size: 13px; white-space: normal; }

  /* ---- editor overlay (editable text ≤1MB; header/✕ reuse .pv-head) ---- */
  .ed { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: #0e1117; }
  .ed.open { display: flex; }
  #ed-dirty { display: none; color: #8a4adb; margin-right: 6px; }
  .ed.dirty #ed-dirty { display: inline; }
  #ed-save { background: #8a4adb; border-color: #8a4adb; color: #fff; }
  #ed-save:hover:not(:disabled) { background: #9a5ceb; }
  #ed-save:disabled { background: #1f2733; border-color: #2a3040; color: #6b7488; cursor: default; }
  .ed textarea {
    flex: 1; min-height: 0; resize: none; border: 0; outline: none;
    background: #0e1117; color: #d4d8de; padding: 14px 18px;
    font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre; tab-size: 4; overflow: auto;
  }
  .ed-foot {
    display: flex; align-items: center; gap: 14px; flex-shrink: 0;
    padding: 4px 14px; min-height: 26px; background: #161b22;
    border-top: 1px solid #2a3040;
    font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: #6b7488;
  }

  /* ---- PDF overlay (native browser PDF viewer in an iframe) ---- */
  .pdfov { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: #0e1117; }
  .pdfov.open { display: flex; }
  .pdf-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .pdf-body iframe { flex: 1; min-height: 0; width: 100%; border: 0; background: #161b22; }
  .pdf-fb {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; color: #6b7488; font-size: 13px;
  }
  .pdf-fb button {
    background: #1f2733; color: #d4d8de; border: 1px solid #2a3040; border-radius: 6px;
    padding: 7px 14px; font: 13px system-ui, sans-serif; cursor: pointer; min-height: 34px;
  }
  .pdf-fb button:hover { background: #253044; }

  /* Touch devices: neutralize sticky :hover — iOS keeps :hover applied after a
     tap, which left the last-tapped toolbar button (the ⟳ report) a different
     shade, looking stuck-pressed. Everything returns to its rest style. */
  @media (hover: none) {
    .tools button:hover, .tools select:hover, .sbar .sx:hover, .actbar button:hover,
    .state button:hover, .pv-head button:hover, .shr-sm:hover { background: #1f2733; }
    .tools button[aria-pressed="true"]:hover { background: #241a38; }
    .crumb:hover { background: transparent; color: #aab4c5; }
    .crumb.cur:hover { color: #e6edf3; }
    .row:hover { background: transparent; }
    .row.sel:hover { background: #1f2937; }
    .seg button:hover { background: transparent; }
    .seg button.on:hover { background: #241a38; }
    .shr-sm.danger:hover, .actbar .danger:hover { background: #1f2733; border-color: #2a3040; }
    .mbtns .mok:hover { filter: none; }
    .mbtns .mcancel:hover { background: transparent; color: #9fb0c0; }
    #ed-save:hover:not(:disabled) { background: #8a4adb; }
    .pdf-fb button:hover { background: #1f2733; }
  }

  /* ---- mobile ≤736px: one compact icon toolbar row → breadcrumb (tap the
     current crumb to edit the path — the address input is collapsed) ---- */
  @media (max-width: 736px) {
    .toolbar { gap: 5px 6px; padding: 6px 8px; }
    .tools { order: 1; flex: 1 0 100%; display: flex; flex-wrap: nowrap; gap: 5px; }
    .tools button, .tools select { min-height: 38px; font-size: 13px; }
    #newbtn, #upbtn, #hidden, #searchbtn, #refresh, #morebtn, #layoutbtn, #selectbtn {
      flex: 0 0 38px; width: 38px; padding: 0; font-size: 16px;
    }
    #layoutbtn .bl { display: none; }
    .tools .bl { display: none; }                 /* icons only, titles kept */
    .tools .bi { display: inline-flex; }
    #hidden .bi { display: inline-flex; }
    .tools svg { width: 17px; height: 17px; }
    #sortkey, #sortdir, #manage { display: none; }
    /* right padding keeps the label clear of the drawn caret */
    select#sortsel2 { display: block; flex: 1 1 auto; min-width: 0; max-width: 140px; padding: 0 24px 0 8px; }
    #selectbtn { display: inline-block; }
    #morebtn { display: inline-block; margin-left: auto; }   /* pinned to the edge */
    #pastebtn { color: #b79be8; }
    #pastebtn.on { display: block; flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 9px; }
    .crumbs { order: 2; flex: 1 0 100%; min-width: 0; }
    .crumb { font-size: 14px; padding: 6px 6px; }
    .addr { order: 3; display: none; }            /* path lives in the crumbs; */
    .addr.editing { display: flex; flex: 1 0 100%; }   /* tap the last crumb to edit */
    .addr input { padding: 8px 10px; font-size: 14px; }
    /* Every verb visible, wrapped over two rows — no ⋯ to expand and no ✕ to
       dismiss (tapping anywhere else in the listing clears the selection).
       Text-only labels: the emoji glyphs were the widest part of each button
       AND the toy-looking part, and dropping them is what makes two rows fit. */
    /* Span both edges instead of shrink-to-fitting from left:50% — a fixed box
       anchored at 50% may only use the RIGHT HALF of the viewport, which is
       what folded these ten verbs into a four-row wall. */
    .actbar {
      left: 6px; right: 6px; transform: none; max-width: none;
      padding: 6px 8px; bottom: 12px;
      flex-wrap: wrap; justify-content: center; row-gap: 6px; overflow-x: visible;
    }
    .actbar button { min-height: 40px; font-size: 13px; padding: 5px 9px; }
    .actbar button:disabled { display: none; }
    .actbar .dv { display: none; }
    .actbar.on ~ .main { padding-bottom: 132px; }
    /* two-line rows: the full name on top (up to 2 lines — never mid-truncated
       while the right side sits empty), a muted "date · size" subtitle under
       it; the desktop size/date columns disappear (they were what squeezed
       the name — reported with screenshots vs the classic app) */
    .row { min-height: 48px; padding: 4px 10px; gap: 10px; }
    .row .ic { flex: 0 0 32px; font-size: 21px; }
    .row .ic img.th { width: 32px; height: 32px; border-radius: 6px; }
    .row .mid { flex-direction: column; align-items: stretch; gap: 1px; }
    .row .nm {
      font-size: 14px; white-space: normal; overflow-wrap: anywhere;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .row .meta { display: block; font-size: 11.5px; color: #6b7488; }
    .row .sz, .row .mt { display: none; }
    .pv-head button { min-height: 38px; }
    /* search bar stacks: query row, then mode + scope + close */
    .sbar { flex-wrap: wrap; gap: 7px; }
    .sbar input { flex: 1 0 100%; padding: 9px 10px; font-size: 14px; }
    .seg button { min-height: 38px; padding: 5px 12px; font-size: 13px; }
    .scope { flex: 1 1 auto; }
    .sbar .sx { min-height: 40px; min-width: 44px; }
    .row.sres .snip { margin-left: 0; }
    .shr-sm { min-height: 40px; }
    select.shr-sel { min-height: 40px; }
    .shr-row { flex-wrap: wrap; }
  }
</style>

<script>
(function() {
  // Native Files view (Files-native phases 1-4a — docs/files-native.md).
  // Loaded by files.html's tab wrapper with #/abs/path; listing/stat/read and
  // all mutations go through the per-user file agent via the manager
  // (/api/fs/*). Feature-complete vs classic FileBrowser: listing, mutations,
  // clipboard, uploads (files + folders + OS drag-and-drop), new file/folder,
  // editor, search, share, info (kind/perms/dimensions/checksums), open-in-
  // browser + office-edit handoffs. FileBrowser remains reachable via Manage.
  var IMG_RE = /\.(png|jpe?g|gif|webp|bmp|svg|avif|ico)$/i;
  var VID_RE = /\.(mp4|m4v|mov|mkv|webm|avi|wmv|flv|ogv|mpg|mpeg|ts|m2ts|3gp)$/i;
  var OFF_RE = /\.(docx?|xlsx?|pptx?|odt|ods|odp)$/i;
  var AUD_RE = /\.(mp3|wav|flac|ogg|m4a|aac|opus|wma)$/i;
  var ARC_RE = /\.(zip|tar|gz|tgz|xz|bz2|7z|rar|zst)$/i;
  var READ_MAX = 1048576;   // 1MB text-preview cap (server-enforced too)

  var crumbsEl = document.getElementById('crumbs');
  var addrEl = document.getElementById('addr');
  var sortKeyEl = document.getElementById('sortkey');
  var sortDirEl = document.getElementById('sortdir');
  var selectBtn = document.getElementById('selectbtn');
  var hiddenEl = document.getElementById('hidden');
  var noticeEl = document.getElementById('notice');
  var mainEl = document.getElementById('main');
  var pvEl = document.getElementById('pv');
  var actbarEl = document.getElementById('actbar');
  var pasteBtn = document.getElementById('pastebtn');
  var fileInput = document.getElementById('fileinput');

  var HOME = '';                 // resolved from /api/fs/home before first render
  var path = null;               // current folder (abs)
  var entries = [];              // raw entries from the server
  var rows = [];                 // visible (filtered+sorted) entries, index-aligned with DOM rows
  var lastGood = null;           // last folder that rendered ok (error-state ← Back fallback)
  var seq = 0;                   // stale-response guard

  // selection: names within the CURRENT folder (indices shift on re-render)
  var selected = {};             // name -> true
  var selCount = 0;
  var anchor = -1;               // keyboard/shift anchor (index into rows)
  var selectMode = false;        // touch multi-select mode (long-press)
  var pendingFocusName = null;   // select+reveal this name after the next render
  var modalOpen = false;

  // persisted view prefs (per device)
  var showHidden = false, sortKey = 'name', sortAsc = true;
  try {
    showHidden = localStorage.getItem('fsx.hidden') === '1';
    var s = (localStorage.getItem('fsx.sort') || '').split(':');
    if (s[0] === 'name' || s[0] === 'size' || s[0] === 'mtime') { sortKey = s[0]; sortAsc = s[1] !== 'desc'; }
  } catch (e) {}

  function savePrefs() {
    try {
      localStorage.setItem('fsx.hidden', showHidden ? '1' : '0');
      localStorage.setItem('fsx.sort', sortKey + ':' + (sortAsc ? 'asc' : 'desc'));
    } catch (e) {}
  }
  function syncControls() {
    sortKeyEl.value = sortKey;
    sortDirEl.textContent = sortAsc ? '↑' : '↓';
    sortDirEl.title = sortAsc ? 'Ascending — click for descending' : 'Descending — click for ascending';
    document.getElementById('sortsel2').value = sortKey + ':' + (sortAsc ? 'asc' : 'desc');
    hiddenEl.setAttribute('aria-pressed', showHidden ? 'true' : 'false');
    hiddenEl.title = showHidden ? 'Hide hidden files' : 'Show hidden files';
  }

  // ---- path helpers ----
  function enc(p) { return p.split('/').map(encodeURIComponent).join('/'); }
  function dec(s) {
    return s.split('/').map(function(x) { try { return decodeURIComponent(x); } catch (e) { return x; } }).join('/');
  }
  function baseOf(p) { return p === '/' ? '/' : (p.split('/').pop() || '/'); }
  function joinPath(dir, name) { return (dir === '/' ? '' : dir) + '/' + name; }
  // Light client-side normalize: ~ → home, relative → against the current
  // folder, collapse //, resolve . and .. — so the address bar takes anything.
  function normPath(input) {
    var p = (input || '').trim();
    if (!p) return null;
    if (p === '~') p = HOME || '/';
    else if (p.slice(0, 2) === '~/') p = (HOME || '') + p.slice(1);
    if (p.charAt(0) !== '/') p = (path === '/' || !path ? '' : path) + '/' + p;
    var out = [];
    p.split('/').forEach(function(seg) {
      if (!seg || seg === '.') return;
      if (seg === '..') { out.pop(); return; }
      out.push(seg);
    });
    return '/' + out.join('/');
  }

  // ---- formatting ----
  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    var u = ['KB', 'MB', 'GB', 'TB'], i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return (n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i];
  }
  function fmtRel(ts, short) {
    // short (mobile): "2d" not "2d ago", compact old dates — the name column
    // gets the room.
    var s = Date.now() / 1000 - ts;
    if (s < 45) return short ? 'now' : 'just now';
    if (s < 3600) return Math.round(s / 60) + 'm' + (short ? '' : ' ago');
    if (s < 86400) return Math.round(s / 3600) + 'h' + (short ? '' : ' ago');
    if (s < 86400 * 7) return Math.round(s / 86400) + 'd' + (short ? '' : ' ago');
    var d = new Date(ts * 1000), now = new Date();
    if (d.getFullYear() === now.getFullYear())
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    return short ? d.toLocaleDateString(undefined, { year: '2-digit', month: 'numeric', day: 'numeric' })
                 : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }
  // Listing icon: images get a REAL thumbnail (lazy server-side downscale via
  // /api/file/image&thumb= — the emoji placeholder looked like a toy next to
  // the classic app's previews), everything else the type emoji.
  function icEl(e) {
    var ic = el('span', 'ic', '');
    if (!e.isDir && IMG_RE.test(e.name)) {
      var im = document.createElement('img');
      im.className = 'th'; im.alt = ''; im.loading = 'lazy'; im.decoding = 'async';
      im.src = '/api/file/image?path=' + encodeURIComponent(joinPath(path, e.name)) +
               '&thumb=' + (view === 'list' ? 96 : 320);
      im.onerror = function() { ic.textContent = iconFor(e.name, false); };
      ic.appendChild(im);
    } else {
      ic.textContent = iconFor(e.name, e.isDir);
    }
    return ic;
  }
  function iconFor(name, isDir) {
    if (isDir) return '📁';
    if (IMG_RE.test(name)) return '🖼️';
    if (VID_RE.test(name)) return '🎬';
    if (AUD_RE.test(name)) return '🎵';
    if (ARC_RE.test(name)) return '📦';
    if (/\.pdf$/i.test(name)) return '📕';
    if (/\.(docx?|odt)$/i.test(name)) return '📘';
    if (/\.(xlsx?|ods|csv)$/i.test(name)) return '📗';
    if (/\.(pptx?|odp)$/i.test(name)) return '📙';
    return '📄';
  }

  // ---- fetch + render ----
  function api(url) {
    return fetch(url).then(function(r) { return r.json(); });
  }

  // ---- mutation plumbing ----

  // iOS-standalone-safe download. In an installed PWA, an <a download> (or a
  // bare attachment navigation) replaces the WHOLE app view with iOS's white

      try { window.open(url); } catch (_) {}
    });
  }

  // -- download: single file direct; folders / multi-selections as a zip --

      : '/api/fs/zip?' + selPaths().map(function(p) { return 'path=' + encodeURIComponent(p); }).join('&');

  // -- inline editors: new folder + rename --

  function newFolder() {

  function newFile() {

    if (existing) { existing.focus(); return; }
    if (mainEl.querySelector('.state')) mainEl.innerHTML = '';   // empty-folder message
    var r = el('div', 'row');
    r.appendChild(el('span', 'ck', ''));
    r.appendChild(el('span', 'ic', '📄'));
    var input = el('input', 'edit');
    input.type = 'text'; input.value = 'New file.txt';

    r.appendChild(input);
    mainEl.insertBefore(r, mainEl.firstChild);

      var abs = joinPath(path, name);
      api('/api/fs/stat?path=' + encodeURIComponent(abs)).then(function(sd) {

  function startRename() {
    if (selCount !== 1) return;

    var r = mainEl.querySelector('.row[data-i="' + i + '"]');
    if (i < 0 || !r || r.querySelector('input.edit')) return;
    var nm = r.querySelector('.nm');
    nm.style.display = 'none';

  // -- upload (sequential XHR with real progress; names never overwrite:
  //    collisions get the backend's own ' (2)' suffix, chosen client-side) --
  var uprogEl = document.getElementById('uprog');
  var uprogTxt = document.getElementById('uprog-txt');
  var uprogFill = document.getElementById('uprog-fill');
  var uploading = false;
  function freeName(dir, name) {
    // stat-probe name, then "base (2).ext", "base (3).ext"…
    function probe(cand, n) {
      return api('/api/fs/stat?path=' + encodeURIComponent(joinPath(dir, cand))).then(function(d) {
        if (!d || !d.ok) return cand;               // enoent → free
        if (n > 99) return cand;                    // give up, let the server decide
        var dot = name.lastIndexOf('.');
        var next = dot > 0 ? name.slice(0, dot) + ' (' + n + ')' + name.slice(dot)
                           : name + ' (' + n + ')';
        return probe(next, n + 1);
      }).catch(function() { return cand; });
    }
    return probe(name, 2);

  function uploadOne(dir, file, reldir, onProgress) {
    // reldir ('' for plain files) preserves a dropped/picked FOLDER's structure:
    // the file lands in dir/reldir/ and mkdirs=1 creates the chain server-side.
    var tdir = reldir ? joinPath(dir, reldir) : dir;
    return freeName(tdir, file.name).then(function(name) {
      return new Promise(function(resolve) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/fs/upload?path=' + encodeURIComponent(joinPath(tdir, name)) +
                         (reldir ? '&mkdirs=1' : ''));
        xhr.upload.onprogress = function(e) {
          if (e.lengthComputable) onProgress(e.loaded / e.total);
        };
        xhr.onload = function() {
          var d = null;
          try { d = JSON.parse(xhr.responseText); } catch (e) {}

    document.getElementById('upbtn').disabled = true;
    var dir = path, done = 0, fails = [];
    uprogEl.classList.add('on');
    function step() {
      if (done >= items.length) {
        uploading = false;
        document.getElementById('upbtn').disabled = false;
        uprogEl.classList.remove('on');
        if (fails.length) toast(fails.length + ' of ' + items.length + ' failed — ' + fails[0].error, true);
        else toast('Uploaded ' + items.length + ' file' + (items.length === 1 ? '' : 's'));
        if (path === dir) refresh();
        return;
      }
      var it = items[done];
      uprogTxt.textContent = 'Uploading ' + (done + 1) + '/' + items.length + ' — ' +
                             (it.reldir ? it.reldir + '/' : '') + it.file.name;
      uprogFill.style.width = '0%';
      uploadOne(dir, it.file, it.reldir, function(frac) {

  }

  // ---- OS drag-and-drop upload: files AND folders from the computer ----

  var dropzEl = document.getElementById('dropz');

  }

  function collectDropped(dt) {

      return new Promise(function(resolve) {
        if (out.length >= DROP_MAX) { over = true; resolve(); return; }

  // ---- keyboard ----
  document.addEventListener('keydown', function(ev) {
    if (modalOpen) return;                          // the choice card handles keys
    var mod = ev.ctrlKey || ev.metaKey;

      if (ev.key === 'Escape') { ev.preventDefault(); closePreview(); }
      return;
    }
    if (pdfovEl.classList.contains('open')) {
      if (ev.key === 'Escape') { ev.preventDefault(); closePdf(); }
      return;
    }
    if (edEl.classList.contains('open')) {
      if (mod && (ev.key === 's' || ev.key === 'S')) { ev.preventDefault(); edSave(false); }
      else if (ev.key === 'Escape') { ev.preventDefault(); requestCloseEditor(); }
      return;
    }
    if (mod && (ev.key === 'f' || ev.key === 'F')) { ev.preventDefault(); openSearch(); return; }
    var t = ev.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    if (mod && (ev.key === 'c' || ev.key === 'C') && selCount) { ev.preventDefault(); doCopyCut('copy'); return; }
    if (mod && (ev.key === 'x' || ev.key === 'X') && selCount) { ev.preventDefault(); doCopyCut('cut'); return; }
    if (mod && (ev.key === 'v' || ev.key === 'V') && getClip()) { ev.preventDefault(); doPaste(); return; }
    if (mod && (ev.key === 'a' || ev.key === 'A') && rows.length) {

  });

  // ---- Share: passwordless public links via the manager (/api/share) ----
  // The API takes HOME-RELATIVE paths; anything else is refused server-side
  // ("must be a file or folder under home, and not a dotfile") and surfaced
  // verbatim. Folders are served as a zip by the share endpoint itself.
  function rawCard(title) {
    modalOpen = true;
    var ov = el('div', 'mov');
    var card = el('div', 'mcard');
    card.setAttribute('role', 'dialog');
    card.appendChild(el('h3', null, title));
    var closed = false;
    function close() {
      if (closed) return;
      closed = true; modalOpen = false;
      document.removeEventListener('keydown', onKey, true);
      ov.remove();
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
    }
    document.addEventListener('keydown', onKey, true);
    ov.addEventListener('click', function(e) { if (e.target === ov) close(); });
    ov.appendChild(card);
    document.body.appendChild(ov);
    return { card: card, close: close };
  }
  function shareApi(url, body) {
    return fetch(url, body ? {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    } : undefined).then(function(r) { return r.json(); });
  }
  function copyText(text, btn) {
    function done() {
      var t = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(function() { btn.textContent = t; }, 1200);
    }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); ta.remove();
        done();
      } catch (e) {}
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else fallback();
  }
  function expiryText(ts) {
    var s = ts - Date.now() / 1000;
    if (s <= 0) return 'Expired';
    var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), mn = Math.floor((s % 3600) / 60);
    return 'Expires in ' + (d ? d + 'd ' + h + 'h' : (h ? h + 'h ' + mn + 'm' : mn + 'm'));
  }
  var TTL_OPTS = [['0.0416667', '1 hour'], ['1', '1 day'], ['7', '7 days'], ['30', '30 days']];

  function shareStart() {
    if (selCount !== 1) return;
    var name = selNames()[0];
    var abs = joinPath(path, name);
    var rel = (HOME && abs.indexOf(HOME + '/') === 0) ? abs.slice(HOME.length + 1) : abs;
    var m = rawCard('Public link');
    var busy = el('p', null, 'Creating link…');
    m.card.appendChild(busy);
    shareApi('/api/share', { path: rel, ttl: 7 }).then(function(d) {
      busy.remove();
      if (!d || !d.url) { renderShareRefusal(m, (d && d.error) || 'Could not create the link.'); return; }
      renderShareLink(m, d, rel);
    }).catch(function() {
      busy.remove();
      renderShareRefusal(m, 'Could not create the link — network error.');
    });
  }
  function renderShareRefusal(m, msg) {
    m.card.appendChild(el('p', null, msg));
    var btns = el('div', 'mbtns');

    ok.addEventListener('click', m.close);
    btns.appendChild(ok);
    m.card.appendChild(btns);

  }
  function renderShareLink(m, d, rel) {
    var token = d.token;
    m.card.appendChild(el('p', null,
      'Anyone with this link can ' +
      (d.kind === 'dir' ? 'download “' + d.name + '” as a zip.' : 'view or download “' + d.name + '”.') +
      ' No login needed — treat it like a password.'));

    var input = el('input', 'shr-url');

    urlRow.appendChild(input); urlRow.appendChild(copy);
    m.card.appendChild(urlRow);
    var expRow = el('div', 'shr-row');

    TTL_OPTS.forEach(function(o) {
      var op = el('option', null, o[1]);

      sel.appendChild(op);
    });
    sel.addEventListener('change', function() {
      // Re-mint with the new lifetime (the old link is revoked).
      shareApi('/api/share/revoke', { token: token }).catch(function() {});
      shareApi('/api/share', { path: rel, ttl: parseFloat(sel.value) }).then(function(r) {
        if (r && r.url) { token = r.token; input.value = r.url; expLbl.textContent = expiryText(r.expires); }
        else expLbl.textContent = (r && r.error) || 'Could not update the link.';
      }).catch(function() {});
    });
    expRow.appendChild(expLbl); expRow.appendChild(sel);
    m.card.appendChild(expRow);
    var btns = el('div', 'mbtns');
    var manage = el('button', 'mcancel', 'Manage links');
    manage.addEventListener('click', function() { m.close(); manageShares(); });
    var revoke = el('button', 'mok danger', 'Revoke');
    revoke.addEventListener('click', function() {
      shareApi('/api/share/revoke', { token: token }).catch(function() {});

    });
    var done = el('button', 'mok', 'Done');

  function manageShares() {

        nm.appendChild(el('span', 'dim', expiryText(s.expires) + ' · ' + s.hits + ' hit' + (s.hits === 1 ? '' : 's')));
        nm.title = s.rel || s.name;

            row.remove();

  function kindOf(name, isDir) {

      });

          (nd ? ' — ' + nd + ' folder' + (nd === 1 ? '' : 's') + ', ' + nf + ' file' + (nf === 1 ? '' : 's') : ''));

      if (!e.isDir) {                               // lazy checksums: Show → hex → click copies
        [['MD5', 'md5'], ['SHA1', 'sha1'], ['SHA256', 'sha256'], ['SHA512', 'sha512']].forEach(function(a) {
          var v = row(a[0], '');

  // ---- editor overlay ----
  var edEl = document.getElementById('ed');
  var edTa = document.getElementById('ed-ta');
  var edNameEl = document.getElementById('ed-name');
  var edTitleEl = document.getElementById('ed-title');
  var edSizeEl = document.getElementById('ed-size');
  var edPosEl = document.getElementById('ed-pos');
  var edSaveBtn = document.getElementById('ed-save');
  var edPath = null, edMtime = null, edSavedText = '', edSaving = false, edReturnFocus = null;

  function edOpen() { return edEl.classList.contains('open'); }
  function edDirty() { return edOpen() && edTa.value !== edSavedText; }
  function edSyncState() {
    var dirty = edTa.value !== edSavedText;
    edEl.classList.toggle('dirty', dirty);
    edSaveBtn.disabled = !dirty || edSaving;
    edSizeEl.textContent = fmtSize(new Blob([edTa.value]).size);
  }
  function edUpdatePos() {
    var s = edTa.selectionStart || 0;
    var before = edTa.value.slice(0, s);

  }
  function openEditor(absPath, name, text, mtime, gotoLine) {
    edReturnFocus = document.activeElement;
    edPath = absPath; edMtime = mtime;
    edNameEl.textContent = name;
    edTitleEl.title = absPath;
    edSavedText = text;
    edTa.value = text;
    edEl.classList.add('open');
    edSyncState();
    edTa.focus();
    if (gotoLine && gotoLine > 1) {
      var idx = 0, l = 1;
      while (l < gotoLine) { var j = text.indexOf('\n', idx); if (j === -1) break; idx = j + 1; l++; }
      try { edTa.setSelectionRange(idx, idx); } catch (e) {}

    try { edTa.blur(); } catch (e) {}

    for (;;) {
      var j = lower.indexOf(lq, i);
      if (j === -1) { parent.appendChild(document.createTextNode(text.slice(i))); return; }
      if (j > i) parent.appendChild(document.createTextNode(text.slice(i, j)));
      parent.appendChild(el('mark', null, text.slice(j, j + q.length)));
      i = j + q.length;
    }
  }
  function runSearch() {
    var q = sqEl.value.trim();
    if (!q || !path) return;
    var my = ++searchSeq;
    searchActive = true;
    if (selectMode) exitSelectMode(); else clearSel(true);
    rows = [];                                               // list keyboard/selection off
    mainEl.innerHTML = '';
    mainEl.appendChild(stateEl([el('div', null, 'Searching…')]));
    setNotice('');
    api('/api/fs/search?path=' + encodeURIComponent(path) + '&q=' + encodeURIComponent(q) + '&mode=' + searchMode)
      .then(function(d) {
        if (my !== searchSeq || !searchActive) return;
        if (!d || !d.ok) {
          mainEl.innerHTML = '';
          mainEl.appendChild(stateEl([el('div', 'big', 'Search failed'), el('div', 'pth', (d && d.error) || 'error')]));
          return;
        }
        renderResults(d, q);
      })
      .catch(function() {
        if (my !== searchSeq || !searchActive) return;
        mainEl.innerHTML = '';
        mainEl.appendChild(stateEl([el('div', 'big', 'Search failed'), el('div', 'pth', 'network error')]));
      });
  }
  function renderResults(d, q) {
    rows = [];
    mainEl.innerHTML = '';
    applyView('list');            // results carry a parent path / snippet: always flat
    var res = d.results || [];
    if (!res.length) {
      mainEl.appendChild(stateEl([el('div', 'big', 'No matches')]));
      return;
    }
    var frag = document.createDocumentFragment();
    res.forEach(function(it) {
      var name = baseOf(it.path);
      var r = el('div', 'row' + (it.isDir ? ' dir' : '') + (d.mode === 'content' ? ' sres' : ''));
      r.appendChild(el('span', 'ic', iconFor(name, !!it.isDir)));
      var nm = el('span', 'nm');
      markify(nm, name, d.mode === 'names' ? q : '');
      nm.title = it.path;
      r.appendChild(nm);
      var pp = relParent(it.path);
      if (pp) { var ppe = el('span', 'pp', pp); ppe.title = it.path; r.appendChild(ppe); }
      if (d.mode === 'content') {
        r.appendChild(el('span', 'ln', ':' + it.line));
        var sn = el('div', 'snip');
        markify(sn, it.text || '', q);
        sn.title = it.text || '';
        r.appendChild(sn);
        r.addEventListener('click', function() { openFile(it.path, name, it.line); });
      } else {
        r.addEventListener('click', function() { openNameResult(it); });
      }
      frag.appendChild(r);
    });
    mainEl.appendChild(frag);
    mainEl.scrollTop = 0;
    if (d.truncated) setNotice('Showing the first ' + res.length + ' matches.');
  }
  // Names result: jump to its folder with the item selected; files also open.
  function openNameResult(it) {
    var dir = it.path.slice(0, it.path.lastIndexOf('/')) || '/';
    var name = baseOf(it.path);
    searchActive = false; searchSeq++;
    searchOpen = false;
    sbarEl.classList.remove('on');
    searchBtn.setAttribute('aria-pressed', 'false');
    pendingFocusName = name;
    if (dir === path) load(path, true); else go(dir);
    if (!it.isDir) setTimeout(function() { openFile(it.path, name); }, 200);
  }
  searchBtn.addEventListener('click', function() { if (searchOpen) closeSearch(); else openSearch(); });
  document.getElementById('s-close').addEventListener('click', closeSearch);
  document.getElementById('sm-names').addEventListener('click', function() { setSearchMode('names'); });
  document.getElementById('sm-content').addEventListener('click', function() { setSearchMode('content'); });
  sqEl.addEventListener('keydown', function(ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); runSearch(); }
    else if (ev.key === 'Escape') { ev.preventDefault(); closeSearch(); }
  });

  // ---- toolbar wiring ----
  addrEl.addEventListener('keydown', function(ev) {
    if (ev.key === 'Escape') { addrEl.value = path || ''; addrEl.blur(); return; }
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    var p = normPath(addrEl.value);
    if (!p) return;
    addrEl.blur();
    // Typing a FILE path is a natural ask — stat first and open it in place
    // (folder unchanged) instead of showing "Not a folder".
    api('/api/fs/stat?path=' + encodeURIComponent(p)).then(function(d) {
      if (d && d.ok && d.stat && !d.stat.isDir) {
        addrEl.value = path || '';
        openEntry({ name: baseOf(p), isDir: false }, p);
      } else {
        go(p);
      }
    }).catch(function() { go(p); });
  });
  addrEl.addEventListener('blur', function() {
    // Abandoned edits revert quietly so the bar always shows the real location;
    // on mobile the temporary edit row (opened from the current crumb) collapses.
    if (addrEl.value !== path) addrEl.value = path || '';
    addrWrapEl.classList.remove('editing');
  });

  sortKeyEl.addEventListener('change', function() {
    sortKey = sortKeyEl.value; savePrefs(); syncControls(); renderList();
  });
  sortDirEl.addEventListener('click', function() {
    sortAsc = !sortAsc; savePrefs(); syncControls(); renderList();
  });
  // Mobile's single sort control: key + direction folded into one select.
  document.getElementById('sortsel2').addEventListener('change', function() {
    var v = this.value.split(':');
    sortKey = v[0]; sortAsc = v[1] !== 'desc';
    savePrefs(); syncControls(); renderList();
  });
  hiddenEl.addEventListener('click', function() {
    showHidden = !showHidden; savePrefs(); syncControls(); renderList();
  });
  document.getElementById('layoutbtn').addEventListener('click', function(ev) {
    ev.stopPropagation();
    openPop(ev.currentTarget, VIEWS.map(function(v) {
      return {
        label: (v.id === view ? '✓ ' : ' ') + v.label,
        title: v.label + ' view',
        run: function() { setView(v.id); }
      };
    }));
  });
  // A VISIBLE way into multi-select (the classic app's Select button):
  // long-press works but nothing advertises it. Its pressed state is synced
  // in renderActions, so Escape / navigation / the pill's ✕ un-press it too.
  selectBtn.addEventListener('click', function() {
    if (selectMode) exitSelectMode();
    else enterSelectMode(-1);
  });
  document.getElementById('refresh').addEventListener('click', refresh);
  function openManage() {
    // Escape hatch to FileBrowser (the classic view) — swap THIS iframe to it
    // at the current folder.
    if (!path) return;
    location.href = '/files/files' + (path === '/' ? '' : enc(path)) + '/';
  }
  document.getElementById('manage').addEventListener('click', openManage);

  // Small anchored popovers: the New / Upload submenus and the mobile ⋯
  // overflow all share one instance (opening one closes another).
  var morePop = null, popAnchor = null;
  function closeMore() { if (morePop) { morePop.remove(); morePop = null; popAnchor = null; } }
  function openPop(btn, items, alignRight) {
    if (popAnchor === btn) { closeMore(); return; }   // second click toggles shut
    closeMore();
    morePop = el('div', 'morepop');
    items.forEach(function(it) {
      var b = el('button', null, it.label);
      if (it.title) b.title = it.title;
      b.addEventListener('click', function() { closeMore(); it.run(); });
      morePop.appendChild(b);
    });
    document.body.appendChild(morePop);
    popAnchor = btn;
    var r = btn.getBoundingClientRect();
    // Below the button, or above it when there is no room (the action pill
    // sits at the bottom of the screen — its ⋯ menu must open upward).
    var h = morePop.offsetHeight;
    morePop.style.top = (r.bottom + 4 + h > window.innerHeight ? Math.max(6, r.top - h - 4) : r.bottom + 4) + 'px';
    if (alignRight) morePop.style.right = Math.max(6, window.innerWidth - r.right) + 'px';
    else morePop.style.left = Math.max(6, Math.min(r.left, window.innerWidth - morePop.offsetWidth - 6)) + 'px';
  }
  // ---- right-click context menu (desktop) ----
  // Same verbs as the touch pill, driven by the same functions — this is the
  // desktop surface for them, so the pill hides when a real mouse is present.
  function ctxItems() {
    var any = selCount > 0, one = selCount === 1, e1 = selEntry(), clip = getClip();
    var items = [];
    if (any) {
      if (one) items.push({ label: e1 && e1.isDir ? 'Open' : 'Open', run: function() { if (e1) openEntry(e1); } });
      if (e1 && !e1.isDir) items.push({ label: 'Open in Browser', run: openInBrowserAct });
      if (e1 && OFF_RE.test(e1.name)) items.push({ label: 'Edit in Office', run: officeEditAct });
      items.push({ sep: true });
      items.push({ label: 'Get Info', run: showInfo });
      if (one) items.push({ label: 'Share…', run: shareStart });
      items.push({ label: 'Download', run: doDownload });
      items.push({ sep: true });
      if (one) items.push({ label: 'Rename', run: startRename });
      items.push({ label: 'Copy', run: function() { doCopyCut('copy'); } });
      items.push({ label: 'Cut', run: function() { doCopyCut('cut'); } });
      if (clip) items.push({ label: 'Paste (' + clip.paths.length + ')', run: doPaste });
      items.push({ sep: true });
      items.push({ label: 'Delete', danger: true, run: doDelete });
    } else {
      // Empty area: the folder's own verbs, like Explorer's background menu.
      items.push({ label: 'New Folder', run: newFolder });
      items.push({ label: 'New File', run: newFile });
      items.push({ sep: true });
      items.push({ label: 'Upload Files…', run: function() { fileInput.click(); } });
      items.push({ label: 'Upload Folder…', run: function() { dirInput.click(); } });
      if (clip) items.push({ label: 'Paste (' + clip.paths.length + ')', run: doPaste });
      items.push({ sep: true });
      items.push({ label: 'Refresh', run: refresh });
    }
    return items;
  }
  function openCtxMenu(x, y) {
    closeMore();
    morePop = el('div', 'morepop ctx');
    ctxItems().forEach(function(it) {
      if (it.sep) { morePop.appendChild(el('div', 'sep')); return; }
      var b = el('button', it.danger ? 'danger' : null, it.label);
      b.addEventListener('click', function() { closeMore(); it.run(); });
      morePop.appendChild(b);
    });
    document.body.appendChild(morePop);
    popAnchor = null;
    // Flip/clamp so the menu is always fully on screen.
    var w = morePop.offsetWidth, h = morePop.offsetHeight;
    morePop.style.left = Math.max(6, Math.min(x, window.innerWidth - w - 6)) + 'px';
    morePop.style.top = Math.max(6, y + h + 6 > window.innerHeight ? y - h : y) + 'px';
  }
  // Any scroll or Escape dismisses it, like a native menu.
  mainEl.addEventListener('scroll', function() { if (morePop) closeMore(); }, { passive: true });
  document.addEventListener('contextmenu', function(ev) {
    if (morePop && !ev.target.closest('.morepop') && !ev.target.closest('.main')) closeMore();
  });

  // ⋯ overflow (mobile): the demoted low-frequency actions.
  document.getElementById('morebtn').addEventListener('click', function(ev) {
    ev.stopPropagation();
    openPop(ev.currentTarget, [
      { label: 'Manage (classic view)', title: document.getElementById('manage').title, run: openManage }
    ], true);
  });
  document.addEventListener('click', function(ev) {
    if (morePop && !ev.target.closest('.morepop') &&
        !(popAnchor && popAnchor.contains(ev.target))) closeMore();
  });

  // Viewport class change (rotation, window resize): re-render what differs
  // between the phone and desktop layouts (crumb tap-to-edit, short dates).
  function onMqChange() {
    syncControls();
    renderActions();          // the pill's mobile/desktop verb split changes
    if (path) renderCrumbs();
    if (path && !searchActive && lastGood === path) renderList();
  }
  try { MQ_MOBILE.addEventListener('change', onMqChange); }
  catch (e) { try { MQ_MOBILE.addListener(onMqChange); } catch (e2) {} }
  document.getElementById('newbtn').addEventListener('click', function(ev) {
    ev.stopPropagation();
    openPop(ev.currentTarget, [
      { label: '📁 Folder', title: 'Create a new folder here', run: newFolder },
      { label: '📄 File', title: 'Create an empty file and open it in the editor', run: newFile }
    ]);
  });
  document.getElementById('upbtn').addEventListener('click', function(ev) {
    ev.stopPropagation();
    openPop(ev.currentTarget, [
      { label: '📄 Files…', title: 'Pick files to upload here', run: function() { fileInput.click(); } },
      { label: '📁 Folder…', title: 'Pick a folder to upload here (structure preserved)', run: function() { dirInput.click(); } }
    ]);
  });
  pasteBtn.addEventListener('click', doPaste);
  document.getElementById('a-open').addEventListener('click', function() {
    var e = selEntry();
    if (e) openEntry(e);
  });
  document.getElementById('a-info').addEventListener('click', showInfo);
  document.getElementById('a-browser').addEventListener('click', openInBrowserAct);
  document.getElementById('a-office').addEventListener('click', officeEditAct);
  document.getElementById('a-rename').addEventListener('click', startRename);
  document.getElementById('a-download').addEventListener('click', doDownload);
  document.getElementById('a-copy').addEventListener('click', function() { doCopyCut('copy'); });
  document.getElementById('a-cut').addEventListener('click', function() { doCopyCut('cut'); });
  document.getElementById('a-delete').addEventListener('click', doDelete);
  // Another tab changed the shared clipboard → update the Paste button + cut dims.
  window.addEventListener('storage', function(ev) {
    if (ev.key === 'fsx.clip') syncSelDom();
  });

  // ---- init: resolve home, then honor #/abs/path (the wrapper's deep link) ----
  syncControls();
  renderActions();
  api('/api/fs/home').then(function(d) {
    HOME = (d && d.ok && d.home) || '';
  }).catch(function() {}).then(function() {
    var p = dec(location.hash.slice(1));
    if (!p || p.charAt(0) !== '/') {
      p = HOME || '/';
      try { history.replaceState(null, '', '#' + enc(p)); } catch (e) {}
    }
    load(p);
  });
})();
</script>
</body>
</html>

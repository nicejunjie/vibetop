<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Files — Vibetop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column; background: #0e1117; color: #d4d8de;
    font-family: system-ui, sans-serif; -webkit-tap-highlight-color: transparent;
  }

  /* ---- toolbar: one row on desktop (wraps gracefully when narrow); ≤736px it
     stacks into the documented mobile layout (controls grid → clickable
     breadcrumb line → single-row address bar) ---- */
  .toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex-shrink: 0;
    padding: 7px 10px; background: #161b22; border-bottom: 1px solid #2a3040;
    user-select: none; -webkit-user-select: none; z-index: 3;
  }
  .crumbs {
    display: flex; align-items: center; flex: 0 1 auto; min-width: 90px;
    overflow-x: auto; white-space: nowrap; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .crumbs::-webkit-scrollbar { display: none; }
  .crumb {
    flex: 0 0 auto; border: 0; background: transparent; color: #aab4c5;
    font: 13px system-ui, sans-serif; padding: 5px 6px; border-radius: 5px;
    cursor: pointer; white-space: nowrap;
  }
  .crumb:hover { background: #1f2733; color: #e6edf3; }
  .crumb:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }
  .crumb.cur { color: #e6edf3; font-weight: 600; }
  .crumb-sep { flex: 0 0 auto; color: #4a5265; font-size: 11px; padding: 0 1px; }
  .addr { display: flex; flex: 1 1 160px; min-width: 120px; }
  .addr input {
    flex: 1; min-width: 0; background: #0e1117; color: #d4d8de;
    border: 1px solid #2a3040; border-radius: 6px; padding: 6px 9px;
    font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .addr input:focus { outline: none; border-color: #8a4adb; }
  .tools { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  .tools button, .tools select, .actbar button {
    background: #1f2733; color: #d4d8de; border: 1px solid #2a3040;
    border-radius: 6px; padding: 5px 9px; font: 12px system-ui, sans-serif;
    cursor: pointer; min-height: 30px; white-space: nowrap;
  }
  .tools button:hover, .tools select:hover, .actbar button:hover { background: #253044; }
  .tools button:focus-visible, .tools select:focus-visible, .actbar button:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }
  .tools button[aria-pressed="true"] { background: #241a38; border-color: #8a4adb; color: #fff; }
  .tools button:disabled { opacity: .45; cursor: default; }
  #manage { color: #b79be8; }
  #pastebtn { display: none; color: #b79be8; }
  #pastebtn.on { display: inline-block; }

  /* one-line notice under the toolbar (truncated listings, quiet errors) */
  .notice {
    display: none; flex-shrink: 0; padding: 5px 14px; font-size: 12px;
    color: #aab4c5; background: #12161d; border-bottom: 1px solid #20262f;
  }
  .notice.on { display: block; }

  /* slim upload progress (per-file bar + overall n/N) */
  .uprog { display: none; flex-shrink: 0; padding: 5px 14px 7px; background: #12161d; border-bottom: 1px solid #20262f; }
  .uprog.on { display: block; }
  .uprog-txt { font-size: 12px; color: #aab4c5; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .uprog-bar { height: 3px; background: #1f2733; border-radius: 2px; overflow: hidden; }
  .uprog-fill { height: 100%; width: 0; background: #8a4adb; transition: width .15s linear; }

  /* selection action bar — appears with a selection (desktop) / select mode
     (touch). A FLOATING bottom pill, not in-flow: appearing must never shift
     the listing (an in-flow bar broke double-click — the first click's bar
     pushed the rows down under the cursor) and bottom = thumb-reachable. */
  .actbar {
    display: none; position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 14px; z-index: 5; align-items: center; gap: 6px;
    padding: 6px 8px; background: #161b22; border: 1px solid #2a3040;
    border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.5);
    max-width: min(94vw, 640px);
    overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    user-select: none; -webkit-user-select: none;
  }
  .actbar::-webkit-scrollbar { display: none; }
  .actbar.on { display: flex; }
  .actbar.on ~ .main { padding-bottom: 62px; }   /* last rows stay reachable under the pill */
  .actbar .cnt { flex: 0 0 auto; font-size: 12px; color: #aab4c5; padding: 0 4px 0 6px; white-space: nowrap; }
  .actbar .sp { flex: 0 0 2px; }
  .actbar button:disabled { opacity: .4; cursor: default; }
  .actbar .danger { color: #f1b3b3; }
  .actbar .danger:hover { background: #3a2024; border-color: #5a2c33; }

  /* search bar (🔍 / Ctrl+F) — slim row under the toolbar */
  .sbar {
    display: none; align-items: center; gap: 8px; flex-shrink: 0;
    padding: 6px 10px; background: #12161d; border-bottom: 1px solid #20262f;
    user-select: none; -webkit-user-select: none;
  }
  .sbar.on { display: flex; }
  .sbar input {
    flex: 1 1 160px; min-width: 100px; background: #0e1117; color: #d4d8de;
    border: 1px solid #2a3040; border-radius: 6px; padding: 6px 9px;
    font: 13px system-ui, sans-serif;
  }
  .sbar input:focus { outline: none; border-color: #8a4adb; }
  .seg { display: flex; flex: 0 0 auto; border: 1px solid #2a3040; border-radius: 6px; overflow: hidden; }
  .seg button {
    border: 0; background: transparent; color: #aab4c5; padding: 5px 10px;
    font: 12px system-ui, sans-serif; cursor: pointer; min-height: 28px;
  }
  .seg button:hover { background: #1f2733; }
  .seg button.on { background: #241a38; color: #fff; }
  .seg button:focus-visible { outline: 2px solid #8a4adb; outline-offset: -2px; }
  .scope { flex: 0 1 auto; min-width: 0; font-size: 12px; color: #6b7488; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sbar .sx {
    flex: 0 0 auto; background: #1f2733; color: #d4d8de; border: 1px solid #2a3040;
    border-radius: 6px; padding: 5px 10px; font: 12px system-ui, sans-serif;
    cursor: pointer; min-height: 30px;
  }
  .sbar .sx:hover { background: #253044; }
  .sbar .sx:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }

  /* ---- listing ---- */
  .main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  .row {
    display: flex; align-items: center; gap: 10px; padding: 5px 14px;
    min-height: 36px; cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .row:hover { background: #161b22; }
  .row.sel { background: #1f2937; box-shadow: inset 2px 0 0 #8a4adb; }
  .row.cut { opacity: .45; }
  .row.droptgt { background: #241a38; box-shadow: inset 0 0 0 1px #8a4adb; }
  .row .ck {
    display: none; flex: 0 0 18px; height: 18px; border: 1.5px solid #4a5265;
    border-radius: 50%; align-items: center; justify-content: center;
    font-size: 11px; color: transparent;
  }
  .main.selmode .row .ck { display: inline-flex; }
  .row.sel .ck { background: #8a4adb; border-color: #8a4adb; color: #fff; }
  .row.sel .ck::after { content: "✓"; }
  .row .ic { flex: 0 0 22px; text-align: center; font-size: 15px; }
  .row .nm { flex: 1 1 auto; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.dir .nm { color: #e6edf3; }
  .row input.edit {
    flex: 1 1 auto; min-width: 0; background: #0e1117; color: #e6edf3;
    border: 1px solid #8a4adb; border-radius: 5px; padding: 4px 7px;
    font: 13px system-ui, sans-serif;
  }
  .row input.edit:focus { outline: none; }
  .row .sz {
    flex: 0 0 76px; text-align: right; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #8a93a6; white-space: nowrap;
  }
  .row .mt { flex: 0 0 96px; text-align: right; font-size: 12px; color: #6b7488; white-space: nowrap; }

  /* search result rows: dimmed parent path; content mode adds :line + snippet */
  .row .pp { flex: 0 1 auto; min-width: 0; font-size: 12px; color: #6b7488; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .ln { flex: 0 0 auto; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: #6b7488; }
  .row.sres { flex-wrap: wrap; row-gap: 1px; padding-top: 6px; padding-bottom: 6px; }
  .row.sres .snip {
    flex: 1 0 100%; min-width: 0; margin-left: 32px;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #8a93a6;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row mark { background: rgba(138, 74, 219, .4); color: #fff; border-radius: 2px; padding: 0 1px; }

  /* drag ghost (pointer-based drag-to-folder, desktop) */
  .dghost {
    position: fixed; z-index: 50; pointer-events: none; background: #241a38;
    border: 1px solid #8a4adb; color: #e6edf3; font-size: 12px;
    padding: 4px 10px; border-radius: 6px; opacity: .95; white-space: nowrap;
  }

  /* quiet centered states: loading / empty / error */
  .state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 48px 20px; text-align: center; color: #6b7488; font-size: 13px;
  }
  .state .big { font-size: 15px; color: #aab4c5; }
  .state .pth { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #4a5265; word-break: break-all; }
  .state button {
    background: #1f2733; color: #d4d8de; border: 1px solid #2a3040; border-radius: 6px;
    padding: 7px 14px; font: 13px system-ui, sans-serif; cursor: pointer; min-height: 34px;
  }
  .state button:hover { background: #253044; }
  .state button:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }

  /* ---- confirm card (delete) — vibe-modal conventions, self-contained ---- */
  .mov {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center;
    justify-content: center; background: rgba(6,9,14,.55); padding: 20px;
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .mcard {
    background: #161b22; border: 1px solid #2a3040; border-radius: 12px;
    box-shadow: 0 12px 44px rgba(0,0,0,.55); max-width: 400px; width: 100%;
    padding: 18px 18px 14px; color: #e6edf3;
  }
  .mcard h3 { margin: 0 0 8px; font-size: 15px; font-weight: 650; color: #f0f4f8; }
  .mcard p { margin: 0 0 14px; font-size: 13px; line-height: 1.5; color: #b9c6d4; }
  .mcard ul { margin: 0 0 14px; padding: 0; list-style: none; max-height: 180px; overflow-y: auto; }
  .mcard li { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: #b9c6d4; padding: 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mcard li.more { color: #6b7488; font-family: system-ui, sans-serif; }
  .mbtns { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .mbtns button { font: 600 13px system-ui, sans-serif; padding: 8px 15px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; min-height: 36px; }
  .mbtns .mcancel { background: transparent; color: #9fb0c0; border-color: #2a3040; }
  .mbtns .mcancel:hover { background: rgba(255,255,255,.06); color: #c8d4e0; }
  .mbtns .mok { background: #2f6fd6; color: #fff; }
  .mbtns .mok.danger { background: #c0392b; }
  .mbtns .mok:hover { filter: brightness(1.12); }
  .mbtns button:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }

  /* share card internals (link row / expiry row / manage list) */
  .shr-row { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
  .shr-url {
    flex: 1; min-width: 0; background: #0e1117; color: #d4d8de;
    border: 1px solid #2a3040; border-radius: 6px; padding: 7px 9px;
    font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .shr-url:focus { outline: none; border-color: #8a4adb; }
  .shr-sm {
    flex: 0 0 auto; background: #1f2733; color: #d4d8de; border: 1px solid #2a3040;
    border-radius: 6px; padding: 6px 11px; font: 12px system-ui, sans-serif;
    cursor: pointer; min-height: 32px; white-space: nowrap;
  }
  .shr-sm:hover { background: #253044; }
  .shr-sm.danger { color: #f1b3b3; }
  .shr-sm.danger:hover { background: #3a2024; border-color: #5a2c33; }
  .shr-sm:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }
  .shr-exp { flex: 1; min-width: 0; font-size: 12px; color: #aab4c5; }
  select.shr-sel {
    background: #1f2733; color: #d4d8de; border: 1px solid #2a3040;
    border-radius: 6px; padding: 5px 8px; font: 12px system-ui, sans-serif; cursor: pointer;
  }
  .shr-list { max-height: 240px; overflow-y: auto; margin: 0 0 12px; }
  .shr-list .empty { font-size: 13px; color: #6b7488; padding: 6px 0; }
  .shr-item { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-bottom: 1px solid #20262f; }
  .shr-item:last-child { border-bottom: 0; }
  .shr-item .nm2 { flex: 1; min-width: 0; font-size: 13px; color: #d4d8de; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .shr-item .dim { display: block; font-size: 11px; color: #6b7488; margin-top: 1px; }
  .shr-tag { font-size: 10px; color: #8a93a6; border: 1px solid #2a3040; padding: 1px 5px; border-radius: 4px; margin-left: 5px; vertical-align: 1px; }

  /* toast (bottom-center, like the Files paste toast) */
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 30;
    max-width: min(92vw, 480px); padding: 10px 16px; border-radius: 11px;
    background: #12161d; color: #e6edf3; border: 1px solid #2a3444;
    box-shadow: 0 8px 30px rgba(0,0,0,.5); font: 500 13px system-ui, sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.err { border-color: #5a2c33; color: #f1b3b3; white-space: normal; }

  /* ---- text preview overlay ---- */
  .pv { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: #0e1117; }
  .pv.open { display: flex; }
  .pv-head {
    display: flex; align-items: center; gap: 10px; flex-shrink: 0; min-height: 40px;
    padding: 4px 10px; background: #161b22; border-bottom: 1px solid #2a3040;
  }
  .pv-name { flex: 1 1 auto; min-width: 0; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pv-info { flex-shrink: 0; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #6b7488; }
  .pv-head button {
    flex-shrink: 0; background: #1f2733; color: #d4d8de; border: 1px solid #2a3040;
    border-radius: 6px; padding: 5px 10px; font: 12px system-ui, sans-serif;
    cursor: pointer; min-height: 30px;
  }
  .pv-head button:hover { background: #253044; }
  .pv-head button:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }
  .pv-note { display: none; flex-shrink: 0; padding: 5px 14px; font-size: 12px; color: #aab4c5; background: #12161d; border-bottom: 1px solid #20262f; }
  .pv-note.on { display: block; }
  .pv-body {
    flex: 1; min-height: 0; overflow: auto; padding: 14px 18px;
    font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #d4d8de; white-space: pre; tab-size: 4;
  }
  .pv-body.msg { display: flex; align-items: center; justify-content: center; color: #6b7488; font-family: system-ui, sans-serif; font-size: 13px; white-space: normal; }

  /* ---- editor overlay (editable text ≤1MB; header/✕ reuse .pv-head) ---- */
  .ed { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: #0e1117; }
  .ed.open { display: flex; }
  #ed-dirty { display: none; color: #8a4adb; margin-right: 6px; }
  .ed.dirty #ed-dirty { display: inline; }
  #ed-save { background: #8a4adb; border-color: #8a4adb; color: #fff; }
  #ed-save:hover:not(:disabled) { background: #9a5ceb; }
  #ed-save:disabled { background: #1f2733; border-color: #2a3040; color: #6b7488; cursor: default; }
  .ed textarea {
    flex: 1; min-height: 0; resize: none; border: 0; outline: none;
    background: #0e1117; color: #d4d8de; padding: 14px 18px;
    font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre; tab-size: 4; overflow: auto;
  }
  .ed-foot {
    display: flex; align-items: center; gap: 14px; flex-shrink: 0;
    padding: 4px 14px; min-height: 26px; background: #161b22;
    border-top: 1px solid #2a3040;
    font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: #6b7488;
  }

  /* ---- PDF overlay (native browser PDF viewer in an iframe) ---- */
  .pdfov { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; background: #0e1117; }
  .pdfov.open { display: flex; }
  .pdf-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .pdf-body iframe { flex: 1; min-height: 0; width: 100%; border: 0; background: #161b22; }
  .pdf-fb {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; color: #6b7488; font-size: 13px;
  }
  .pdf-fb button {
    background: #1f2733; color: #d4d8de; border: 1px solid #2a3040; border-radius: 6px;
    padding: 7px 14px; font: 13px system-ui, sans-serif; cursor: pointer; min-height: 34px;
  }
  .pdf-fb button:hover { background: #253044; }

  /* ---- mobile ≤736px: sticky controls grid → breadcrumb → address row ---- */
  @media (max-width: 736px) {
    .toolbar { gap: 7px; padding: 7px 10px 8px; }
    .tools { order: 1; flex: 1 0 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .tools button, .tools select { min-height: 40px; font-size: 13px; padding: 5px 8px; }
    #pastebtn.on { display: block; }
    .crumbs { order: 2; flex: 1 0 100%; min-width: 0; }
    .crumb { font-size: 14px; padding: 6px 7px; }
    .addr { order: 3; flex: 1 0 100%; }
    .addr input { padding: 9px 10px; font-size: 14px; }
    /* wrap instead of an (invisible) horizontal scroll so every action is
       visible; disabled actions hide entirely — contextual, not greyed */
    .actbar { padding: 6px 8px; bottom: 12px; max-width: calc(100vw - 12px); flex-wrap: wrap; justify-content: center; overflow-x: visible; }
    .actbar button { min-height: 40px; font-size: 13px; padding: 5px 11px; }
    .actbar button:disabled { display: none; }
    .row { min-height: 46px; padding: 5px 12px; }
    .row .nm { font-size: 14px; }
    .row .sz { flex-basis: 62px; }
    .row .mt { flex-basis: 74px; }
    .pv-head button { min-height: 38px; }
    /* search bar stacks: query row, then mode + scope + close */
    .sbar { flex-wrap: wrap; gap: 7px; }
    .sbar input { flex: 1 0 100%; padding: 9px 10px; font-size: 14px; }
    .seg button { min-height: 38px; padding: 5px 12px; font-size: 13px; }
    .scope { flex: 1 1 auto; }
    .sbar .sx { min-height: 40px; min-width: 44px; }
    .row.sres .snip { margin-left: 0; }
    .shr-sm { min-height: 40px; }
    select.shr-sel { min-height: 40px; }
    .shr-row { flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <nav class="crumbs" id="crumbs" aria-label="Folder path"></nav>
    <div class="addr">
      <input id="addr" type="text" spellcheck="false" autocomplete="off" autocapitalize="off"
             aria-label="Path — type a folder and press Enter" title="Type any path and press Enter">
    </div>
    <div class="tools">
      <button id="newbtn" title="Create a new folder here">＋ New</button>
      <button id="upbtn" title="Upload files to this folder">⬆ Upload</button>
      <button id="pastebtn" title="Paste here"></button>
      <select id="sortkey" aria-label="Sort by" title="Sort by">
        <option value="name">Name</option>
        <option value="size">Size</option>
        <option value="mtime">Modified</option>
      </select>
      <button id="sortdir" title="Sort direction" aria-label="Sort direction"></button>
      <button id="hidden" title="Show hidden files" aria-pressed="false">Hidden</button>
      <button id="searchbtn" title="Search this folder (Ctrl+F)" aria-pressed="false" aria-label="Search">🔍</button>
      <button id="refresh" title="Refresh" aria-label="Refresh">⟳</button>
      <button id="manage" title="Open the classic file manager here (editor, search…)">Manage</button>
    </div>
  </div>
  <div class="sbar" id="sbar">
    <input id="sq" type="text" placeholder="Search…" spellcheck="false" autocomplete="off"
           autocapitalize="off" aria-label="Search query">
    <div class="seg" role="group" aria-label="Search mode">
      <button id="sm-names" class="on">Names</button>
      <button id="sm-content">Contents</button>
    </div>
    <span class="scope" id="scope"></span>
    <button class="sx" id="s-close" title="Close search (Esc)">✕</button>
  </div>
  <div class="notice" id="notice"></div>
  <div class="uprog" id="uprog">
    <div class="uprog-txt" id="uprog-txt"></div>
    <div class="uprog-bar"><div class="uprog-fill" id="uprog-fill"></div></div>
  </div>
  <div class="actbar" id="actbar">
    <span class="cnt" id="selcnt"></span>
    <button id="a-rename" title="Rename (F2)">Rename</button>
    <button id="a-download" title="Download (folders and multi-selections come as a .zip)">Download</button>
    <button id="a-share" title="Create a public link (folders download as a zip)">Share</button>
    <button id="a-copy" title="Copy (Ctrl+C)">Copy</button>
    <button id="a-cut" title="Cut (Ctrl+X)">Cut</button>
    <button id="a-delete" class="danger" title="Delete (Del)">Delete</button>
    <span class="sp"></span>
    <button id="a-clear" title="Clear selection (Esc)">✕</button>
  </div>
  <div class="main" id="main"></div>
  <input type="file" id="fileinput" multiple hidden>

  <div class="ed" id="ed" role="dialog" aria-modal="true" aria-label="Editor">
    <div class="pv-head">
      <span class="pv-name" id="ed-title"><span id="ed-dirty" title="Unsaved changes">●</span><span id="ed-name"></span></span>
      <button id="ed-save" title="Save (Ctrl+S)">Save</button>
      <button id="ed-close" title="Close (Esc)">✕</button>
    </div>
    <textarea id="ed-ta" spellcheck="false" autocomplete="off" autocorrect="off"
              autocapitalize="off" wrap="off" aria-label="File content"></textarea>
    <div class="ed-foot"><span id="ed-size"></span><span id="ed-pos"></span></div>
  </div>

  <div class="pdfov" id="pdfov" role="dialog" aria-modal="true" aria-label="PDF viewer">
    <div class="pv-head">
      <span class="pv-name" id="pdf-name"></span>
      <button id="pdf-dl" title="Download">⭳ Download</button>
      <button id="pdf-close" title="Close (Esc)">✕</button>
    </div>
    <div class="pdf-body" id="pdf-body"></div>
  </div>

  <div class="pv" id="pv" role="dialog" aria-modal="true" aria-label="File preview">
    <div class="pv-head">
      <span class="pv-name" id="pv-name"></span>
      <span class="pv-info" id="pv-info"></span>
      <button id="pv-close" title="Close (Esc)">✕</button>
    </div>
    <div class="pv-note" id="pv-note"></div>
    <pre class="pv-body" id="pv-body"></pre>
  </div>

<script>
(function() {
  // Native Files view (Files-native phases 1+2 — docs/files-native.md).
  // Loaded by files.html's tab wrapper with #/abs/path; listing/stat/read and
  // all mutations go through the per-user file agent via the manager
  // (/api/fs/*). FileBrowser remains reachable via Manage for what's not
  // native yet (editor, search).
  var IMG_RE = /\.(png|jpe?g|gif|webp|bmp|svg|avif|ico)$/i;
  var VID_RE = /\.(mp4|m4v|mov|mkv|webm|avi|wmv|flv|ogv|mpg|mpeg|ts|m2ts|3gp)$/i;
  var OFF_RE = /\.(docx?|xlsx?|pptx?|odt|ods|odp)$/i;
  var AUD_RE = /\.(mp3|wav|flac|ogg|m4a|aac|opus|wma)$/i;
  var ARC_RE = /\.(zip|tar|gz|tgz|xz|bz2|7z|rar|zst)$/i;
  var READ_MAX = 1048576;   // 1MB text-preview cap (server-enforced too)

  var crumbsEl = document.getElementById('crumbs');
  var addrEl = document.getElementById('addr');
  var sortKeyEl = document.getElementById('sortkey');
  var sortDirEl = document.getElementById('sortdir');
  var hiddenEl = document.getElementById('hidden');
  var noticeEl = document.getElementById('notice');
  var mainEl = document.getElementById('main');
  var pvEl = document.getElementById('pv');
  var actbarEl = document.getElementById('actbar');
  var pasteBtn = document.getElementById('pastebtn');
  var fileInput = document.getElementById('fileinput');

  var HOME = '';                 // resolved from /api/fs/home before first render
  var path = null;               // current folder (abs)
  var entries = [];              // raw entries from the server
  var rows = [];                 // visible (filtered+sorted) entries, index-aligned with DOM rows
  var lastGood = null;           // last folder that rendered ok (error-state ← Back fallback)
  var seq = 0;                   // stale-response guard

  // selection: names within the CURRENT folder (indices shift on re-render)
  var selected = {};             // name -> true
  var selCount = 0;
  var anchor = -1;               // keyboard/shift anchor (index into rows)
  var selectMode = false;        // touch multi-select mode (long-press)
  var pendingFocusName = null;   // select+reveal this name after the next render
  var modalOpen = false;

  // persisted view prefs (per device)
  var showHidden = false, sortKey = 'name', sortAsc = true;
  try {
    showHidden = localStorage.getItem('fsx.hidden') === '1';
    var s = (localStorage.getItem('fsx.sort') || '').split(':');
    if (s[0] === 'name' || s[0] === 'size' || s[0] === 'mtime') { sortKey = s[0]; sortAsc = s[1] !== 'desc'; }
  } catch (e) {}

  function savePrefs() {
    try {
      localStorage.setItem('fsx.hidden', showHidden ? '1' : '0');
      localStorage.setItem('fsx.sort', sortKey + ':' + (sortAsc ? 'asc' : 'desc'));
    } catch (e) {}
  }
  function syncControls() {
    sortKeyEl.value = sortKey;
    sortDirEl.textContent = sortAsc ? '↑' : '↓';
    sortDirEl.title = sortAsc ? 'Ascending — click for descending' : 'Descending — click for ascending';
    hiddenEl.setAttribute('aria-pressed', showHidden ? 'true' : 'false');
    hiddenEl.title = showHidden ? 'Hide hidden files' : 'Show hidden files';
  }

  // ---- path helpers ----
  function enc(p) { return p.split('/').map(encodeURIComponent).join('/'); }
  function dec(s) {
    return s.split('/').map(function(x) { try { return decodeURIComponent(x); } catch (e) { return x; } }).join('/');
  }
  function baseOf(p) { return p === '/' ? '/' : (p.split('/').pop() || '/'); }
  function joinPath(dir, name) { return (dir === '/' ? '' : dir) + '/' + name; }
  // Light client-side normalize: ~ → home, relative → against the current
  // folder, collapse //, resolve . and .. — so the address bar takes anything.
  function normPath(input) {
    var p = (input || '').trim();
    if (!p) return null;
    if (p === '~') p = HOME || '/';
    else if (p.slice(0, 2) === '~/') p = (HOME || '') + p.slice(1);
    if (p.charAt(0) !== '/') p = (path === '/' || !path ? '' : path) + '/' + p;
    var out = [];
    p.split('/').forEach(function(seg) {
      if (!seg || seg === '.') return;
      if (seg === '..') { out.pop(); return; }
      out.push(seg);
    });
    return '/' + out.join('/');
  }

  // ---- formatting ----
  function fmtSize(n) {
    if (n < 1024) return n + ' B';
    var u = ['KB', 'MB', 'GB', 'TB'], i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
    return (n < 10 ? n.toFixed(1) : Math.round(n)) + ' ' + u[i];
  }
  function fmtRel(ts) {
    var s = Date.now() / 1000 - ts;
    if (s < 45) return 'just now';
    if (s < 3600) return Math.round(s / 60) + 'm ago';
    if (s < 86400) return Math.round(s / 3600) + 'h ago';
    if (s < 86400 * 7) return Math.round(s / 86400) + 'd ago';
    var d = new Date(ts * 1000), now = new Date();
    var opt = { month: 'short', day: 'numeric' };
    if (d.getFullYear() !== now.getFullYear()) opt.year = 'numeric';
    return d.toLocaleDateString(undefined, opt);
  }
  function iconFor(name, isDir) {
    if (isDir) return '📁';
    if (IMG_RE.test(name)) return '🖼️';
    if (VID_RE.test(name)) return '🎬';
    if (AUD_RE.test(name)) return '🎵';
    if (ARC_RE.test(name)) return '📦';
    if (/\.pdf$/i.test(name)) return '📕';
    if (/\.(docx?|odt)$/i.test(name)) return '📘';
    if (/\.(xlsx?|ods|csv)$/i.test(name)) return '📗';
    if (/\.(pptx?|odp)$/i.test(name)) return '📙';
    return '📄';
  }

  // ---- fetch + render ----
  function api(url) {
    return fetch(url).then(function(r) { return r.json(); });
  }
  function fsop(body) {
    return fetch('/api/fs/op', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(r) { return r.json(); });
  }
  function stateEl(lines) {
    var box = document.createElement('div'); box.className = 'state';
    lines.forEach(function(n) { box.appendChild(n); });
    return box;
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // ---- toast (mutation feedback; never alert()) ----
  var toastEl = null, toastTimer = null;
  function toast(msg, isErr) {
    if (toastEl) toastEl.remove();
    clearTimeout(toastTimer);
    toastEl = el('div', 'toast' + (isErr ? ' err' : ''), msg);
    // float above the selection pill when it's showing
    if (actbarEl.classList.contains('on')) toastEl.style.bottom = '72px';
    document.body.appendChild(toastEl);
    toastTimer = setTimeout(function() {
      if (toastEl) { toastEl.remove(); toastEl = null; }
    }, isErr ? 6000 : 3200);
  }

  function renderCrumbs() {
    crumbsEl.innerHTML = '';
    var segs = path === '/' ? [] : path.replace(/^\//, '').split('/');
    var root = el('button', 'crumb' + (segs.length ? '' : ' cur'), '/');
    root.title = 'Filesystem root';
    root.addEventListener('click', function() { go('/'); });
    crumbsEl.appendChild(root);
    var acc = '';
    segs.forEach(function(seg, i) {
      acc += '/' + seg;
      var p = acc;
      crumbsEl.appendChild(el('span', 'crumb-sep', '▸'));
      var b = el('button', 'crumb' + (i === segs.length - 1 ? ' cur' : ''),
                 (HOME && p === HOME) ? 'Home' : seg);
      b.title = p;
      b.addEventListener('click', function() { go(p); });
      crumbsEl.appendChild(b);
    });
    crumbsEl.scrollLeft = crumbsEl.scrollWidth;   // deepest folder always visible
  }

  function visibleRows() {
    var v = entries.filter(function(e) { return showHidden || e.name.charAt(0) !== '.'; });
    var dir = sortAsc ? 1 : -1;
    v.sort(function(a, b) {
      if (a.isDir !== b.isDir) return a.isDir ? -1 : 1;      // folders always first
      var c = 0;
      if (sortKey === 'size') c = a.size - b.size;
      else if (sortKey === 'mtime') c = a.mtime - b.mtime;
      if (c) return c * dir;
      c = a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
      return sortKey === 'name' ? c * dir : c;               // ties break by name, always A→Z
    });
    return v;
  }

  // ---- selection ----
  function getClip() {
    try {
      var c = JSON.parse(localStorage.getItem('fsx.clip') || 'null');
      if (c && (c.mode === 'copy' || c.mode === 'cut') && Array.isArray(c.paths) && c.paths.length) return c;
    } catch (e) {}
    return null;
  }
  function selNames() { return Object.keys(selected); }
  function selPaths() { return selNames().map(function(n) { return joinPath(path, n); }); }
  function syncSelDom() {
    var clip = getClip();
    var cutSet = {};
    if (clip && clip.mode === 'cut') clip.paths.forEach(function(p) { cutSet[p] = true; });
    var els = mainEl.querySelectorAll('.row');
    for (var i = 0; i < els.length; i++) {
      var e = rows[+els[i].dataset.i];
      if (!e) continue;
      els[i].classList.toggle('sel', !!selected[e.name]);
      els[i].classList.toggle('cut', !!cutSet[joinPath(path, e.name)]);
    }
    renderActions();
  }
  function renderActions() {
    var clip = getClip();
    pasteBtn.classList.toggle('on', !!clip);
    if (clip) {
      pasteBtn.textContent = 'Paste (' + clip.paths.length + ')';
      pasteBtn.title = (clip.mode === 'cut' ? 'Move' : 'Copy') + ' ' + clip.paths.length +
                       ' item' + (clip.paths.length === 1 ? '' : 's') + ' here (Ctrl+V)';
    }
    var on = selCount > 0 || selectMode;
    actbarEl.classList.toggle('on', on);
    if (toastEl) toastEl.style.bottom = on ? '72px' : '';   // keep a live toast clear of the pill
    if (on) {
      document.getElementById('selcnt').textContent = selCount + ' selected';
      document.getElementById('a-rename').disabled = selCount !== 1;
      document.getElementById('a-share').disabled = selCount !== 1;
      var any = selCount > 0;
      ['a-download', 'a-copy', 'a-cut', 'a-delete'].forEach(function(id) {
        document.getElementById(id).disabled = !any;
      });
    }
  }
  function clearSel(quiet) {
    selected = {}; selCount = 0; anchor = -1;
    if (!quiet) syncSelDom(); else renderActions();
  }
  function setOnly(i) {
    selected = {}; selCount = 0;
    if (i >= 0 && rows[i]) { selected[rows[i].name] = true; selCount = 1; anchor = i; revealRow(i); }
    syncSelDom();
  }
  function toggleSel(i) {
    if (!rows[i]) return;
    var n = rows[i].name;
    if (selected[n]) { delete selected[n]; selCount--; }
    else { selected[n] = true; selCount++; anchor = i; }
    syncSelDom();
  }
  function rangeSel(a, b) {
    selected = {}; selCount = 0;
    var lo = Math.min(a, b), hi = Math.max(a, b);
    for (var i = lo; i <= hi; i++) if (rows[i]) { selected[rows[i].name] = true; selCount++; }
    syncSelDom();
  }
  function revealRow(i) {
    var r = mainEl.querySelector('.row[data-i="' + i + '"]');
    if (r) r.scrollIntoView({ block: 'nearest' });
  }
  function enterSelectMode(i) {
    selectMode = true;
    mainEl.classList.add('selmode');
    if (i >= 0) { selected = {}; selCount = 0; toggleSel(i); }
    else renderActions();
  }
  function exitSelectMode() {
    selectMode = false;
    mainEl.classList.remove('selmode');
    clearSel();
  }

  function renderList() {
    rows = visibleRows();
    // prune selection to names still visible in this folder
    var keep = {}, kept = 0;
    rows.forEach(function(e) { if (selected[e.name]) { keep[e.name] = true; kept++; } });
    selected = keep; selCount = kept; anchor = -1;
    mainEl.innerHTML = '';
    if (!rows.length) {
      var hid = entries.length - rows.length;
      var msg = hid > 0
        ? hid + ' hidden item' + (hid === 1 ? '' : 's') + ' — use “Hidden” to show them'
        : 'Empty folder';
      mainEl.appendChild(stateEl([el('div', 'big', msg)]));
      renderActions();
      return;
    }
    var frag = document.createDocumentFragment();
    rows.forEach(function(e, i) {
      var r = el('div', 'row' + (e.isDir ? ' dir' : ''));
      r.dataset.i = i;
      r.appendChild(el('span', 'ck', ''));
      r.appendChild(el('span', 'ic', iconFor(e.name, e.isDir)));
      var nm = el('span', 'nm', e.name); nm.title = e.name;
      r.appendChild(nm);
      r.appendChild(el('span', 'sz', e.isDir ? '—' : fmtSize(e.size)));
      var mt = el('span', 'mt', fmtRel(e.mtime));
      mt.title = new Date(e.mtime * 1000).toLocaleString();
      r.appendChild(mt);
      frag.appendChild(r);
    });
    mainEl.appendChild(frag);
    if (pendingFocusName) {
      for (var i = 0; i < rows.length; i++) {
        if (rows[i].name === pendingFocusName) { setOnly(i); break; }
      }
      pendingFocusName = null;
    }
    syncSelDom();
  }

  function renderError(err) {
    mainEl.innerHTML = '';
    var big, ic;
    if (err.code === 'eperm') { ic = '🔒'; big = 'You don’t have permission to view this folder'; }
    else if (err.code === 'enoent') { ic = '❓'; big = 'Folder not found'; }
    else if (err.code === 'enotdir') { ic = '📄'; big = 'Not a folder'; }
    else { ic = '⚠️'; big = 'Couldn’t load this folder'; }
    var back = el('button', null, '← Back');
    back.addEventListener('click', function() {
      // Never strand the user (docs/design-decisions.md): prefer real history
      // (matches the browser Back button); with none, fall back to the last
      // good folder or home. The toolbar above stays fully live either way.
      if (lastGood && lastGood !== path) history.back();
      else go(lastGood || HOME || '/');
    });
    mainEl.appendChild(stateEl([
      el('div', null, ic),
      el('div', 'big', big),
      el('div', 'pth', path),
      back
    ]));
  }

  function setNotice(text) {
    noticeEl.textContent = text || '';
    noticeEl.classList.toggle('on', !!text);
  }

  function load(p, keepScroll) {
    var my = ++seq;
    var st = keepScroll ? mainEl.scrollTop : 0;
    if (p !== path) { clearSel(true); if (selectMode) { selectMode = false; mainEl.classList.remove('selmode'); } }
    // Quiet delayed loading state — no flash on fast responses.
    setTimeout(function() {
      if (seq === my && path === p && !mainEl.childNodes.length) {
        mainEl.appendChild(stateEl([el('div', null, 'Loading…')]));
      }
    }, 250);
    path = p;
    document.title = (HOME && p === HOME ? 'Home' : baseOf(p)) + ' — Files';
    if (document.activeElement !== addrEl) addrEl.value = p;
    renderCrumbs();
    // Navigating leaves any search results behind; the bar (if open) rescopes.
    if (searchActive) { searchActive = false; searchSeq++; }
    if (searchOpen) updateScope();
    mainEl.innerHTML = '';
    setNotice('');
    api('/api/fs/list?path=' + encodeURIComponent(p)).then(function(d) {
      if (seq !== my) return;                       // navigated away meanwhile
      // A FILE path can arrive via the hash (a shared tab restored from a
      // FileBrowser preview state, or the toggle flipping mid-preview): land
      // in the parent folder and open the file once, instead of an error.
      if (d && !d.ok && d.code === 'enotdir' && p.lastIndexOf('/') > 0) {
        var parent = p.slice(0, p.lastIndexOf('/')) || '/';
        var fname = baseOf(p);
        api('/api/fs/stat?path=' + encodeURIComponent(p)).then(function(sd) {
          go(parent);
          if (sd && sd.ok && sd.stat && !sd.stat.isDir) {
            setTimeout(function() { openEntry(sd.stat, p); }, 150);
          }
        });
        return;
      }
      if (!d || !d.ok) { renderError(d || {}); return; }
      entries = d.entries || [];
      lastGood = p;
      renderList();
      if (d.truncated) setNotice('Large folder — showing the first ' + entries.length + ' entries.');
      mainEl.scrollTop = st;
    }).catch(function() {
      if (seq !== my) return;
      renderError({ code: 'net', error: 'network' });
    });
  }
  function refresh() { if (path) load(path, true); }

  // Navigate = update the hash (so browser back/forward walk the folder trail).
  function go(p) {
    var h = '#' + enc(p);
    if (location.hash === h) { load(p); return; }   // same folder → just refresh
    location.hash = h;                              // hashchange → load()
  }
  window.addEventListener('hashchange', function() {
    var p = dec(location.hash.slice(1)) || HOME || '/';
    if (p !== path) load(p);
  });

  // ---- opening entries ----
  function post(type, absPath) {
    try {
      (window.top || window).postMessage({ type: type, path: absPath.replace(/^\//, '') }, '*');
    } catch (e) {}
  }
  // Open an entry of the CURRENT folder, or any abs path (the address bar's
  // file jump passes `abs` since its dir context differs from `path`).
  function openEntry(e, abs) {
    var p = abs || joinPath(path, e.name);
    if (e.isDir) { go(p); return; }
    if (IMG_RE.test(e.name)) { post('image-view', p); return; }
    if (VID_RE.test(e.name)) { post('video-view', p); return; }
    if (OFF_RE.test(e.name)) { post('office-view', p); return; }
    openFile(p, e.name);
  }

  // ---- row interaction: select on click (mouse), open on double-click;
  // touch keeps tap-to-open and long-press (~450ms) enters select mode ----
  var lastPtrType = 'mouse';
  var suppressUntil = 0;         // eat the click that follows a long-press / drag
  var lpTimer = null, lpStart = null, lpFired = false;
  var dragCand = null, drag = null, ghostEl = null, dropRow = null;

  mainEl.addEventListener('pointerdown', function(ev) {
    lastPtrType = ev.pointerType || 'mouse';
    var r = ev.target.closest('.row');
    // only LISTING rows (data-i) long-press/drag — search results have their own click open
    if (!r || r.querySelector('input.edit') || r.dataset.i === undefined) return;
    if (ev.pointerType === 'touch') {
      lpStart = { x: ev.clientX, y: ev.clientY };
      clearTimeout(lpTimer);
      lpTimer = setTimeout(function() {
        lpTimer = null;
        lpFired = true;          // suppression starts at finger-LIFT (endPointer)
        enterSelectMode(+r.dataset.i);
      }, 450);
    } else if (ev.pointerType === 'mouse' && ev.button === 0) {
      dragCand = { i: +r.dataset.i, x: ev.clientX, y: ev.clientY };
    }
  });
  document.addEventListener('pointermove', function(ev) {
    if (lpTimer && lpStart &&
        (Math.abs(ev.clientX - lpStart.x) + Math.abs(ev.clientY - lpStart.y)) > 10) {
      clearTimeout(lpTimer); lpTimer = null;        // it's a scroll, not a long-press
    }
    if (dragCand && !drag &&
        (Math.abs(ev.clientX - dragCand.x) + Math.abs(ev.clientY - dragCand.y)) > 6) {
      startDrag(dragCand.i);
    }
    if (drag) moveDrag(ev);
  });
  function endPointer(ev, cancelled) {
    clearTimeout(lpTimer); lpTimer = null;
    dragCand = null;
    if (lpFired) {
      // A long-press just completed: eat only ITS synthetic click (arrives
      // within ms of the lift), never a following intentional tap.
      lpFired = false;
      suppressUntil = Date.now() + 250;
    }
    if (drag) { endDrag(ev, cancelled); }
  }
  document.addEventListener('pointerup', function(ev) { endPointer(ev, false); });
  document.addEventListener('pointercancel', function(ev) { endPointer(ev, true); });
  mainEl.addEventListener('contextmenu', function(ev) {
    if (lastPtrType === 'touch') ev.preventDefault();   // long-press is select mode
  });

  mainEl.addEventListener('click', function(ev) {
    if (Date.now() < suppressUntil) return;
    var r = ev.target.closest('.row');
    if (!r) { if (!selectMode) clearSel(); return; }    // empty area clears (desktop)
    if (r.querySelector('input.edit')) return;          // inline editor row
    var i = +r.dataset.i;
    if (!rows[i]) return;
    if (selectMode) { toggleSel(i); return; }
    if (lastPtrType === 'touch') { openEntry(rows[i]); return; }
    if (ev.ctrlKey || ev.metaKey) toggleSel(i);
    else if (ev.shiftKey && anchor >= 0) rangeSel(anchor, i);
    else setOnly(i);
  });
  mainEl.addEventListener('dblclick', function(ev) {
    if (lastPtrType === 'touch') return;
    var r = ev.target.closest('.row');
    if (!r || r.querySelector('input.edit')) return;
    if (rows[+r.dataset.i]) openEntry(rows[+r.dataset.i]);
  });

  // ---- drag to folder (desktop, pointer-based — no HTML5 DnD) ----
  function startDrag(i) {
    if (!rows[i]) { dragCand = null; return; }
    var names = selected[rows[i].name] ? selNames() : [rows[i].name];
    if (!selected[rows[i].name]) setOnly(i);
    drag = { names: names, srcDir: path };
    ghostEl = el('div', 'dghost',
      names.length === 1 ? names[0] : names.length + ' items');
    document.body.appendChild(ghostEl);
  }
  function moveDrag(ev) {
    ghostEl.style.left = (ev.clientX + 12) + 'px';
    ghostEl.style.top = (ev.clientY + 14) + 'px';
    var t = document.elementFromPoint(ev.clientX, ev.clientY);
    var r = t && t.closest ? t.closest('.row') : null;
    var tgt = null;
    if (r && r.classList.contains('dir')) {
      var e = rows[+r.dataset.i];
      if (e && drag.names.indexOf(e.name) === -1) tgt = r;
    }
    if (dropRow !== tgt) {
      if (dropRow) dropRow.classList.remove('droptgt');
      dropRow = tgt;
      if (dropRow) dropRow.classList.add('droptgt');

  function endDrag(ev, cancelled) {
    var tgt = dropRow, d = drag;

    if (ghostEl) ghostEl.remove();
    ghostEl = null; dropRow = null; drag = null;
    suppressUntil = Date.now() + 350;               // don't let the click open/select
    if (cancelled || !tgt) return;
    var e = rows[+tgt.dataset.i];
    if (!e) return;
    var dst = joinPath(d.srcDir, e.name);
    var src = d.names.map(function(n) { return joinPath(d.srcDir, n); });
    fsop({ op: 'move', src: src, dst: dst }).then(function(res) {

  }

  // ---- mutation plumbing ----
  // Per-item results → one quiet toast (successes summarized, failures first).
  function opResult(d, okMsg) {
    if (!d || !d.ok) { toast((d && d.error) || 'Operation failed', true); return false; }
    var fails = (d.results || []).filter(function(x) { return !x.ok; });
    if (fails.length) {
      toast(fails.length + ' failed — ' + (fails[0].error || fails[0].code || 'error'), true);
      return false;
    }
    if (okMsg) toast(okMsg);
    return true;
  }

  // -- clipboard (survives navigation and tabs via localStorage) --
  function doCopyCut(mode) {
    if (!selCount) return;
    try {
      localStorage.setItem('fsx.clip', JSON.stringify({ mode: mode, paths: selPaths() }));
    } catch (e) { toast('Clipboard unavailable', true); return; }
    toast(selCount + ' item' + (selCount === 1 ? '' : 's') + (mode === 'copy' ? ' copied' : ' cut'));
    if (selectMode) exitSelectMode();
    syncSelDom();
  }
  function doPaste() {
    var c = getClip();
    if (!c || !path) return;
    var op = c.mode === 'cut' ? 'move' : 'copy';
    fsop({ op: op, src: c.paths, dst: path }).then(function(d) {
      var n = c.paths.length;
      opResult(d, (op === 'move' ? 'Moved ' : 'Pasted ') + n + ' item' + (n === 1 ? '' : 's'));
      if (c.mode === 'cut') { try { localStorage.removeItem('fsx.clip'); } catch (e) {} }

  }

  // -- choice card (vibe-modal style): delete confirm, dirty-close, econflict --
  // opts: { title, msg?, names?, buttons: [{label, value, cancel?, danger?}],
  //         defaultValue? (Enter; omitted = Enter inert), escValue (Esc/backdrop),
  //         focusValue? (button to focus; omitted = last) }
  function cardChoice(opts) {
    return new Promise(function(resolve) {
      modalOpen = true;
      var ov = el('div', 'mov');
      var card = el('div', 'mcard');
      card.setAttribute('role', 'dialog');
      card.appendChild(el('h3', null, opts.title));
      if (opts.msg) card.appendChild(el('p', null, opts.msg));
      if (opts.names && opts.names.length) {
        var ul = el('ul');
        opts.names.slice(0, 8).forEach(function(n) { ul.appendChild(el('li', null, n)); });
        if (opts.names.length > 8) ul.appendChild(el('li', 'more', '…and ' + (opts.names.length - 8) + ' more'));
        card.appendChild(ul);

      function close(val) {
        modalOpen = false;
        document.removeEventListener('keydown', onKey, true);
        ov.remove();

      function onKey(e) {
        if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(opts.escValue); }
        else if (e.key === 'Enter' && opts.defaultValue !== undefined) { e.preventDefault(); e.stopPropagation(); close(opts.defaultValue); }
      }

      opts.buttons.forEach(function(b) {
        var bt = el('button', b.cancel ? 'mcancel' : 'mok' + (b.danger ? ' danger' : ''), b.label);
        bt.addEventListener('click', function() { close(b.value); });
        btns.appendChild(bt);
        if ('focusValue' in opts ? b.value === opts.focusValue : true) focusBtn = bt;
      });
      card.appendChild(btns);
      ov.appendChild(card);
      ov.addEventListener('click', function(e) { if (e.target === ov) close(opts.escValue); });

  function doDelete() {
    if (!selCount) return;
    var names = selNames();
    cardChoice({
      title: 'Delete ' + selCount + ' item' + (selCount === 1 ? '' : 's') + '? This can’t be undone.',
      names: names,
      buttons: [
        { label: 'Cancel', value: false, cancel: true },
        { label: 'Delete', value: true, danger: true }
      ],
      defaultValue: true, escValue: false, focusValue: true
    }).then(function(yes) {
      if (!yes) return;
      fsop({ op: 'delete', paths: selPaths() }).then(function(d) {
        opResult(d, 'Deleted ' + names.length + ' item' + (names.length === 1 ? '' : 's'));
        if (selectMode) exitSelectMode();
        refresh();
      }).catch(function() { toast('Delete failed — network error', true); });
    });
  }


  // iOS-standalone-safe download. In an installed PWA, an <a download> (or a
  // bare attachment navigation) replaces the WHOLE app view with iOS's white
  // "Open in Preview" sheet (reported with a screenshot). The iOS-correct path
  // is the SYSTEM SHARE SHEET with a real File (save to Files/Photos, AirDrop)
  // — in-app, no navigation. Anchor download stays for every normal browser;
  // window.open (Safari handles it) is the last-resort fallback. Share must
  // run inside the click's transient activation, so the fetch races it — a
  // too-slow fetch falls back rather than throwing at the user.
  var IS_IOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
               (/Mac/.test(navigator.userAgent) && 'ontouchend' in document);
  function nativeDownload(url, name) {
    if (!(IS_IOS && navigator.share && navigator.canShare)) {
      var a = document.createElement('a');
      a.href = url;
      if (name) a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      return;
    }
    fetch(url).then(function(r) {
      if (!r.ok) throw 0;
      return r.blob();
    }).then(function(b) {
      var f = new File([b], name || 'download', { type: b.type || 'application/octet-stream' });
      if (!navigator.canShare({ files: [f] })) throw 0;
      return navigator.share({ files: [f] });
    }).catch(function(e) {
      if (e && e.name === 'AbortError') return;   // user closed the sheet
      try { window.open(url); } catch (_) {}
    });
  }

  // -- download: single file direct; folders / multi-selections as a zip --
  function doDownload() {
    if (!selCount) return;
    var names = selNames();
    var single = names.length === 1 ? rows.filter(function(e) { return e.name === names[0]; })[0] : null;
    var url = (single && !single.isDir)
      ? '/api/fs/download?path=' + encodeURIComponent(joinPath(path, single.name))
      : '/api/fs/zip?' + selPaths().map(function(p) { return 'path=' + encodeURIComponent(p); }).join('&');
    nativeDownload(url, (single && !single.isDir) ? single.name
                        : (names.length === 1 ? names[0] : 'files') + '.zip');
  }

  // -- inline editors: new folder + rename --
  function stopEdit(input) {
    var r = input.closest('.row');
    if (r) r.remove();
  }
  function editKeys(input, commit, cancel) {
    var done = false;
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); if (!done) { done = true; commit(input.value); } }
      else if (e.key === 'Escape') { e.preventDefault(); done = true; cancel(); }
      e.stopPropagation();
    });
    input.addEventListener('blur', function() {
      // OS metaphor: clicking away commits the name (Esc cancels).
      if (!done) { done = true; commit(input.value); }
    });
  }
  function newFolder() {
    if (!path) return;
    var existing = mainEl.querySelector('input.edit');
    if (existing) { existing.focus(); return; }
    if (mainEl.querySelector('.state')) mainEl.innerHTML = '';   // empty-folder message
    var r = el('div', 'row dir');
    r.appendChild(el('span', 'ck', ''));
    r.appendChild(el('span', 'ic', '📁'));
    var input = el('input', 'edit');
    input.type = 'text'; input.value = 'New folder';
    input.setAttribute('aria-label', 'New folder name');
    r.appendChild(input);
    mainEl.insertBefore(r, mainEl.firstChild);
    mainEl.scrollTop = 0;
    input.focus(); input.select();
    editKeys(input, function(name) {
      name = (name || '').trim();
      if (!name || name.indexOf('/') !== -1) { stopEdit(input); return; }
      fsop({ op: 'mkdir', path: joinPath(path, name) }).then(function(d) {
        stopEdit(input);
        if (!d || !d.ok) {
          toast(d && d.code === 'eexist' ? '“' + name + '” already exists' : ((d && d.error) || 'Couldn’t create folder'), true);
          return;
        }
        pendingFocusName = name;
        refresh();
      }).catch(function() { stopEdit(input); toast('Couldn’t create folder — network error', true); });
    }, function() { stopEdit(input); refresh(); });
  }
  function startRename() {
    if (selCount !== 1) return;
    var name = selNames()[0];
    var i = -1;
    for (var k = 0; k < rows.length; k++) if (rows[k].name === name) { i = k; break; }
    var r = mainEl.querySelector('.row[data-i="' + i + '"]');
    if (i < 0 || !r || r.querySelector('input.edit')) return;
    var nm = r.querySelector('.nm');
    nm.style.display = 'none';
    var input = el('input', 'edit');
    input.type = 'text'; input.value = name;
    input.setAttribute('aria-label', 'New name');
    nm.parentNode.insertBefore(input, nm.nextSibling);
    input.focus();
    var dot = name.lastIndexOf('.');
    input.setSelectionRange(0, (!rows[i].isDir && dot > 0) ? dot : name.length);
    function closeEditor() {
      input.remove();
      nm.style.display = '';
    }
    editKeys(input, function(to) {
      to = (to || '').trim();
      if (!to || to === name || to.indexOf('/') !== -1) { closeEditor(); return; }
      fsop({ op: 'rename', path: joinPath(path, name), to: to }).then(function(d) {
        closeEditor();
        if (!d || !d.ok) {
          toast(d && d.code === 'eexist' ? '“' + to + '” already exists' : ((d && d.error) || 'Rename failed'), true);
          return;
        }
        pendingFocusName = to;
        refresh();
      }).catch(function() { closeEditor(); toast('Rename failed — network error', true); });
    }, closeEditor);
  }

  // -- upload (sequential XHR with real progress; names never overwrite:
  //    collisions get the backend's own ' (2)' suffix, chosen client-side) --
  var uprogEl = document.getElementById('uprog');
  var uprogTxt = document.getElementById('uprog-txt');
  var uprogFill = document.getElementById('uprog-fill');
  var uploading = false;
  function freeName(dir, name) {
    // stat-probe name, then "base (2).ext", "base (3).ext"…
    function probe(cand, n) {
      return api('/api/fs/stat?path=' + encodeURIComponent(joinPath(dir, cand))).then(function(d) {
        if (!d || !d.ok) return cand;               // enoent → free
        if (n > 99) return cand;                    // give up, let the server decide
        var dot = name.lastIndexOf('.');
        var next = dot > 0 ? name.slice(0, dot) + ' (' + n + ')' + name.slice(dot)
                           : name + ' (' + n + ')';
        return probe(next, n + 1);
      }).catch(function() { return cand; });
    }
    return probe(name, 2);
  }
  function uploadOne(dir, file, onProgress) {
    return freeName(dir, file.name).then(function(name) {
      return new Promise(function(resolve) {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/fs/upload?path=' + encodeURIComponent(joinPath(dir, name)));
        xhr.upload.onprogress = function(e) {
          if (e.lengthComputable) onProgress(e.loaded / e.total);
        };
        xhr.onload = function() {
          var d = null;
          try { d = JSON.parse(xhr.responseText); } catch (e) {}
          resolve({ ok: xhr.status >= 200 && xhr.status < 300 && d && d.ok, name: name,
                    error: (d && d.error) || ('HTTP ' + xhr.status) });
        };
        xhr.onerror = function() { resolve({ ok: false, name: name, error: 'network error' }); };
        xhr.send(file);
      });
    });
  }
  function uploadAll(files) {
    if (uploading || !files.length || !path) return;
    uploading = true;
    document.getElementById('upbtn').disabled = true;
    var dir = path, done = 0, fails = [];
    uprogEl.classList.add('on');
    function step() {
      if (done >= files.length) {
        uploading = false;
        document.getElementById('upbtn').disabled = false;
        uprogEl.classList.remove('on');
        if (fails.length) toast(fails.length + ' of ' + files.length + ' failed — ' + fails[0].error, true);
        else toast('Uploaded ' + files.length + ' file' + (files.length === 1 ? '' : 's'));
        if (path === dir) refresh();
        return;
      }
      var f = files[done];
      uprogTxt.textContent = 'Uploading ' + (done + 1) + '/' + files.length + ' — ' + f.name;
      uprogFill.style.width = '0%';
      uploadOne(dir, f, function(frac) {
        uprogFill.style.width = Math.round(frac * 100) + '%';
      }).then(function(res) {
        if (!res.ok) fails.push(res);
        done++;
        step();
      });
    }
    step();
  }
  fileInput.addEventListener('change', function() {
    uploadAll(Array.prototype.slice.call(fileInput.files));
    fileInput.value = '';
  });

  // ---- keyboard ----
  document.addEventListener('keydown', function(ev) {
    if (modalOpen) return;                          // the choice card handles keys
    var mod = ev.ctrlKey || ev.metaKey;
    if (pvEl.classList.contains('open')) {
      if (ev.key === 'Escape') { ev.preventDefault(); closePreview(); }
      return;
    }
    if (pdfovEl.classList.contains('open')) {
      if (ev.key === 'Escape') { ev.preventDefault(); closePdf(); }
      return;
    }
    if (edEl.classList.contains('open')) {
      if (mod && (ev.key === 's' || ev.key === 'S')) { ev.preventDefault(); edSave(false); }
      else if (ev.key === 'Escape') { ev.preventDefault(); requestCloseEditor(); }
      return;
    }
    if (mod && (ev.key === 'f' || ev.key === 'F')) { ev.preventDefault(); openSearch(); return; }
    var t = ev.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
    if (mod && (ev.key === 'c' || ev.key === 'C') && selCount) { ev.preventDefault(); doCopyCut('copy'); return; }
    if (mod && (ev.key === 'x' || ev.key === 'X') && selCount) { ev.preventDefault(); doCopyCut('cut'); return; }
    if (mod && (ev.key === 'v' || ev.key === 'V') && getClip()) { ev.preventDefault(); doPaste(); return; }
    if (mod && (ev.key === 'a' || ev.key === 'A') && rows.length) {
      ev.preventDefault();
      selected = {}; selCount = 0;
      rows.forEach(function(e) { selected[e.name] = true; selCount++; });
      syncSelDom();
      return;
    }
    if (ev.key === 'F2') { ev.preventDefault(); startRename(); return; }
    if (ev.key === 'Delete') { ev.preventDefault(); doDelete(); return; }
    if (ev.key === 'Escape') {
      if (selectMode) { ev.preventDefault(); exitSelectMode(); }
      else if (selCount) { ev.preventDefault(); clearSel(); }
      else if (searchOpen || searchActive) { ev.preventDefault(); closeSearch(); }
      return;
    }
    if (!rows.length) return;
    if (ev.key === 'ArrowDown') { ev.preventDefault(); setOnly(Math.min(rows.length - 1, anchor + 1)); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); setOnly(Math.max(0, anchor < 0 ? 0 : anchor - 1)); }
    else if (ev.key === 'Enter' && anchor >= 0 && rows[anchor]) { ev.preventDefault(); openEntry(rows[anchor]); }
  });

  // ---- open a text file: EDITOR for editable text (≤1MB, non-binary),
  //      read-only preview otherwise. PDFs get the native-viewer overlay. ----
  function openFile(absPath, name, gotoLine) {
    if (/\.pdf$/i.test(name)) { openPdf(absPath, name); return; }
    Promise.all([
      api('/api/fs/stat?path=' + encodeURIComponent(absPath)).catch(function() { return null; }),
      api('/api/fs/read?path=' + encodeURIComponent(absPath) + '&max=' + READ_MAX).catch(function() { return null; })
    ]).then(function(rs) {
      var sd = rs[0], d = rs[1];
      if (d && d.ok && !d.binary && !d.truncated) {
        openEditor(absPath, name, d.text || '', (sd && sd.ok && sd.stat) ? sd.stat.mtime : null, gotoLine);
      } else {
        showPreview(absPath, name, d);
      }
    });
  }

  // ---- read-only preview overlay (binary / >1MB / unreadable) ----
  var pvNameEl = document.getElementById('pv-name');

  var pvBodyEl = document.getElementById('pv-body');

  // ---- PDF overlay: the browser's own viewer on the inline download URL ----
  var pdfovEl = document.getElementById('pdfov');
  var pdfNameEl = document.getElementById('pdf-name');
  var pdfBodyEl = document.getElementById('pdf-body');
  var pdfReturnFocus = null, pdfAbs = null;

  function pdfUrl(absPath, inline) {
    return '/api/fs/download?path=' + encodeURIComponent(absPath) + (inline ? '&inline=1' : '');
  }
  function pdfFallback(absPath, name) {
    pdfBodyEl.innerHTML = '';
    var fb = el('div', 'pdf-fb');
    fb.appendChild(el('div', null, 'Couldn’t display ' + name + ' — download to view.'));
    var dl = el('button', null, '⭳ Download');
    dl.addEventListener('click', function() { pdfDownload(absPath, name); });
    fb.appendChild(dl);
    pdfBodyEl.appendChild(fb);

  function pdfDownload(absPath, name) {

  }
  function openPdf(absPath, name) {
    pdfReturnFocus = document.activeElement;
    pdfAbs = absPath;
    pdfNameEl.textContent = name;
    pdfNameEl.title = absPath;
    pdfBodyEl.innerHTML = '';
    var f = document.createElement('iframe');
    f.title = name;
    f.src = pdfUrl(absPath, true);
    f.addEventListener('load', function() {

      // document is opaque) — swap in the download fallback if we can see one.
      try {

        if (b && b.textContent && b.textContent.indexOf('"error"') !== -1) pdfFallback(absPath, name);
      } catch (e) {}

  // ---- Share: passwordless public links via the manager (/api/share) ----
  // The API takes HOME-RELATIVE paths; anything else is refused server-side
  // ("must be a file or folder under home, and not a dotfile") and surfaced
  // verbatim. Folders are served as a zip by the share endpoint itself.
  function rawCard(title) {
    modalOpen = true;
    var ov = el('div', 'mov');
    var card = el('div', 'mcard');
    card.setAttribute('role', 'dialog');
    card.appendChild(el('h3', null, title));
    var closed = false;
    function close() {
      if (closed) return;
      closed = true; modalOpen = false;
      document.removeEventListener('keydown', onKey, true);
      ov.remove();
    }
    function onKey(e) {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); close(); }
    }
    document.addEventListener('keydown', onKey, true);
    ov.addEventListener('click', function(e) { if (e.target === ov) close(); });
    ov.appendChild(card);
    document.body.appendChild(ov);
    return { card: card, close: close };
  }
  function shareApi(url, body) {
    return fetch(url, body ? {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    } : undefined).then(function(r) { return r.json(); });
  }
  function copyText(text, btn) {
    function done() {
      var t = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(function() { btn.textContent = t; }, 1200);
    }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();

  }
  function expiryText(ts) {
    var s = ts - Date.now() / 1000;

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Leaderboard — Vibetop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background: #0e1117; color: #d4d8de;
    font-family: system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  .bar {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    min-height: 40px; padding: 4px 10px;
    background: #161b22; border-bottom: 1px solid #2a3040;
    user-select: none; -webkit-user-select: none;
  }
  .bar .title { font-size: 13px; font-weight: 600; color: #d4d8de; white-space: nowrap; }
  .bar .title .ic { margin-right: 5px; }
  .spacer { flex: 1; }
  button {
    background: #1f2733; color: #d4d8de; border: 1px solid #2a3040;
    border-radius: 6px; padding: 5px 10px; font: 12px system-ui, sans-serif;
    cursor: pointer; white-space: nowrap; min-height: 30px;
  }
  button:hover { background: #253044; border-color: #3a4358; }
  button:focus-visible { outline: 2px solid #8a4adb; outline-offset: 1px; }

  /* ---- tabs: one page, one game at a time (same idiom as config.html) ---- */
  .tabs {
    display: flex; gap: 2px; flex-shrink: 0; padding: 0 6px;
    background: #161b22; border-bottom: 1px solid #2a3040;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    border-radius: 0; color: #9ab; font: 600 13px system-ui, sans-serif;
    padding: 9px 12px; min-height: 40px; white-space: nowrap;
  }
  .tab:hover { background: #1b212b; color: #cde; }
  .tab.active { color: #e6edf3; border-bottom-color: #8a4adb; }
  .tab .ic { margin-right: 6px; }
  /* Below this the wordmarks stop fitting; the emoji alone still identifies
     four games people just came from. */
  @media (max-width: 560px) {
    .tabs { padding: 0; }
    .tab .tx { display: none; }
    .tab { flex: 1; padding: 9px 0; font-size: 17px; }
  }

  .body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 12px 28px; }
  .panel { display: none; max-width: 560px; margin: 0 auto; }
  .panel.active { display: block; }

  /* ---- difficulty pills (Minesweeper), the .seg idiom from filesx.html ---- */
  .seg { display: inline-flex; border: 1px solid #2a3040; border-radius: 7px; overflow: hidden; margin-bottom: 14px; }
  .seg button {
    border: 0; border-radius: 0; background: transparent; color: #aab4c5;
    padding: 6px 14px; min-height: 34px; font-size: 12.5px;
  }
  .seg button:hover { background: #1f2733; }
  .seg button.on { background: #241a38; color: #fff; }
  .seg button:focus-visible { outline: 2px solid #8a4adb; outline-offset: -2px; }

  /* ---- stat chips ---- */
  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(86px, 1fr));
    gap: 8px; margin-bottom: 16px;
  }
  .stat {
    background: #161b22; border: 1px solid #2a3040;
    border-radius: 9px; padding: 8px 10px; text-align: center;
  }
  .stat .lbl {
    display: block; font-size: 9.5px; font-weight: 600; letter-spacing: .08em;
    text-transform: uppercase; color: #6b7488; margin-bottom: 3px; white-space: nowrap;
  }
  .stat .val {
    display: block; font: 600 17px ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #e6edf3; font-variant-numeric: tabular-nums;
  }

  /* ---- the ranking itself ---- */
  .lb-h {
    font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: #6b7488; margin: 0 2px 7px;
  }
  ol.rank { list-style: none; }
  ol.rank li {
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 12px; border-radius: 9px;
    background: #161b22; border: 1px solid #2a3040; font-size: 14px; color: #cdd5e1;
  }
  ol.rank li + li { margin-top: 5px; }
  ol.rank .r {
    width: 1.6em; flex: none; text-align: right;
    font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #6b7488;
  }
  ol.rank .v { font-weight: 650; font-variant-numeric: tabular-nums; color: #e6edf3; }
  ol.rank .d { margin-left: auto; flex: none; font-size: 11.5px; color: #6b7488; }
  /* The podium reads at a glance without adding a single extra pixel of chrome. */
  ol.rank li.p1 { border-color: #8a4adb; background: #1c1430; }
  ol.rank li.p1 .r, ol.rank li.p2 .r, ol.rank li.p3 .r { color: #b78bf0; }

  .empty {
    background: #161b22; border: 1px dashed #2a3040; border-radius: 10px;
    padding: 22px 16px; text-align: center; color: #aab4c5; font-size: 13.5px;
  }
  .empty button { margin-top: 12px; background: #8a4adb; border-color: #8a4adb; color: #fff; min-height: 38px; padding: 8px 16px; font-size: 13px; font-weight: 600; }
  .empty button:hover { background: #9a5ceb; border-color: #9a5ceb; }

  .foot { margin-top: 18px; text-align: center; }
  .foot button { color: #8a94a6; font-size: 11.5px; min-height: 32px; }
  .foot button:hover { color: #e5646c; border-color: #5a3038; background: #241a1c; }
  .note { margin-top: 10px; text-align: center; font-size: 11px; color: #4d5566; line-height: 1.5; }

  /* The desktop shell already puts this app's icon and name on the window
     titlebar, so the page's own bar was saying it a second time — the same
     words twice in the top-left corner. Standalone (opened directly, not in
     the shell) it still shows, because then nothing else is naming the page. */
  html.embedded .bar .title { display: none; }
  /* ...and with the title gone the bar holds nothing at all, so drop it. */
  html.embedded .bar { display: none; }
</style>
<script>try{if(window.parent!==window)document.documentElement.classList.add('embedded');}catch(e){}</script>
</head>
<body>
  <div class="bar">
    <span class="title"><span class="ic">🏆</span><span class="txt">Leaderboard</span></span>
    <span class="spacer"></span>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="mine"><span class="ic">💣</span><span class="tx">Minesweeper</span></button>
    <button class="tab" data-tab="sol"><span class="ic">🃏</span><span class="tx">Solitaire</span></button>
    <button class="tab" data-tab="2048"><span class="ic">🔢</span><span class="tx">2048</span></button>
    <button class="tab" data-tab="circuit"><span class="ic">🤖</span><span class="tx">Circuit Runner</span></button>
  </div>
  <div class="body">
    <div class="panel active" data-tab="mine">
      <div class="seg" id="mineSeg" role="group" aria-label="Difficulty">
        <button data-b="easy" class="on">Easy</button>
        <button data-b="medium">Medium</button>
        <button data-b="hard">Hard</button>
      </div>
      <div class="stats" id="mineStats"></div>
      <div class="lb-h" id="mineH">Fastest times</div>
      <div id="mineList"></div>
      <div class="foot"><button data-reset="mine">Reset Minesweeper</button></div>
    </div>
    <div class="panel" data-tab="sol">
      <div class="stats" id="solStats"></div>
      <div class="lb-h">Fewest moves</div>
      <div id="solList"></div>
      <div class="foot"><button data-reset="sol">Reset Solitaire</button></div>
    </div>
    <div class="panel" data-tab="2048">
      <div class="stats" id="g2048Stats"></div>
      <div class="lb-h">Highest scores</div>
      <div id="g2048List"></div>
      <div class="foot"><button data-reset="2048">Reset 2048</button></div>
    </div>
    <div class="panel" data-tab="circuit">
      <div class="stats" id="circuitStats"></div>
      <div class="lb-h">Highest scores</div>
      <div id="circuitList"></div>
      <div class="foot"><button data-reset="circuit">Reset Circuit Runner</button></div>
    </div>
    <p class="note">Scores are kept in this browser only — they are not shared between devices or users.</p>
  </div>
<script src="gamescore.js"></script>
<script src="vibe-modal.js"></script>
<script>
(function() {
  'use strict';

  // One row per game: everything that differs between the four panels lives
  // here, so the render below is written once instead of four times.
  var GAMES = {
    mine: {
      app: 'minesweeper', label: 'Minesweeper', lower: true, boards: ['easy', 'medium', 'hard'],
      fmt: function(v) { return v + 's'; },
      empty: function(b) { return 'No cleared game yet on ' + b + '.'; },
      stats: function(b) {
        var s = vibeScores.stats('mine', b);
        return [['Played', s.n], ['Won', s.w], ['Win rate', pct(s.w, s.n)],
                ['Streak', s.cur], ['Best streak', s.best]];
      }
    },
    sol: {
      app: 'solitaire', label: 'Solitaire', lower: true, boards: [''],
      fmt: function(v) { return v + ' moves'; },
      empty: function() { return 'No solved deal yet.'; },
      stats: function() {
        var s = vibeScores.stats('sol', '');
        return [['Deals', s.n], ['Solved', s.w], ['Win rate', pct(s.w, s.n)], ['Best streak', s.best]];
      }
    },
    '2048': {
      app: 'game2048', label: '2048', lower: false, boards: [''], seed: 'vt-2048-best',
      empty: function() { return 'No score yet.'; },
      stats: function() {
        var s = vibeScores.stats('2048', '');
        return [['Games', s.n], ['Best tile', s.x.tile || '—'], ['Reached 2048', s.w]];
      }
    },
    circuit: {
      app: 'circuit', label: 'Circuit Runner', lower: false, boards: [''], seed: 'vibetop:circuit:best',
      empty: function() { return 'No score yet.'; },
      stats: function() {
        var s = vibeScores.stats('circuit', '');
        return [['Runs', s.n], ['Furthest sector', s.x.sector ? pad2(s.x.sector) : '—'], ['Cleared', s.w]];
      }
    }
  };

  function pct(w, n) { return n ? Math.round(w * 100 / n) + '%' : '—'; }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function el(id) { return document.getElementById(id); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // Same wording the game cards use, so a date never reads two ways.
  function fmtDate(t) {
    if (!t) return '';
    var d = new Date(t), now = new Date();
    var day = function(x) { return new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime(); };
    var diff = Math.round((day(now) - day(d)) / 86400000);
    if (diff <= 0) return 'today';
    if (diff === 1) return 'yesterday';
    if (diff < 7) return diff + 'd ago';
    return (d.getMonth() + 1) + '/' + d.getDate();
  }

  // Open a game from here. In the shell that is a message to the desktop; opened
  // standalone there is no shell to ask, so just navigate.
  function play(app, src) {
    try {
      if (window.parent !== window) {
        window.top.postMessage({ type: 'open-app', app: app }, '*');
        return;
      }
    } catch (e) {}
    location.href = src;
  }

  var mineBoard = lsGet('vibetop:lb:mineboard') || 'easy';

  function renderStats(host, rows) {
    host.textContent = '';
    rows.forEach(function(r) {
      var d = document.createElement('div');
      d.className = 'stat';
      var l = document.createElement('span'); l.className = 'lbl'; l.textContent = r[0];
      var v = document.createElement('span'); v.className = 'val'; v.textContent = String(r[1]);
      d.appendChild(l); d.appendChild(v);
      host.appendChild(d);
    });
  }

  function renderList(host, key, board) {
    var g = GAMES[key];
    var list = vibeScores.list({ game: key, board: board, lower: g.lower, seed: g.seed });
    host.textContent = '';
    if (!list.length) {
      // An empty box is the bug this whole feature came from: say what is
      // missing, and offer the one action that fixes it.
      var box = document.createElement('div');
      box.className = 'empty';
      var p = document.createElement('div');
      p.textContent = g.empty(board);
      var b = document.createElement('button');
      b.textContent = 'Play ' + g.label;
      b.addEventListener('click', function() { play(g.app, '/' + g.app + '.html'); });
      box.appendChild(p); box.appendChild(b);
      host.appendChild(box);
      return 0;
    }
    var ol = document.createElement('ol');
    ol.className = 'rank';
    list.forEach(function(e, i) {
      var li = document.createElement('li');
      if (i < 3) li.className = 'p' + (i + 1);
      var r = document.createElement('span'); r.className = 'r'; r.textContent = String(i + 1);
      var v = document.createElement('span'); v.className = 'v';
      v.textContent = g.fmt ? g.fmt(e.v) : String(e.v);
      var d = document.createElement('span'); d.className = 'd'; d.textContent = fmtDate(e.t);
      li.appendChild(r); li.appendChild(v); li.appendChild(d);
      ol.appendChild(li);
    });
    host.appendChild(ol);
    return list.length;
  }

  var HOST = { mine: 'mine', sol: 'sol', '2048': 'g2048', circuit: 'circuit' };

  function renderGame(key) {
    var g = GAMES[key], board = key === 'mine' ? mineBoard : '';
    renderStats(el(HOST[key] + 'Stats'), g.stats(board));
    renderList(el(HOST[key] + 'List'), key, board);
    if (key === 'mine') {
      el('mineH').textContent = 'Fastest times · ' + board.charAt(0).toUpperCase() + board.slice(1);
    }
  }
  function renderAll() { Object.keys(GAMES).forEach(renderGame); }

  function showTab(tab) {
    if (!GAMES[tab]) tab = 'mine';
    document.querySelectorAll('.tab').forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('data-tab') === tab);
    });
    document.querySelectorAll('.panel').forEach(function(p) {
      p.classList.toggle('active', p.getAttribute('data-tab') === tab);
    });
    lsSet('vibetop:lb:tab', tab);
  }

  el('tabs').addEventListener('click', function(e) {
    var b = e.target.closest ? e.target.closest('.tab') : null;
    if (!b) return;
    showTab(b.getAttribute('data-tab'));
  });

  el('mineSeg').addEventListener('click', function(e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    mineBoard = b.getAttribute('data-b');
    lsSet('vibetop:lb:mineboard', mineBoard);
    el('mineSeg').querySelectorAll('button').forEach(function(x) { x.classList.toggle('on', x === b); });
    renderGame('mine');
  });

  document.querySelectorAll('[data-reset]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var key = btn.getAttribute('data-reset'), g = GAMES[key];
      vibeConfirm('Erase every ' + g.label + ' score and stat on this browser?\n\nThis cannot be undone.',
                  { title: 'Reset ' + g.label, okText: 'Erase', danger: true }).then(function(ok) {
        if (!ok) return;
        vibeScores.reset(key, g.seed ? [g.seed] : []);
        renderGame(key);
      });
    });
  });

  // A game hands us its tab by writing vibetop:lb:tab before asking the shell to
  // open this app. The shell reuses one iframe, so on the second visit this page
  // is already loaded and nothing would re-read that key — vibetop:active is the
  // shell's own "you are on screen now" signal, so re-read there too.
  window.addEventListener('message', function(e) {
    if (e.origin !== location.origin || !e.data) return;
    if (e.data.type === 'vibetop:active' && e.data.active) {
      showTab(lsGet('vibetop:lb:tab') || 'mine');
      renderAll();
    }
  });

  el('mineSeg').querySelectorAll('button').forEach(function(x) {
    x.classList.toggle('on', x.getAttribute('data-b') === mineBoard);
  });
  showTab(lsGet('vibetop:lb:tab') || 'mine');
  renderAll();
})();
</script>
</body>
</html>
